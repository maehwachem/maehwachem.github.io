- name: shortlinks
  label: 짧은 주소
  type: file
  path: content/shortlinks.json
  format: json
  fields:
  - name: links
    label: 짧은 주소 목록
    description: '예: key가 gas이면 kjelab.kr/gas 로 열립니다. 목록은 kjelab.kr/links 에서 볼 수 있습니다.'
    type: object
    list:
      collapsible:
        collapsed: true
        summary: /{key} → {label}
    fields:
    - name: key
      label: 짧은 이름
      type: string
      required: true
      description: 영문 소문자·숫자·하이픈(-)만. admin, assets, content, links, science-tools, interview-note는 쓰지 마세요.
      pattern:
        regex: ^[a-z0-9-]{1,30}$
        message: 영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요.
    - name: label
      label: 이름(설명)
      type: string
      required: true
    - name: path
      label: 연결할 사이트 안 경로
      type: string
      required: true
      description: '''/''로 시작하는 이 사이트 안의 경로. 예: /science-tools/gas/'
      pattern:
        regex: ^/[^/].*
        message: '''/''로 시작하는 사이트 안 경로만 쓸 수 있어요.'
    - name: param
      label: 뒤에 붙는 값 이름 (선택)
      type: string
      description: '예: ex 이면 /ar/전시이름 → ?ex=전시이름. 보통은 비워 둡니다.'
- name: posts
  label: 글·사진 쓰기
  type: file
  path: content/posts.json
  format: json
  fields:
  - name: display_order
    label: 홈페이지 표시 순서
    type: select
    default: manual
    required: true
    options:
      values:
      - name: manual
        label: 직접 배치 — 아래 목록 순서대로
      - name: newest
        label: 최신순 — 게시일이 최근인 순서대로
    description: 직접 배치에서는 아래 목록을 끌어 순서를 정합니다. 분류 안에서도 같은 순서가 유지됩니다. 최신순에서는 게시일이 없는 항목이 뒤에 표시됩니다.
  - name: show_dates
    label: 홈페이지에 게시일 표시
    type: boolean
    default: true
    description: 끄면 날짜를 숨깁니다. 표시 순서에는 영향을 주지 않습니다.
  - name: posts
    label: 글과 사진
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{index}. {title}'
    fields:
    - name: id
      label: 글 고유번호
      type: uuid
      hidden: true
      options:
        editable: false
        generate: false
    - name: title
      label: 글 제목
      type: string
      required: true
    - name: date
      label: 게시일 (업로드 날짜)
      type: date
      required: true
      options:
        format: yyyy-MM-dd
      description: 새 글은 오늘 날짜로 시작합니다. 필요하면 바꾸세요. 순서 변경이나 본문 수정 시에는 기존 날짜를 유지합니다.
    - name: category
      label: 분류
      type: select
      default: 생각과 기록
      required: true
      options:
        values:
        - 수업·탐구
        - 디지털 제작
        - 생각과 기록
        - 사진
        - 텃밭
        - 별보기
        - 술 빚기
    - name: summary
      label: 목록에 보일 짧은 소개
      type: text
    - name: cover
      label: 대표 사진
      type: image
    - name: cover_alt
      label: 대표 사진 설명
      type: string
    - name: body
      label: 본문
      type: rich-text
      required: true
      options:
        format: html
        switcher: false
    description: 왼쪽 점 모양 손잡이를 위아래로 끌어 글의 순서를 바꾼 뒤 Save를 누르세요. 직접 배치를 선택해야 홈페이지에 이 순서가 반영됩니다.
