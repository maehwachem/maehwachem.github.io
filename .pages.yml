# Pages CMS: edit with the repository owner account; do not invite collaborators.
media:
  input: assets/uploads
  output: /assets/uploads
  rename: random
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
content:
- name: site
  label: 소개·홈페이지 설정
  type: file
  path: content/site.json
  format: json
  fields:
  - name: title
    label: 홈페이지 이름
    type: string
    required: true
  - name: name
    label: 표시 이름
    type: string
    required: true
  - name: character
    label: 상단 캐릭터
    type: image
  - name: lead
    label: 첫 소개 문구
    type: text
    required: true
  - name: bio
    label: 소개 내용
    type: text
  - name: email
    label: 연락받을 이메일
    type: string
    required: true
    pattern:
      regex: ^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$
      message: 이메일 주소를 확인해 주세요.
  - name: background_title
    label: 소개 상자 제목
    type: string
    default: 소개
    required: true
    description: '예: 소개 / 관심과 경험 / 작업실 소개'
  - name: background
    label: 소개 항목
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
    fields:
    - name: label
      label: 항목 이름
      type: string
      required: true
    - name: text
      label: 내용
      type: text
      required: true
  - name: explorations
    label: 탐구 소개
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: 제목
      type: string
      required: true
    - name: text
      label: 내용
      type: text
    - name: link_label
      label: 링크 버튼 이름
      type: string
    - name: link
      label: 연결 주소
      type: string
      pattern: &id001
        regex: ^(https?://|/|#|mailto:).+
        message: https:// 로 시작하는 주소 또는 / 로 시작하는 페이지 경로를 입력해 주세요.
  - name: interests_title
    label: 일상 관심 제목
    type: string
  - name: interests_text
    label: 일상 관심 소개
    type: text
  - name: interests
    label: 관심 주제
    type: string
    list: true
- name: projects
  label: 프로젝트 관리
  type: file
  path: content/projects.json
  format: json
  fields:
  - name: display_order
    label: 홈페이지 표시 순서
    type: select
    default: manual
    required: true
    options:
      values:
      - name: manual
        label: 직접 배치 — 아래 목록 순서대로
      - name: newest
        label: 최신순 — 게시일이 최근인 순서대로
    description: 직접 배치에서는 아래 목록을 끌어 순서를 정합니다. 분류 안에서도 같은 순서가 유지됩니다. 최신순에서는 게시일이 없는 항목이 뒤에 표시됩니다.
  - name: show_dates
    label: 홈페이지에 게시일 표시
    type: boolean
    default: true
    description: 끄면 날짜를 숨깁니다. 표시 순서에는 영향을 주지 않습니다.
  - name: projects
    label: 프로젝트
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{index}. {title}'
    fields:
    - name: title
      label: 프로젝트 이름
      type: string
      required: true
    - name: date
      label: 게시일 (업로드 날짜)
      type: date
      default: ''
      options:
        format: yyyy-MM-dd
      description: 처음 게시한 날짜를 선택하세요. 날짜를 모르는 기존 프로젝트는 비워 두면 표시되지 않습니다.
    - name: kind
      label: 카테고리
      type: select
      required: true
      options:
        values:
        - name: lab
          label: 가상실험
        - name: real
          label: 실제 실험 수업
        - name: game
          label: 학습 게임
        - name: tool
          label: 교육 도구
        - name: lesson
          label: 수업 자료
    - name: desc
      label: 설명
      type: text
      required: true
    - name: tag
      label: 주제 태그
      type: string
      description: '예: 산과 염기 · 중화 적정'
    - name: level
      label: 대상 학교급·과목
      type: string
      description: '예: 고등학교 통합과학, 화학 / 중학교 과학, 고등학교 화학. 비워 두면 표시하지 않습니다.'
    - name: cover
      label: 대표 이미지
      type: image
      description: 선택 사항입니다. 비워 두면 아래 표지 스타일을 사용합니다.
    - name: poster
      label: 기본 표지 스타일
      type: select
      default: note
      options:
        values:
        - name: lab
          label: 실험
        - name: gas
          label: 기체
        - name: heat
          label: 열화학
        - name: rate
          label: 반응 속도
        - name: equil
          label: 화학 평형
        - name: battery
          label: 배터리
        - name: island
          label: 섬
        - name: power
          label: 전기
        - name: note
          label: 노트
        - name: earth
          label: 지구
        - name: acid
          label: 산과 염기
        - name: glass
          label: 실험도구
        - name: solution
          label: 용액과 농도
        - name: sensor
          label: 센서
        - name: heart
          label: 하트
        - name: star
          label: 별자리
    - name: words
      label: 기본 표지에 들어갈 글자
      type: text
      description: 줄바꿈을 넣을 수 있습니다. 비워 두면 프로젝트 이름이 표시됩니다.
    - name: links
      label: 연결할 링크
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      fields:
      - name: label
        label: 버튼 이름
        type: string
        required: true
      - name: url
        label: 연결 주소
        type: string
        required: true
        pattern: *id001
      description: 링크가 없으면 홈페이지에 공개 준비 중으로 표시됩니다.
    description: 왼쪽 점 모양 손잡이를 위아래로 끌어 프로젝트의 순서를 바꾼 뒤 Save를 누르세요. 직접 배치를 선택해야 홈페이지에 이 순서가 반영됩니다.
- name: posts
  label: 글·사진 쓰기
  type: file
  path: content/posts.json
  format: json
  fields:
  - name: display_order
    label: 홈페이지 표시 순서
    type: select
    default: manual
    required: true
    options:
      values:
      - name: manual
        label: 직접 배치 — 아래 목록 순서대로
      - name: newest
        label: 최신순 — 게시일이 최근인 순서대로
    description: 직접 배치에서는 아래 목록을 끌어 순서를 정합니다. 분류 안에서도 같은 순서가 유지됩니다. 최신순에서는 게시일이 없는 항목이 뒤에 표시됩니다.
  - name: show_dates
    label: 홈페이지에 게시일 표시
    type: boolean
    default: true
    description: 끄면 날짜를 숨깁니다. 표시 순서에는 영향을 주지 않습니다.
  - name: posts
    label: 글과 사진
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{index}. {title}'
    fields:
    - name: id
      label: 글 고유번호
      type: uuid
      hidden: true
      options:
        editable: false
        generate: false
    - name: title
      label: 글 제목
      type: string
      required: true
    - name: date
      label: 게시일 (업로드 날짜)
      type: date
      required: true
      options:
        format: yyyy-MM-dd
      description: 새 글은 오늘 날짜로 시작합니다. 필요하면 바꾸세요. 순서 변경이나 본문 수정 시에는 기존 날짜를 유지합니다.
    - name: category
      label: 분류
      type: select
      default: 생각과 기록
      required: true
      options:
        values:
        - 수업·탐구
        - 디지털 제작
        - 생각과 기록
        - 사진
        - 텃밭
        - 별보기
        - 술 빚기
    - name: summary
      label: 목록에 보일 짧은 소개
      type: text
    - name: cover
      label: 대표 사진
      type: image
    - name: cover_alt
      label: 대표 사진 설명
      type: string
    - name: body
      label: 본문
      type: rich-text
      required: true
      options:
        format: html
        switcher: false
    description: 왼쪽 점 모양 손잡이를 위아래로 끌어 글의 순서를 바꾼 뒤 Save를 누르세요. 직접 배치를 선택해야 홈페이지에 이 순서가 반영됩니다.
