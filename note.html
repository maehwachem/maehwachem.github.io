<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<meta name="description" content="손글씨와 키보드 메모를 한 페이지에 담는 개인 필기장">
<title>종이노트 · KJE의 작업실</title>
<style>
:root{color-scheme:light;--ink:#262740;--muted:#66667a;--subtle:#79798b;--line:#e9e6e1;--canvas:#f1efea;--white:#fcfbf8;--accent:#5143a4;--deep:#352775;--tint:#eeebfa;--serif:"Baskervville","Nanum Myeongjo","Noto Serif CJK KR",Georgia,serif;--sans:"Instrument Sans","Pretendard","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100dvh;min-height:280px;background:var(--white);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #7560ca;outline-offset:3px}
button:disabled{cursor:default;opacity:.34}
svg{display:block;width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:262px minmax(0,1fr);height:100%;height:100dvh}
.sidebar{background:#fbfaf7;border-right:1px solid #e7e3de;display:flex;flex-direction:column;min-height:0;padding:27px 18px 15px}
.brand{display:flex;align-items:center;gap:10px;margin:0 8px 31px;text-align:left}
.brand-mark{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;background:var(--tint);color:var(--accent)}
.brand-mark svg{width:22px;height:22px}
.brand strong{font-weight:770;font-size:20px;letter-spacing:-.075em}
.primary{background:var(--accent);color:#fff;border-radius:9px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;min-height:40px}
.primary:hover{background:var(--deep)}
.sidebar .primary{width:100%}
.search{position:relative;margin:15px 0 23px;color:var(--subtle)}
.search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;pointer-events:none}
.search input{background:#f6f4ef;border:1px solid #eeebe5;height:36px;border-radius:8px;width:100%;padding:0 9px 0 32px;color:var(--ink)}
.search input::placeholder{color:#757487}
.section-heading{font-weight:700;font-size:12px;color:var(--muted);padding:0 7px;margin:0 0 7px;letter-spacing:.005em}
.folders,.note-list{display:grid;gap:4px}
.folders button,.note-card{display:flex;align-items:center;gap:9px;text-align:left;width:100%;border-radius:8px;padding:8px 9px;min-height:37px}
.folders button:hover,.note-card:hover{background:#f1eee9}
.folders button.active{color:var(--deep);background:var(--tint);font-weight:720}
.folders svg{width:17px;height:17px}
.folder-count{margin-left:auto;color:var(--muted);font-size:11px}
.note-section{min-height:80px;flex:1;display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:17px;margin-top:16px}
.note-list{overflow:auto;padding:1px 4px 5px}
.note-card{padding:8px;align-items:flex-start}
.note-card svg{width:15px;height:15px;margin-top:3px;color:#777495}
.note-card.active{background:#f0edf9;box-shadow:inset 0 0 0 1px #e7e0f7}
.note-card.active svg{color:var(--accent)}
.note-text{display:grid;flex:1;min-width:0}
.note-text strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-text small,.empty-list{font-size:11px;color:var(--muted)}
.empty-list{padding:4px 6px}
.local-info{border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;margin-top:10px;padding:13px 6px 0;color:var(--muted);font-size:11px}
.local-info svg{width:15px;height:15px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.top-bar{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 29px;border-bottom:1px solid var(--line);gap:12px}
.breadcrumb,.top-actions{display:flex;align-items:center;gap:10px;min-width:0}
.breadcrumb{color:var(--muted);white-space:nowrap}
.breadcrumb svg{width:14px;height:14px;color:#8d8b9a}
.breadcrumb strong{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.save-state{white-space:nowrap;font-size:12px;color:#52645b;display:flex;align-items:center;gap:6px}
.save-state svg{width:15px;height:15px}
.save-state.error{color:#a43440}
.secondary,.icon-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:35px;border-radius:8px;padding:0 10px;color:var(--ink)}
.secondary{border:1px solid #e4e0da;background:#fefdfa;font-weight:650}
.secondary:hover,.icon-button:hover:not(:disabled){background:#eeebf4}
.secondary svg,.icon-button svg{width:17px;height:17px}
.icon-button{width:36px;padding:0}
.mobile-menu{display:none}
.doc-head{height:101px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 32px 10px;flex:none}
.source-label{display:inline-block;vertical-align:bottom;max-width:min(310px,45vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:8px;color:var(--accent)}
.doc-meta{margin:0 0 2px;color:var(--muted);font-size:12px}
.title-input{border:0;background:transparent;display:block;font-size:clamp(22px,3.2vw,33px);font-weight:760;letter-spacing:-.065em;padding:0 2px 2px 0;width:min(61vw,650px);max-width:100%;line-height:1.28;text-overflow:ellipsis}
.doc-name{min-width:0}
.title-input::placeholder{color:#626178}
.workspace{background:var(--canvas);border-top:1px solid #e9e5df;display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.bar-zone{container-type:inline-size;padding:14px 9px 11px;display:flex;justify-content:center;flex:none;z-index:3}
.toolbar{display:flex;align-items:center;gap:4px;padding:5px;border:1px solid #e5e0d9;border-radius:11px;background:#fefdfa;box-shadow:0 2px 6px #3127490b;max-width:100%}
.tool-group{display:flex;align-items:center;gap:2px;flex:none}
.tool-group.colors{gap:4px;padding:0 3px}
.tool-divider{width:1px;height:22px;margin:0 4px;background:var(--line);flex:none}
.tool{display:grid;place-items:center;width:35px;height:34px;border-radius:7px;color:#515168;position:relative}
.tool svg{width:19px;height:19px}
.tool:hover:not(:disabled){background:#f2eff8}
.tool[aria-pressed=true]{background:var(--tint);color:var(--deep)}
.tool.finger-mode{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:auto;flex:none;white-space:nowrap;padding:0 7px;font-size:12px;font-weight:700;border:1px solid #e4ddef;background:#f8f5fc;color:var(--deep)}
.finger-mode svg{width:17px;height:17px}
.finger-mode[aria-pressed=true]{background:var(--deep);color:#fff;border-color:var(--deep)}
.finger-mode[aria-pressed=true]:hover{background:var(--accent);color:#fff}
.swatch{width:26px;height:29px;display:grid;place-items:center;border:1px solid transparent;border-radius:8px}
.swatch i{width:13px;height:13px;display:block;border-radius:50%;background:var(--swatch);box-shadow:0 0 0 1px #28193b13}
.swatch[aria-pressed=true],.swatch:hover{border-color:#d8cfee;background:#f5f1fc}
.tool-select{border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 2px;max-width:68px;font-size:12px;cursor:pointer}
.tool-select:hover{border-color:#e7e0f1}
.scroller{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;position:relative;touch-action:none}
.paper-deck{width:max-content;min-width:100%;padding:14px 22px 35px;display:grid;justify-items:center}
.paper-frame{position:relative;background:#fffdf8;border:1px solid #e8e2d9;border-radius:3px;box-shadow:0 4px 12px #2b244016,0 1px 1px #2b244012;box-sizing:content-box;overflow:hidden}
.paper{width:760px;height:1010px;position:absolute;inset:0 auto auto 0;transform-origin:top left;background-color:#fffdf8;overflow:hidden}
.paper.lines{background-image:linear-gradient(to bottom,transparent 28px,#e8e2ef 28px,#e8e2ef 29px,transparent 29px);background-size:100% 32px}
.paper.grid{background-image:linear-gradient(to bottom,#e8e2ef 1px,transparent 1px),linear-gradient(to right,#e8e2ef 1px,transparent 1px);background-size:24px 24px}
.paper.dots{background-image:radial-gradient(#d6cee0 1.05px,transparent 1.1px);background-size:22px 22px}
.paper.margin-line::before{content:"";position:absolute;inset:0 auto 0 46px;width:1px;background:#edcbd2}
.ink-layer,.text-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#activeInk{pointer-events:auto;touch-action:none;cursor:crosshair}
.paper[data-tool=select] #activeInk{cursor:default}
.paper[data-tool=lasso][data-selection=true] #activeInk{cursor:grab}
.paper[data-tool=lasso][data-moving=true] #activeInk{cursor:grabbing}
.selection-actions{position:absolute;z-index:3;right:16px;bottom:56px;display:flex;align-items:center;gap:5px;padding:5px 6px 5px 10px;background:#fffefa;border:1px solid #e1dbec;border-radius:9px;box-shadow:0 4px 18px #30254c21}
.selection-actions output{font-size:12px;color:var(--muted);white-space:nowrap}
.selection-actions .secondary{min-height:32px;font-size:12px;padding-inline:8px}
.page-counter{display:inline-flex;justify-content:center;align-items:center;gap:4px;border-radius:7px;min-height:32px;padding:0 4px}
.page-counter svg{width:13px;height:13px}
.page-counter:hover{background:var(--tint);color:var(--deep)}
.page-overview{width:min(680px,calc(100% - 24px));padding:16px 18px;max-height:84dvh}
.overview-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.overview-head .dialog-title{margin:0}
.page-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;max-height:min(64dvh,560px);overflow:auto;padding:2px 3px 5px}
.page-tile{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;padding:6px;background:#f5f2ed;border:1px solid #e9e3db;border-radius:9px}
.page-tile:has([aria-current=true]){background:var(--tint);border-color:#cfc4e9}
.page-preview{display:grid;justify-items:center;gap:4px;padding:3px 0 0;border-radius:6px;width:100%;font-size:12px;font-weight:700}
.page-preview:hover{color:var(--accent)}
.page-miniature{display:block;width:min(100%,115px);height:auto;aspect-ratio:760/1010;background:#fffdf8;border-radius:2px;box-shadow:0 1px 3px #33304c21}
.page-miniature svg{stroke:var(--muted)}
.page-order{display:flex;justify-content:center;gap:6px}
.page-order .icon-button{min-height:30px;width:31px}
@media(max-width:450px){.page-overview{padding:12px}.page-tiles{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}.selection-actions{right:8px;bottom:52px}.page-counter{gap:2px}}
@media(max-width:345px){.page-counter svg{display:none}}
@media(max-width:359px){.page-actions .page-add{margin-left:1px}.page-actions .page-add svg{display:none}.page-actions .page-counter{min-width:42px}.zoom-actions .paper-select{max-width:63px}.zoom-actions .zoom-value{min-width:31px}}
.paper[data-tool=eraser] #activeInk{cursor:none}
.eraser-cursor{position:absolute;left:0;top:0;border:1px solid #37323f;box-shadow:0 0 0 1px #fffdf8a6;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.paper[data-tool=text] #activeInk{cursor:text}

.annotation{position:absolute;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;padding:0;font-weight:500;line-height:1.25;cursor:default}
.annotation[data-style=heading]{font-family:var(--serif);font-weight:700;letter-spacing:-.045em}
.annotation[data-style=label]{font-weight:750;letter-spacing:.01em}
.paper:is([data-tool=select],[data-tool=text]) .annotation,.paper:is([data-tool=select],[data-tool=text]) .annotation-tools{pointer-events:auto;cursor:pointer}
.paper:is([data-tool=select],[data-tool=text]) .annotation:hover,.annotation.selected{outline:1px dashed #a99bce;outline-offset:5px}
.annotation-tools{position:absolute;display:flex;gap:2px;padding:2px;border:1px solid #e5ddee;background:#fefdfa;border-radius:7px;box-shadow:0 2px 6px #2b244016}
.annotation-tools button{width:36px;height:32px;display:grid;place-items:center;border-radius:5px}
.annotation-tools button:hover{background:var(--tint)}
.annotation-tools svg{width:20px;height:20px}
.annotation-tools #moveText{cursor:grab;touch-action:none}
.bottom-bar{border-top:1px solid #e5e1da;background:#f9f7f2;min-height:48px;padding:4px 24px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.page-actions,.zoom-actions{display:flex;align-items:center;gap:4px;white-space:nowrap}
.bottom-bar .icon-button{width:31px;min-height:32px}
.page-counter{font-size:12px;color:var(--muted);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.page-add{margin-left:8px}
.zoom-value{font-variant-numeric:tabular-nums;min-width:42px;font-size:12px;line-height:30px;border-radius:6px;color:var(--muted)}
.zoom-value:hover{background:var(--tint)}
.paper-select{max-width:115px}
.menu-wrap{position:relative;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;min-width:174px;padding:5px;border:1px solid #e7e1da;background:#fffefa;border-radius:10px;box-shadow:0 7px 20px #342a4f24}
.menu button{display:flex;align-items:center;gap:8px;text-align:left;width:100%;min-height:36px;padding:5px 8px;border-radius:6px;font-size:13px;white-space:nowrap}
.menu button:hover{background:var(--tint)}
.file-option{position:relative;display:flex;align-items:center;gap:8px;min-height:38px;padding:5px 8px;border-radius:6px;font-size:13px;white-space:nowrap;cursor:pointer}
.file-option:hover,.file-option:focus-within{background:var(--tint)}
.file-option:focus-within{outline:2px solid #7560ca;outline-offset:-2px}
.file-option input{position:absolute;inset:0;width:100%;height:100%;padding:0;opacity:0;cursor:pointer}
.menu svg{width:16px;height:16px}
.menu .danger{color:#a42f3e}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px}
dialog{background:#fffefa;border:1px solid #e7e0d9;color:var(--ink);border-radius:15px;padding:20px;width:min(450px,calc(100% - 26px));max-height:90dvh;box-shadow:0 10px 60px #30274444}
dialog::backdrop{background:#29243a55}
.dialog-title{font-size:19px;margin:0 0 14px;letter-spacing:-.04em}
.dialog-label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.dialog-input{display:block;border:1px solid #ddd7d0;border-radius:8px;background:#fff;width:100%;padding:8px 10px;min-height:38px;font-size:16px}
textarea.dialog-input{min-height:130px;resize:vertical;line-height:1.5}
.dialog-row{display:flex;gap:10px;margin-top:12px}
.dialog-row>label{flex:1}
.dialog-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:16px}
.dialog-actions .secondary{min-height:40px}
.danger-primary{background:#a43443}
.danger-primary:hover{background:#852632}
.toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);text-align:center;padding:8px 14px;border-radius:8px;background:#30264f;color:white;font-size:13px;z-index:20;box-shadow:0 3px 15px #201a3455;pointer-events:none}
.shade{display:none}
.print-page{display:none}
.file-progress{width:100%;height:13px;accent-color:var(--accent)}
.file-progress-label{color:var(--muted);font-size:13px;min-height:20px;margin:9px 0 0}
@media(max-width:680px){#mediaToggle,#exportToggle{white-space:nowrap}}
@media(max-width:860px){.app{grid-template-columns:219px minmax(0,1fr)}.sidebar{padding-inline:13px}.top-bar{padding-inline:16px}.doc-head{padding-inline:19px}.title-input{width:min(63vw,650px)}}
@media(max-width:680px){.app{display:flex}.main{width:100%}.sidebar{position:fixed;z-index:14;inset:0 auto 0 0;width:min(82vw,284px);transform:translateX(-105%);transition:transform .18s ease}.app.open .sidebar{transform:translateX(0)}.app.open .shade{display:block;position:fixed;inset:0;background:#27203866;z-index:13}.mobile-menu{display:inline-flex}.top-bar{height:51px;padding-inline:8px}.breadcrumb,.top-actions{gap:5px}.breadcrumb>span,.breadcrumb>#chev{display:none}.top-actions .secondary{padding:0 7px}.save-state{font-size:12px}.doc-head{height:78px;padding-inline:12px}.title-input{width:70vw}.bar-zone{padding:8px 3px 3px}.toolbar{gap:2px;padding:3px;justify-content:center;flex-wrap:wrap}.tool{width:32px;height:34px}.tool-divider{margin:0 2px}.tool-group.colors{gap:0;padding:0 1px}.swatch{width:24px;height:30px}.tool-select{max-width:61px}.paper-deck{padding:11px 8px 22px}.bottom-bar{padding-inline:6px;gap:4px}.page-actions,.zoom-actions{gap:0}.page-add{margin-left:4px}.page-counter{min-width:48px}.zoom-value{min-width:35px}.paper-select{max-width:80px}.bottom-bar .icon-button{width:27px}.bottom-bar .secondary{font-size:11px;padding-inline:5px}}
@container(max-width:645px){
  .toolbar{display:grid;grid-template-columns:auto auto auto;column-gap:8px;row-gap:3px}
  .toolbar .tool-divider{display:none}
  .toolbar #tools{grid-column:1/3;grid-row:1}
  .toolbar .history-tools{grid-column:3;grid-row:1;justify-self:end}
  .toolbar .finger-mode{grid-column:1;grid-row:2;justify-self:start;min-height:34px}
  .toolbar .colors{grid-column:2;grid-row:2;justify-self:center;gap:4px}
  .toolbar>label{grid-column:3;grid-row:2;justify-self:end}
  .toolbar .swatch{height:28px}
}
@media(max-width:375px){.save-state span{display:none}.save-state.error span{display:inline}.bottom-bar .secondary{gap:2px}.page-add svg{width:13px}.tool-group.colors .swatch{width:24px}.zoom-actions .paper-select{max-width:63px}.zoom-actions .zoom-value{min-width:31px}}
@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}
@page{size:A4 portrait;margin:8mm}
@media print{body{height:auto;overflow:visible;background:white}.app,.toast,dialog{display:none!important}.print-page{display:block;width:194mm;height:auto;margin:0;break-inside:avoid}}
.shape-menu{position:fixed;z-index:12;top:0;left:0;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px;background:#fffefa;border:1px solid #dfd6ec;border-radius:10px;box-shadow:0 6px 24px #30254c25;min-width:220px}
.shape-menu button{min-height:40px;border-radius:6px;padding:6px 12px;text-align:left}.shape-menu button:hover,.shape-menu button[aria-pressed=true]{background:var(--tint);color:var(--deep)}
.page-extra{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}.page-extra button{min-height:32px;border-radius:5px;background:#fffdfa;padding:3px 7px;font-size:11px}.page-extra button:hover{background:var(--tint)}
.delete-notice{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);z-index:22;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 20px);padding:9px 10px 9px 14px;background:#fffefa;border:1px solid #d8cceb;border-radius:10px;box-shadow:0 5px 25px #30254c30}
.delete-notice strong{font-size:13px;font-weight:600;display:block}.delete-notice small{display:block;font-size:11px;color:var(--muted)}.delete-notice .secondary{min-height:36px;padding:4px 9px;white-space:nowrap}.delete-notice .icon-button{width:28px;min-height:32px;font-size:22px}body.has-delete-undo .toast{bottom:120px}
@media(max-width:680px){.delete-notice{gap:6px;padding:8px;min-width:min(350px,calc(100vw - 20px))}.delete-notice small{font-size:10px}}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="shade" id="shade" aria-label="노트 목록 닫기"></button>
  <aside class="sidebar" id="sidebar" aria-label="노트 목록">
    <a class="brand" href="/" aria-label="KJE의 작업실로 돌아가기" style="text-decoration:none;color:inherit"><span class="brand-mark" data-icon="brand"></span><strong>종이노트</strong></a>
    <button class="primary" id="addNote"><span data-icon="plus"></span> 새 노트</button>
    <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="노트 검색" aria-label="노트 검색" autocomplete="off"></label>
    <section aria-labelledby="libraryLabel">
      <h2 class="section-heading" id="libraryLabel">노트함</h2>
      <div class="folders" id="folders"></div>
    </section>
    <section class="note-section" aria-labelledby="notesLabel">
      <h2 class="section-heading" id="notesLabel">노트 목록</h2>
      <div class="note-list" id="notes"></div>
    </section>
    <div class="local-info"><span data-icon="device"></span> 이 브라우저에 저장</div>
  </aside>
  <main class="main">
    <header class="top-bar">

      relink(page);
      if ([page.id, ...page.texts.map((item) => item.id)].some((value) => allIds.has(value))) page = duplicatePageData(page);

        if (state.notes.length >= 1000) throw Error('노트는 1000개까지 보관할 수 있어요.');

    if (!sourceBlobs.has(key)) {
      const body = fromDataUrl(assets.get(key));
      const head = new Uint8Array(await body.slice(0, 3).arrayBuffer());
      if (head[0] !== 255 || head[1] !== 216 || head[2] !== 255) throw Error('백업의 페이지 자료가 손상됐어요.');
      sourceBlobs.set(key, body);
    }
    return sourceBlobs.get(key);
  };
  const storedBlob = (key) => {
    if (!storedBlobs.has(key)) {
      storedBlobs.set(key, media().then((store) => store.assetBlob(key)).catch((error) => {
        if (error.message === '이 페이지의 원본 자료를 찾을 수 없어요.') return null;
        throw error;
      }));
    }
    return storedBlobs.get(key);
  };
  const newAsset = async (key) => {
    if (!entries.has(key)) entries.set(key, [id(), await sourceBlob(key)]);
    return entries.get(key)[0];
  };
  for (const [index, source] of notes.entries()) {
    checkFileCancellation(signal);
    const content = restoredContent(source);
    const copyTitle = (titleOf(source) + ' (가져옴)').slice(0, 100);
    let match;
    for (const candidate of existing) {
      if (candidate.id !== source.id && candidate.restoredFrom !== source.id) continue;
      const title = candidate.id !== source.id && candidate.title === copyTitle ? source.title : candidate.title;
      if (restoredContent(candidate, title) !== content) continue;
      const missing = [];
      let identical = true;
      for (const [pageIndex, page] of source.pages.entries()) {
        if (!page.background) continue;
        checkFileCancellation(signal);
        const current = await storedBlob(candidate.pages[pageIndex].background.id);
        const incoming = await sourceBlob(page.background.id);
        if (!current) missing.push(pageIndex);
        else if (!await equalAssetBytes(current, incoming)) { identical = false; break; }
      }
      if (identical) { match = { note: candidate, missing }; break; }
    }
    if (match) {
      if (match.missing.length) {
        const note = JSON.parse(JSON.stringify(match.note));
        for (const pageIndex of match.missing) {
          note.pages[pageIndex].background.id = await newAsset(source.pages[pageIndex].background.id);
        }
        repaired.set(note.id, note);
      }
    } else {
      const note = JSON.parse(JSON.stringify(source));
      const noteIds = [note.id, ...note.pages.flatMap((page) => [page.id, ...page.texts.map((item) => item.id)])];
      if (noteIds.some((value) => existingIds.has(value))) {
        note.restoredFrom = source.id;
        note.id = id();
        note.title = copyTitle;
        for (const page of note.pages) {
          const old = page.id;
          page.id = id();
          if (old === note.active) note.active = page.id;
          for (const item of page.texts) item.id = id();
        }
      }
      for (const page of note.pages) {
        if (page.background) page.background.id = await newAsset(page.background.id);
      }
      for (const value of [note.id, ...note.pages.flatMap((page) => [page.id, ...page.texts.map((item) => item.id)])]) existingIds.add(value);
      imported.push(note);
    }
    progress(index + 1, notes.length, '개');
  }
  return { imported, repaired, entries: [...entries.values()] };
}
async function exportBackup() {
  const blob = await runFileWork('전체 노트 백업 중', async (progress, signal) => {
    const keys = [...assetKeys(state.notes)];
    const assets = [];
    if (keys.length) {
      const { assetBlob } = await media();
      for (const [index, key] of keys.entries()) {
        checkFileCancellation(signal);
        progress(index, keys.length, '개');
        assets.push({ id: key, data: await asDataUrl(await assetBlob(key)) });
      }
    }
    checkFileCancellation(signal);
    const data = JSON.stringify({ format: 'jeongi-note', version: assets.length ? 2 : 1, ...state,
      ...(assets.length ? { assets } : {}) });
    const result = new Blob([data], { type: 'application/json' });
    if (result.size > maxBackupBytes) throw Error('백업 파일이 160MB를 초과해요.');
    return result;
  }, '전체 노트를 백업하지 못했어요.');
  if (blob) download(blob, '종이노트-백업.json');
}
$('backupFile').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const count = await runFileWork('백업 가져오는 중', async (progress, signal) => {
    if (file.size > maxBackupBytes) throw Error('160MB 이하의 백업 파일을 선택해 주세요.');
    const raw = await file.text();
    let data, backup;
    try {
      data = JSON.parse(raw);
      if (data.format !== 'jeongi-note' || ![1, 2].includes(data.version)) throw Error();
      backup = parseState(data);
    } catch {
      throw Error('종이노트 백업 파일을 선택해 주세요.');
    }
    const expected = assetKeys(backup.notes);
    const assets = new Map();
    if (data.version === 2 && Array.isArray(data.assets)) {
      for (const item of data.assets) {
        if (!validAssetId(item?.id) || assets.has(item.id)) throw Error('백업의 페이지 자료가 손상됐어요.');
        assets.set(item.id, item.data);
      }
    }
    if ([...expected].some((key) => !assets.has(key))) throw Error('백업에 페이지 자료가 빠져 있어요.');
    const plan = await planBackupRestore(backup.notes, assets, state.notes, progress, signal);
    const count = plan.imported.length + plan.repaired.size;
    if (!count) return 0;
    if (state.notes.length + plan.imported.length > 1000) throw Error('노트는 1000개까지 보관할 수 있어요.');
    const note = await commitImport(plan.entries, () => {
      state.notes = state.notes.map((note) => plan.repaired.get(note.id) ?? note);
      state.notes.push(...plan.imported);
      return plan.imported[0] ?? plan.repaired.values().next().value;
    }, signal);
    filter = 'all';
    openImportedNote(note);
    return count;
  }, '백업을 가져오지 못했어요.');
  if (count === 0) toast('같은 노트가 이미 있어요.');
  else if (count) toast(`노트 ${count}개를 가져왔어요.`);
});
let onConfirm;

  },
  'delete-page': () => {

      const result = await runFileWork('삭제 내용 저장 중', () => deleteWithUndo('page', note.id, page.id), '페이지를 삭제하지 못했어요.');
      if (result) { openImportedNote(result); $('undoDelete').focus(); }
    });
  },
  'delete-note': () => {
    const note = currentNote();
    confirmDelete('이 노트를 삭제할까요?', `'${titleOf(note)}'을 삭제해요. 이 화면에서 10초 동안 되돌릴 수 있어요.`, async () => {
      const result = await runFileWork('삭제 내용 저장 중', () => deleteWithUndo('note', note.id), '노트를 삭제하지 못했어요.');
      if (result) { openImportedNote(result); $('undoDelete').focus(); }
    });
  }
};
const menus = [['mediaToggle','mediaMenu'], ['exportToggle','exportMenu'], ['docToggle','docMenu'], ['shapeToggle','shapeMenu']];
function showMenu(menuId = '') {
  for (const [toggle, menu] of menus) {
    $(menu).hidden = menu !== menuId;
    $(toggle).setAttribute('aria-expanded', menu === menuId);
  }
  if (menuId === 'shapeMenu') {
    const rect = $('shapeToggle').getBoundingClientRect();
    $('shapeMenu').style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 240)) + 'px';
    $('shapeMenu').style.top = Math.max(8, Math.min(rect.bottom + 6, window.innerHeight - 116)) + 'px';
  }
}
for (const [toggle, menu] of menus) {
  $(toggle).onclick = () => {
    const isOpen = !$(menu).hidden;
    showMenu(isOpen ? '' : menu);
    if (!isOpen) $(menu).querySelector('button:not(:disabled), input:not(:disabled)')?.focus();
  };
  $(menu).addEventListener('click', (event) => {
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (!action) return;
    showMenu();
    $(toggle).focus();
    actions[action]();
  });
}
document.addEventListener('click', (event) => { if (!event.target.closest('.menu-wrap, #shapeMenu, #shapeToggle')) showMenu(); });
window.addEventListener('resize', () => { if (!$('shapeMenu').hidden) showMenu(); });
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    const open = menus.find(([,menu]) => !$(menu).hidden);
    if (open) { showMenu(); $(open[0]).focus(); }
    else if ($('app').classList.contains('open')) { setSidebar(false); $('openSidebar').focus(); }
    else if (lassoSelection) resetLasso(true);
  }
  const shift = { ArrowLeft: [-8,0], ArrowRight: [8,0], ArrowUp: [0,-8], ArrowDown: [0,8] }[event.key];
  if (shift && tool === 'lasso' && lassoSelection && !lasso && !event.ctrlKey && !event.metaKey && !event.altKey &&
      !event.target.closest('input, textarea, select, dialog')) {
    event.preventDefault();
    placeLasso(...limitLassoDelta(...shift));
    return;
  }
  if (!(event.ctrlKey || event.metaKey) || event.altKey || event.target.closest('input, textarea, select, dialog')) return;
  const key = event.key.toLowerCase();
  if (!['z','y'].includes(key)) return;
  event.preventDefault();
  if (key === 'y' || event.shiftKey) undoRedo('redo','undo');
  else undoRedo('undo','redo');
});
