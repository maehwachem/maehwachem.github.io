  --serif: "Nanum Myeongjo", "AppleMyungjo", "Noto Serif KR", Georgia, serif;
  --top-edge: 76px;
  --dock-height: 160px;
  --aim-y: 50%;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
  background: #070a13; color: var(--ink); font-family: var(--sans);
  word-break: keep-all;
}
button, input { font: inherit; }
button {
  border: 1px solid var(--line); border-radius: 9px; min-height: 42px;
  padding: 7px 10px; color: var(--ink); background: #1c2640;
  font-size: 13px; line-height: 1.25; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:active { filter: brightness(1.19); }
button:focus-visible, input:focus-visible, .page summary:focus-visible {
  outline: 2px solid #d79f4f; outline-offset: 2px;
}
button.on { border-color: #deb57399; color: var(--gold); background: #3a3026; }
button.main { color: #2e210f; background: var(--gold); border-color: var(--gold); font-weight: 750; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: fixed; inset-inline: 0; pointer-events: none; z-index: 5; }
#top {
  top: 0; display: flex; justify-content: space-between; align-items: start; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 12px) max(14px, env(safe-area-inset-right))
    9px max(14px, env(safe-area-inset-left));
  background: linear-gradient(#080c17ed, #080c1700);
}
.hud-kicker { margin: 0 0 4px; color: var(--gold); font-size: 11px; font-weight: 750; letter-spacing: .08em; }
#clock { font-size: clamp(14px, 3.6vw, 19px); font-weight: 730; font-variant-numeric: tabular-nums; }
.loc { color: var(--muted); font-size: 12px; margin-top: 3px; }
.top-right { display: grid; justify-items: end; gap: 4px; }
#modeBtn { pointer-events: auto; min-height: 34px; padding-inline: 9px; font-size: 12px; }
#limbox { color: var(--muted); font-size: 11px; text-align: right; }
#limv { color: var(--ink); font-weight: 650; }
#reticle {
  position: fixed; left: 50%; top: var(--aim-y); transform: translate(-50%, -50%);
  width: 56px; height: 56px; z-index: 4; pointer-events: none;
}
#reticle svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 3px #050710); }
#info {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--dock-height) + 9px); max-width: min(92vw, 390px); width: max-content;
  min-width: min(210px, 90vw); padding: 11px 14px; background: #121b30f5;
  border: 1px solid #9badcf57; border-radius: 13px; text-align: center;
  box-shadow: 0 7px 30px #05070e80; visibility: hidden; pointer-events: none;
}
#info.show { visibility: visible; pointer-events: auto; }
#infoName { font-size: 17px; font-weight: 750; }
#infoSub { font-size: 12px; color: var(--muted); margin-top: 4px; }
#infoCue { font-size: 12px; color: var(--gold); margin-top: 4px; }
#infoGo { margin-top: 8px; min-height: 36px; }

#bottom {
  bottom: 0; padding: 6px max(10px, env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 8px) max(10px, env(safe-area-inset-left));
}
.dock {
  margin-inline: auto; max-width: 720px; padding: 8px; display: grid; gap: 7px;
  background: #101827fa; border: 1px solid #9badcf45; border-radius: 15px;
  box-shadow: 0 7px 32px #04060c80; pointer-events: auto;
}
#guide {
  min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 3px 5px 7px; border-bottom: 1px solid var(--line);
}
.guide-copy { min-width: 0; }
#guideStatus { display: block; color: var(--gold); font-size: 11px; font-weight: 740; }
#guideAction { display: block; margin-top: 2px; font-size: 13px; font-weight: 700; line-height: 1.36; }
#guideDetail { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.3; }
#guideNext { flex: 0 0 auto; min-height: 35px; padding-inline: 9px; font-size: 12px; }
.controls { display: grid; grid-template-columns: 1.18fr 1fr; gap: 6px; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; min-width: 0; }
.row button { min-width: 0; padding-inline: 3px; }
#datePanel {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--dock-height) + 9px); z-index: 8;
  width: min(94vw, 370px); padding: 12px; color: var(--ink); background: #141e33;
  border: 1px solid #9badcf73; border-radius: 12px;
}
#datePanel label { display: block; font-size: 13px; margin-bottom: 7px; font-weight: 700; }
.date-fields { display: flex; gap: 6px; align-items: stretch; }
#dateIn {
  flex: 1; min-width: 0; width: 100%; padding: 6px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--night); color: var(--ink); font-size: 14px;
}
#toast {
  position: fixed; left: 50%; top: calc(var(--top-edge) + 8px); transform: translateX(-50%);
  z-index: 35; padding: 9px 13px; width: max-content; max-width: min(90vw, 420px);
  color: var(--ink); background: #19243a; border: 1px solid #a8bad45c;
  border-radius: 10px; text-align: center; font-size: 13px; line-height: 1.4;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: 1; }
#toast.gold { color: var(--gold); border-color: #f4d3919c; }

#journal {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: end center;
  background: #050813a6; visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .22s;
}
#journal.open { visibility: visible; opacity: 1; pointer-events: auto; }
.page {
  position: relative; width: min(630px, 100%); max-height: 91dvh; overflow: auto;
  overscroll-behavior: contain; color-scheme: light; color: var(--paper-ink);
  padding: 19px max(18px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 18px)
    max(18px, env(safe-area-inset-left));
  background: linear-gradient(105deg, #e5d1ab, transparent 7%), var(--paper);
  border-top: 3px solid #b2864e; border-radius: 18px 18px 0 0;
  box-shadow: 0 -10px 48px #03050a75;
}
.journal-kicker { color: #72502a; font-size: 11px; letter-spacing: .09em; font-weight: 800; }
.page h2 { margin: 2px 70px 4px 0; font: 750 clamp(24px, 6vw, 34px)/1.22 var(--serif); }
.page .date { margin: 0; color: #66513a; font-size: 13px; }
.page .journal-quote {
  margin: 13px 0; padding-left: 11px; border-left: 2px solid #b98e5c;
  font: 500 15px/1.65 var(--serif);
}
.page .close { position: absolute; right: 14px; top: 14px; min-height: 35px; }
.page button { color: var(--paper-ink); background: #e8d8b8; border-color: #ad8a5f78; }
.page .travel { background: #433324; color: #fff3db; border-color: #433324; }
.page .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.page .acts button { flex: 1 1 125px; }
.journal-instructions {
  padding: 9px 11px; margin: 11px 0; border-radius: 9px;
  border: 1px solid #bda680; background: #fcf5e6; font-size: 13px; line-height: 1.55;
}
.journal-instructions strong { display: block; margin-bottom: 2px; }
.journal-progress { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: #6a4c2b; }
.journal-progress b { color: #47321d; font-size: 15px; }
.meter { display: flex; gap: 4px; }
.meter span { width: 16px; height: 5px; background: #d9c6a2; border-radius: 2px; }
.meter .filled { background: #8e6131; }
.task { border-bottom: 1px solid #8a6b4b47; }
.task summary {
  list-style: none; display: grid; grid-template-columns: 27px minmax(0, 1fr) auto;
  align-items: center; gap: 8px; min-height: 44px; padding: 5px 3px; cursor: pointer;
}
.task summary::-webkit-details-marker { display: none; }
.task .mk {
  width: 23px; height: 23px; display: grid; place-items: center;
  border: 1px solid #9f7a51; border-radius: 50%; color: #765734; font-size: 12px;
}
.task.done .mk { background: #5c452e; color: #fff3d9; border-color: #5c452e; }
.task .tt { font-size: 14px; font-weight: 750; }
.task .task-state { color: #755735; font-size: 11px; font-weight: 700; }
.task .hint, .task .frag {
  margin: 0 3px 8px 38px; padding: 7px 9px; font-size: 13px; line-height: 1.55;
  background: #fff7e6; border-radius: 7px;
}
.task .frag { color: #583e24; font-family: var(--serif); }
.ending { padding: 10px 12px; margin-top: 12px; border: 1px solid #ae8e64; border-radius: 10px; font-size: 14px; line-height: 1.6; }
.ending p { margin: 0 0 4px; }
.journal-reset { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.journal-reset button { min-height: 34px; font-size: 12px; }
#resetNote { color: #873d22; font-size: 12px; font-weight: 700; }

#intro {
  position: fixed; inset: 0; z-index: 40; display: flex; overflow: auto;
  padding: calc(env(safe-area-inset-top) + 16px) max(14px, env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 16px) max(14px, env(safe-area-inset-left));
  background: radial-gradient(ellipse at 65% 18%, #263454, transparent 60%), #0b1020;
}
#intro.hide { display: none; }
.cover {
  width: min(850px, 100%); margin: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .87fr);
  border: 1px solid #a2acc440; border-radius: 19px; overflow: hidden; box-shadow: 0 24px 70px #04050d99;
  background: #141d31;
}
.cover-copy { padding: clamp(18px, 4vw, 38px); }
.cover-kicker { color: var(--gold); font-size: 11px; letter-spacing: .1em; font-weight: 780; }
#intro h1 {
  margin: 8px 0 11px; color: #fff3d7;
  font: 750 clamp(30px, 7vw, 55px)/1.11 var(--serif); letter-spacing: -.045em;
}
.cover-story { color: #d6dded; font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
.choose { margin-bottom: 5px; color: var(--muted); font-size: 12px; }
.vs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.vs button { min-height: 52px; }
.vs small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; margin-top: 3px; }
#startBtn { margin-top: 10px; width: 100%; font-size: 15px; }
.mode-options { display: flex; gap: 6px; margin-top: 8px; }
.mode-options button { flex: 1; min-height: 34px; font-size: 12px; }
#modeNote { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }
.credit { margin: 10px 0 0; color: #b4bfd6; font-size: 10px; line-height: 1.45; }
.cover-art {
  position: relative; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(ellipse at 44% 34%, #38486c, transparent 70%), #121a30;
  border-left: 1px solid #a2acc438;
}
.cover-art svg { width: 100%; height: 100%; max-height: 455px; }
.cover-caption {
  position: absolute; left: 16px; bottom: 14px; color: #f4d391;
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
}
@media (max-width: 620px) {
  .controls { grid-template-columns: minmax(0, 1fr); }
  .cover { grid-template-columns: minmax(0, 1fr); }
  .cover-art { order: -1; height: clamp(92px, 22dvh, 165px); border-left: 0; border-bottom: 1px solid #a2acc438; }
  .cover-caption { bottom: 8px; font-size: 10px; }
}
@media (max-height: 440px) and (min-width: 500px) {
  #top { padding-top: calc(env(safe-area-inset-top) + 5px); padding-bottom: 5px; }
  .hud-kicker { margin-bottom: 2px; font-size: 10px; }
  #clock { font-size: 14px; }
  .loc, #limbox { font-size: 10px; }
  #modeBtn { min-height: 29px; }
  .controls { grid-template-columns: 1.18fr 1fr; }
  .row button { min-height: 35px; font-size: 11px; }
  .dock { padding: 5px; gap: 4px; }
  #guide { padding: 0 3px 4px; }
  #guideStatus { font-size: 10px; }
  #guideAction, #guideDetail { display: inline; font-size: 11px; }
  #guideDetail::before { content: " · "; }
  #guideNext { min-height: 29px; font-size: 11px; }
  #info { transform: none; left: max(8px, env(safe-area-inset-left)); min-width: 0; max-width: 30vw; text-align: left; padding: 7px; }
  #infoName { font-size: 13px; }
  #infoSub, #infoCue { font-size: 11px; }
  #infoGo { min-height: 29px; margin-top: 4px; }
  body[data-view="map"] #bottom { right: auto; width: min(260px, 44vw); padding-right: 4px; }
  body[data-view="map"] .controls { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  body[data-view="map"] #guideAction, body[data-view="map"] #guideDetail { display: block; }
  body[data-view="map"] #guideDetail::before { content: none; }
  body[data-view="map"] #info { max-width: min(40vw, 236px); }
  .cover { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  .cover-copy { padding: 14px; }
  .cover-art { order: initial; height: auto; }
  #intro h1 { margin: 4px 0; font-size: 27px; }
  .cover-story { margin-bottom: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
/* Ink, paper, and brass fittings for the observation log. */
:root {
  --serif: "Rooftop Journal Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --hand: "Rooftop Journal Ink", "AppleMyungjo", serif;
  --paper: #f5e7c8;
  --paper-ink: #3a2b1f;
  --ink-writing: #243e50;
  --brass: #cba56b;
}
.cover {
  width: min(940px, 100%);
  grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
  border: 1px solid #d5b27d80;
  border-radius: 9px;
  background: radial-gradient(ellipse at 30% 3%, #29303b, #121827 62%);
  box-shadow: 0 25px 80px #04050dba, 0 0 0 4px #ad915b17;
}
.cover-copy {
  position: relative; z-index: 1;
  padding: clamp(22px, 4vw, 40px);
}
.cover-copy::before {
  content: ""; position: absolute; inset: 8px; z-index: -1; pointer-events: none;
  border: 1px solid #d3b17836; border-radius: 4px;
}
.cover-kicker { color: #e9c48a; letter-spacing: .15em; }
#intro h1 {
  margin-block: 10px 13px; color: #ffedd1;
  font: 700 clamp(34px, 7vw, 56px)/1.12 var(--serif);
  letter-spacing: -.07em;
  text-shadow: 0 2px 12px #050814ad;
}
.cover-story { font: 700 16px/1.65 var(--serif); color: #e9dfcc; }
.cover .main { background: #e7c389; border-color: #f6daa3; }
.cover .vs button, .mode-options button { border-radius: 5px; }
.cover-art {
  isolation: isolate;
  min-height: 100%;
  border-left: 1px solid #d3b17863;
  background: #111b2d var(--roof-art, none) 50% 52% / cover no-repeat;
}
.cover-art::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(0deg, #0b0e19da, transparent 27%);
  box-shadow: inset 0 0 26px #0a102956;
}
.cover-caption {
  z-index: 2; left: 15px; bottom: 14px; padding: 6px 8px;
  color: #f4d8ab; border: 1px solid #e1c49873; background: #121727c9;
  border-radius: 4px; letter-spacing: .09em;
}

body[data-view="map"]::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, #070a13ed, #070a13bf 62%, #070a13e5),
    var(--roof-art, none) 50% 70% / cover no-repeat;
}
.dock {
  background: linear-gradient(135deg, #172338, #111725 63%);
  border-color: #bea3777c; border-radius: 9px;
  box-shadow: 0 6px 28px #04060c9c, inset 0 0 0 2px #080f19b3;
}
#guide { border-bottom-color: #a88c5e77; }
.quest-emblem {
  width: 34px; height: 34px; flex: 0 0 auto;
  display: block; color: #f1d193;
  filter: drop-shadow(0 2px 4px #080b14);
}
.guide-copy { flex: 1; }
#guideStatus { color: #f1cf92; letter-spacing: .035em; }
#guideNext { border-radius: 5px; }
#guide:has(#guideNext:not([hidden])) .quest-emblem {
  color: #ffdf9a; animation: quest-mark .65s ease-out;
}
@keyframes quest-mark {
  0% { transform: scale(.9); filter: drop-shadow(0 0 0 #ffdc94); }
  35% { transform: scale(1.09); filter: drop-shadow(0 0 7px #ffdc94c0); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { .quest-emblem { animation: none !important; } }
.row button, #modeBtn { border-radius: 5px; }
#info { border-color: #bea3777c; border-radius: 8px; }

.page {
  width: min(640px, calc(100% - 12px));
  max-height: 92dvh;
  border-top: 2px solid #98714a; border-right: 1px solid #b48b62; border-radius: 5px 9px 0 0;
  padding: 20px max(15px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 19px)
    max(40px, calc(env(safe-area-inset-left) + 34px));
  background:
    linear-gradient(90deg, #a57a5070 0, #d7b98d72 21px, #ac6d6266 27px, #ac6d6266 28px, transparent 29px),
    radial-gradient(ellipse at 16% 2%, #fff6db 0, transparent 51%),
    radial-gradient(ellipse at 103% 70%, #d9b88b55 0, transparent 64%), var(--paper);
  box-shadow: 0 -7px 36px #03050a90, 3px 0 0 #d2b58c, 6px 0 0 #917052;
}
.page::before {
  content: ""; position: absolute; top: 36px; left: 9px; width: 9px; height: 11px;
  border-radius: 50%; background: #594633;
  box-shadow: inset 1px 1px 3px #302419, 0 56px #594633, 0 112px #594633, 0 168px #594633;
  pointer-events: none;
}
.journal-kicker {
  font: 700 12px/1.2 var(--serif); color: #6c482c; letter-spacing: .08em;
}
.page h2 {
  margin: 6px 56px 2px 0; color: #31251c;
  font: 700 clamp(27px, 7.5vw, 42px)/1.18 var(--serif); letter-spacing: -.075em;
}
.page .date {
  color: #67533b; font: 400 clamp(20px, 5vw, 25px)/1.15 var(--hand);
}
.page .journal-quote, .task .hint, .task .frag, .ending p {
  color: var(--ink-writing);
  font: 400 clamp(22px, 5.6vw, 28px)/32px var(--hand);
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, #987a533f 31px, #987a533f 32px);
  border-radius: 0;
}
.page .journal-quote {
  margin: 12px 0 10px; padding: 0 2px;
  border: 0;
}
.journal-instructions {
  background: #fff6e1a3; border-color: #a78a66aa;
  border-radius: 5px;
}
.journal-progress {
  padding: 6px 1px;
  border-block: 1px solid #a5876578;
}
.journal-progress b { font: 700 clamp(14px, 4.2vw, 17px)/1.1 var(--serif); white-space: nowrap; }
.meter { gap: 3px; }
.meter span { width: clamp(8px, 3vw, 16px); }
.meter .filled { background: #806347; }
.page .acts button { flex-basis: 112px; }
.task { border-bottom-color: #96725066; }
.task summary { min-height: 46px; }
.task .tt { font: 700 17px/1.15 var(--serif); }
.task .mk { border-color: #97704a; background: #edddbc; color: #704f31; font: 400 21px/1 var(--hand); }
.task.done .mk { background: #435044; border-color: #435044; color: #fff1cf; font: 700 13px/1 var(--sans); }
.task .task-state {
  background: #e8d5b4; border: 1px solid #bba07e80;
  color: #674729; border-radius: 3px; padding: 2px 4px;
}
.task.done .task-state { color: #344b38; background: #d9ddbd; border-color: #94a47b90; }
.task .hint, .task .frag { padding: 0 3px; margin: 1px 0 8px 33px; }
.ending { border-color: #a18261; background: #fff5d95e; }
.ending b { font-family: var(--serif); }

@media (max-width: 620px) {
  .cover { grid-template-columns: minmax(0, 1fr); }
  .cover-art {
    min-height: 0; height: clamp(148px, 28dvh, 215px);
    border-left: 0; border-bottom: 1px solid #d3b17863;
  }
  .cover-art { background-position: 50% 71%; }
  .cover-caption { bottom: 9px; }
}
@media (max-height: 440px) and (min-width: 500px) {
  .cover { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .cover-copy { padding: 15px; }
  .cover-copy::before { inset: 5px; }
  .cover-art { height: auto; min-height: 100%; border-left: 1px solid #d3b17863; border-bottom: 0; }
  #intro h1 { font-size: 29px; margin-block: 5px; }
  .cover-story { font-size: 14px; margin-bottom: 7px; }

<script>
"use strict";
const A = Astronomy;
const D2R = Math.PI/180, R2D = 180/Math.PI;
const SITE = {name:'집 옥상', lat:37.32, lon:126.83, h:30, baseLim:3.8};
const OBS = new A.Observer(SITE.lat, SITE.lon, SITE.h);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1);
const norm360=a=>((a%360)+360)%360;

/* ---------- star data ---------- */
const NS = STARS.length/4;
const SV = new Float64Array(NS*3), SMAG=new Float32Array(NS), SBV=new Float32Array(NS);
function eqVec(ra,dec,out,o){const r=ra*D2R,d=dec*D2R;out[o]=Math.cos(d)*Math.cos(r);out[o+1]=Math.cos(d)*Math.sin(r);out[o+2]=Math.sin(d);}
for(let i=0;i<NS;i++){eqVec(STARS[i*4],STARS[i*4+1],SV,i*3);SMAG[i]=STARS[i*4+2];SBV[i]=STARS[i*4+3];}
const NAMEFIX={Polaris:'북극성',Vega:'베가(직녀성)',Altair:'알타이르(견우성)'};
function starName(i){const n=STARNAMES[i];if(!n)return null;return NAMEFIX[n[1]]||n[0];}
function findStar(en){for(const k in STARNAMES)if(STARNAMES[k][1]===en)return +k;return -1;}
const CONSKO={};for(const c of CONS)CONSKO[c[0]]=c[1];
const LV = CLINES.map(l=>{const n=l.length/2,a=new Float64Array(n*3);for(let j=0;j<n;j++)eqVec(l[j*2],l[j*2+1],a,j*3);return a;});
const CV = CONS.map(c=>{const a=new Float64Array(3);eqVec(c[2],c[3],a,0);return {name:c[1],rank:c[4],v:a};});

/* ---------- skyline (rooftop city) ---------- */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const SKYL=new Float32Array(360), WINDOWS=[];
(function(){let az=0;while(az<360){const w=2+Math.floor(rnd()*9);const gap=rnd()<.18;let h=gap?0.4+rnd()*0.6:1.2+rnd()*4.2;
  if(az>330||az<40) h*=1.5; // 북쪽 아파트 단지
  if(az>150&&az<210&&!gap) h*=.7; // 남쪽은 낮은 건물
  for(let k=0;k<w&&az<360;k++,az++)SKYL[az]=h;
  if(!gap&&h>1.5){const n=Math.floor(w*h*.5);for(let j=0;j<n;j++)if(rnd()<.35)WINDOWS.push([az-w+rnd()*w,0.3+rnd()*(h-0.6)]);}
}})();
function skyline(az){const a=norm360(az),i=Math.floor(a),j=(i+1)%360;return SKYL[i];}

/* ---------- state ---------- */
const S = {t:new Date(), speed:1, view:'map', mode:'guide', az:250, alt:30, fov:75, lines:true, gyro:false, sel:null, found:{}, azOff:0};
const SPEEDS=[[0,'멈춤'],[1,'실시간'],[60,'×60'],[600,'×600'],[3600,'×3600']];
let speedIdx=1;
const STORE='gstarjournal-v1';
function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'{}');S.found=d.found||{};if(d.view==='look'||d.view==='map')S.view=d.view;S.lines=d.lines!==false;if(d.mode==='expert')S.mode=d.mode;}catch(e){}}
function save(){try{localStorage.setItem(STORE,JSON.stringify({found:S.found,view:S.view,lines:S.lines,mode:S.mode}));}catch(e){}}
load();

/* ---------- astronomy per frame ---------- */
let ROT=null, lastRotT=0, bodies=[], sun={alt:-30,az:0}, moon=null, lastBodyT=-1e15, LIM=3.8;
const PLANETS=[['Mercury','수성','#d6c6b3'],['Venus','금성','#fff3cf'],['Mars','화성','#ff9466'],['Jupiter','목성','#f4e3c1'],['Saturn','토성','#ead39a'],['Uranus','천왕성','#bdeaf0'],['Neptune','해왕성','#93a9ff']];
function horOf(body,time){const e=A.Equator(body,time,OBS,true,true);const h=A.Horizon(time,OBS,e.ra,e.dec,'normal');return {alt:h.altitude,az:h.azimuth};}
function updateAstro(){
  const ms=S.t.getTime();
  if(Math.abs(ms-lastRotT)>200||!ROT){ROT=A.Rotation_EQJ_HOR(A.MakeTime(S.t),OBS).rot;lastRotT=ms;}
  if(Math.abs(ms-lastBodyT)>20000){
    lastBodyT=ms;const time=A.MakeTime(S.t);
    const s=horOf('Sun',time);sun={alt:s.alt,az:s.az,vec:enu(s.alt,s.az)};
    const m=horOf('Moon',time);const il=A.Illumination('Moon',time);
    moon={type:'moon',name:'달',alt:m.alt,az:m.az,vec:enu(m.alt,m.az),frac:il.phase_fraction,mag:il.mag,phase:A.MoonPhase(time)};
    bodies=PLANETS.map(([b,ko,col])=>{const h=horOf(b,time);return {type:'planet',body:b,name:ko,col,alt:h.alt,az:h.az,vec:enu(h.alt,h.az),mag:A.Illumination(b,time).mag};});
  }
  // limiting magnitude
  let lim=SITE.baseLim;const sa=sun.alt;
  if(sa>=-0.8)lim=-3.6;else if(sa>-6)lim=lerp(-1,1.5,(-sa-0.8)/5.2);else if(sa>-12)lim=lerp(1.5,3.0,(-sa-6)/6);else if(sa>-18)lim=lerp(3.0,SITE.baseLim,(-sa-12)/6);
  lim=Math.min(lim,SITE.baseLim);
  if(moon&&moon.alt>0)lim-=0.9*moon.frac*clamp(moon.alt/20,0,1);
  LIM=lim;
}
function enu(alt,az){const a=alt*D2R,z=az*D2R;return [Math.cos(a)*Math.sin(z),Math.cos(a)*Math.cos(z),Math.sin(a)];}
// EQJ unit vector -> ENU (east,north,up)
function toENU(v,o,out){const R=ROT,x=v[o],y=v[o+1],z=v[o+2];
  const X=R[0][0]*x+R[1][0]*y+R[2][0]*z, Y=R[0][1]*x+R[1][1]*y+R[2][1]*z, Z=R[0][2]*x+R[1][2]*y+R[2][2]*z;
  out[0]=-Y;out[1]=X;out[2]=Z;return out;}
function altAz(e){return [Math.asin(clamp(e[2],-1,1))*R2D, norm360(Math.atan2(e[0],e[1])*R2D)];}
function extinction(alt){return clamp(0.28*(1/Math.max(Math.sin(alt*D2R),0.06)-1),0,3);}

/* ---------- canvas & projection ---------- */
const cv=document.getElementById('sky'), ctx=cv.getContext('2d');
const topHud=document.getElementById('top'), bottomHud=document.getElementById('bottom');
let W=0,H=0,DPR=1,skyTop=0,skyBottom=0,skyY=0,mapLeft=0,mapBottom=0;
function measureHUD(){
  skyTop=topHud.getBoundingClientRect().bottom;
  const dock=bottomHud.getBoundingClientRect();
  skyBottom=dock.top;
  mapLeft=dock.width<W-1?dock.right+6:0;
  mapBottom=mapLeft?H-8:skyBottom;
  skyY=(skyTop+skyBottom)/2;
  const style=document.documentElement.style;
  style.setProperty('--top-edge',skyTop+'px');
  style.setProperty('--dock-height',(H-skyBottom)+'px');
  style.setProperty('--aim-y',skyY+'px');
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);measureHUD();
}
addEventListener('resize',resize);resize();
if(typeof ResizeObserver!=='undefined'){
  const hudObserver=new ResizeObserver(measureHUD);
  hudObserver.observe(topHud);hudObserver.observe(bottomHud);
}
let CAM={};
function setupCam(){const a=S.alt*D2R,z=S.az*D2R;
  const f=[Math.cos(a)*Math.sin(z),Math.cos(a)*Math.cos(z),Math.sin(a)];
  const r=[Math.cos(z),-Math.sin(z),0];
  const u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  const sc=(Math.min(W,H*1.2)/2)/(2*Math.tan(S.fov*D2R/4));
  CAM={f,r,u,sc,cx:W/2,cy:skyY,ppd:sc*D2R};}
const P=[0,0,0];
function camXYZ(e){return [e[0]*CAM.r[0]+e[1]*CAM.r[1], e[0]*CAM.u[0]+e[1]*CAM.u[1]+e[2]*CAM.u[2], e[0]*CAM.f[0]+e[1]*CAM.f[1]+e[2]*CAM.f[2]];}
function projLook(e,lo){const x=e[0]*CAM.r[0]+e[1]*CAM.r[1], y=e[0]*CAM.u[0]+e[1]*CAM.u[1]+e[2]*CAM.u[2], z=e[0]*CAM.f[0]+e[1]*CAM.f[1]+e[2]*CAM.f[2];
  if(z<(lo??-0.2))return null;const k=2/(1+z);P[0]=CAM.cx+k*x*CAM.sc;P[1]=CAM.cy-k*y*CAM.sc;P[2]=z;return P;}
let MAP={};
function setupMap(){
  const R=Math.max(1,Math.min((W-mapLeft)/2-26,(mapBottom-skyTop)/2-18));
  MAP={cx:(W+mapLeft)/2,cy:(mapBottom+skyTop)/2,R,ppd:R/90};
}
function projMap(e){if(e[2]<-0.02)return null;const alt=Math.asin(clamp(e[2],-1,1))*R2D,az=Math.atan2(e[0],e[1]);const r=MAP.R*(90-alt)/90;P[0]=MAP.cx-r*Math.sin(az);P[1]=MAP.cy-r*Math.cos(az);P[2]=1;return P;}

function bvColor(bv){return bv<0?'#a9bfff':bv<0.3?'#cfdaff':bv<0.6?'#f7f6ff':bv<1.0?'#fff1dd':bv<1.4?'#ffd3a0':'#ffb36a';}

/* ---------- drawing ---------- */
let picks=[], frameT=0;
const tmp=[0,0,0];
function skyColors(){const s=sun.alt;
  // [top, horizon]
  if(s>4)return ['#3f7cc4','#a9cdee'];
  if(s>-1)return [mix('#22406e','#3f7cc4',(s+1)/5),mix('#e8a77a','#a9cdee',(s+1)/5)];
  if(s>-8)return [mix('#0b1430','#22406e',(s+8)/7),mix('#5a3a52','#e8a77a',(s+8)/7)];
  if(s>-18)return [mix('#050913','#0b1430',(s+18)/10),mix('#2b2236','#5a3a52',(s+18)/10)];
  return ['#050913','#2b2236'];}
function mix(a,b,t){t=clamp(t,0,1);const p=h=>typeof h==='string'?(h[0]==='#'?[1,3,5].map(i=>parseInt(h.substr(i,2),16)):h.match(/\d+/g).map(Number)):h;const x=p(a),y=p(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')';}

function drawStarDot(x,y,magEff,bv,i,scale){
  const d=LIM-magEff;let r=(0.55+1.05*Math.pow(Math.max(d+0.4,0),0.85))*scale;
  let a=clamp(d/1.3+0.3,0.25,1)*(0.88+0.12*Math.sin(frameT*0.004+i*1.7));
  const c=bvColor(bv);
  if(magEff<1.6){const g=ctx.createRadialGradient(x,y,0,x,y,r*4);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a*0.35;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*4,0,7);ctx.fill();}
  ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}

function drawMoon(x,y,r){
  const k=moon.frac;
  // bright limb direction: toward sun
  const step=[moon.vec[0]+0.03*(sun.vec[0]-moon.vec[0]),moon.vec[1]+0.03*(sun.vec[1]-moon.vec[1]),moon.vec[2]+0.03*(sun.vec[2]-moon.vec[2])];
  const n=Math.hypot(...step);step[0]/=n;step[1]/=n;step[2]/=n;
  let ang=0;
  if(S.view==='look'){const a=camXYZ(moon.vec),b=camXYZ(step);ang=Math.atan2(-(b[1]-a[1]),b[0]-a[0]);}
  else{const p1=projMap(moon.vec);const x1=p1?p1[0]:0,y1=p1?p1[1]:0;const p2=projMap(step);if(p1&&p2)ang=Math.atan2(p2[1]-y1,p2[0]-x1);}
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const g=ctx.createRadialGradient(0,0,r,0,0,r*3.5);g.addColorStop(0,'rgba(255,250,225,'+(0.25*k)+')');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*3.5,0,7);ctx.fill();
  const night=clamp((-sun.alt-2)/8,0,1);if(night>0){ctx.fillStyle='rgba(40,42,55,'+(0.8*night)+')';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();}
  ctx.fillStyle='#fff6dc';ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,Math.PI/2,false);
  const rx=r*Math.abs(1-2*k);
  if(k<0.5)ctx.ellipse(0,0,rx,r,0,Math.PI/2,-Math.PI/2,true);else ctx.ellipse(0,0,rx,r,0,Math.PI/2,Math.PI*1.5,false);
  ctx.fill();ctx.restore();}

function label(x,y,t,col,size){ctx.font=(size||12)+'px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';ctx.fillStyle=col;ctx.fillText(t,x,y);}

function draw(){
  updateAstro();
  const look=S.view==='look', expert=S.mode==='expert', guides=!expert&&S.lines;
  if(look)setupCam();else setupMap();
  const proj=look?projLook:projMap;
  const [cTop,cHor]=skyColors();
  // background
  if(look){ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);}
  else{ctx.clearRect(0,0,W,H);}
  if(look){
    const hp=projLook(enu(0,S.az),-0.99);const hy=hp?hp[1]:(S.alt>0?H*2:-H);
    const g=ctx.createLinearGradient(0,Math.min(hy-H*1.4,0),0,hy);g.addColorStop(0,cTop);g.addColorStop(0.82,mix(cTop,cHor,.45));g.addColorStop(1,cHor);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }else{
    const g=ctx.createRadialGradient(MAP.cx,MAP.cy,0,MAP.cx,MAP.cy,MAP.R);g.addColorStop(0,cTop);g.addColorStop(.75,mix(cTop,cHor,.35));g.addColorStop(1,cHor);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(MAP.cx,MAP.cy,MAP.R,0,7);ctx.fill();
    ctx.save();ctx.beginPath();ctx.arc(MAP.cx,MAP.cy,MAP.R,0,7);ctx.clip();
  }
  picks=[];
  // constellation lines
  if(guides&&sun.alt<0){
    ctx.strokeStyle=sun.alt>-6?'rgba(120,150,230,.18)':'rgba(120,150,230,.32)';ctx.lineWidth=1;ctx.beginPath();
    for(const a of LV){let prev=false;for(let j=0;j<a.length/3;j++){toENU(a,j*3,tmp);const p=proj(tmp);if(p){if(prev)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1]);prev=true;}else prev=false;}}
    ctx.stroke();
  }
  // stars
  const scale=look?clamp(Math.sqrt(75/S.fov),0.8,2.2):0.8;
  for(let i=0;i<NS;i++){
    if(SMAG[i]>LIM)break;
    toENU(SV,i*3,tmp);if(tmp[2]<-0.01)continue;
    const [alt,az]=altAz(tmp);if(alt<skyline(az))continue;
    const me=SMAG[i]+extinction(alt);if(me>LIM)continue;
    const p=proj(tmp);if(!p)continue;const x=p[0],y=p[1];if(x<-20||y<-20||x>W+20||y>H+20)continue;
    drawStarDot(x,y,me,SBV[i],i,scale);
    picks.push({type:'star',i,x,y,mag:SMAG[i],alt,az,vec:[tmp[0],tmp[1],tmp[2]]});
  }
  // planets
  for(const b of bodies){
    if(b.alt<skyline(b.az))continue;const me=b.mag+extinction(b.alt);if(me>LIM+0.3)continue;
    const p=proj(b.vec);if(!p)continue;const x=p[0],y=p[1];
    const r=(1.6+Math.max(0,(LIM-me))*0.45)*scale;
    ctx.fillStyle=b.col;ctx.globalAlpha=.3;ctx.beginPath();ctx.arc(x,y,r*2.6,0,7);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    picks.push({...b,x,y});
  }
  // sun
  if(sun.alt>-1){const p=proj(sun.vec);if(p){const r=look?Math.max(9,0.27*CAM.ppd):8;const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r*6);g.addColorStop(0,'rgba(255,250,220,1)');g.addColorStop(.18,'rgba(255,240,190,.9)');g.addColorStop(1,'rgba(255,240,190,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p[0],p[1],r*6,0,7);ctx.fill();}}
  // moon
  if(moon&&moon.alt>skyline(moon.az)-0.3&&!(moon.frac<0.04&&sun.alt>-6)){const p=proj(moon.vec);if(p){const x=p[0],y=p[1];const r=look?Math.max(8,0.36*CAM.ppd):6;drawMoon(x,y,r);picks.push({...moon,x,y});}}
  // constellation names
  if(guides&&sun.alt<-4){
    ctx.textAlign='center';
    const mapLabels=[];
    for(const c of CV){
      if(c.rank>(look&&S.fov<60?2:1))continue;
      toENU(c.v,0,tmp);
      const [alt,az]=altAz(tmp);
      if(alt<skyline(az)+2)continue;
      const p=proj(tmp);
      if(!p)continue;
      if(!look){
        if(mapLabels.some(l=>Math.abs(p[0]-l.x)<(c.name.length+l.len)*4.5+4&&Math.abs(p[1]-l.y)<12))continue;
        mapLabels.push({x:p[0],y:p[1],len:c.name.length});
      }
      label(p[0],p[1],c.name,'rgba(160,184,240,.64)',look?12:10);
    }
  }
  if(look){drawGround();}else{ctx.restore();drawMapFrame();}
  // labels for found / selected
  ctx.textAlign='left';
  for(const o of picks){
    const nm=objName(o);if(!nm)continue;
    const isFound=isFoundObj(o), isSel=S.sel&&sameObj(S.sel,o);
    if(!expert&&(isFound||isSel||o.type==='moon'&&!look)){label(o.x+8,o.y-6,nm,isSel?'#ffd98a':'rgba(255,230,180,.85)',12);}
    if(isSel){ctx.strokeStyle='#ffd98a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(o.x,o.y,11,0,7);ctx.stroke();}
  }
  if(look&&S.sel)drawSelArrow();
  if(look)checkReticle();
}
function drawGround(){
  // 지평선·건물 실루엣
  const pts=[];
  for(let d=-120;d<=120;d+=1){const az=S.az+d;const h=skyline(az);const p=projLook(enu(h,az),-0.99);if(p)pts.push([p[0],p[1]]);}
  if(pts.length<2)return;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);
  const last=pts[pts.length-1];ctx.lineTo(last[0],H+3000);ctx.lineTo(pts[0][0],H+3000);ctx.closePath();
  ctx.fillStyle='#06070c';ctx.fill();
  ctx.strokeStyle='rgba(255,170,110,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.stroke();
  // windows
  const ww=Math.max(1.5,0.35*CAM.ppd), wh=Math.max(1.2,0.25*CAM.ppd);
  for(const [az,h] of WINDOWS){const p=projLook(enu(h,az));if(!p||p[0]<-5||p[0]>W+5)continue;ctx.fillStyle='rgba(255,214,140,.55)';ctx.fillRect(p[0]-ww/2,p[1]-wh/2,ww,wh);}
  // rooftop rail
  const p0=projLook(enu(-6,S.az),-0.99);
  if(p0&&p0[1]<H){ctx.fillStyle='#0b0c12';ctx.fillRect(0,p0[1],W,H-p0[1]);ctx.strokeStyle='rgba(120,130,160,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,p0[1]);ctx.lineTo(W,p0[1]);ctx.stroke();}
  // compass ticks
  ctx.textAlign='center';
  const DIRS=['북','북동','동','남동','남','남서','서','북서'];
  for(let k=0;k<8;k++){const az=k*45;const p=projLook(enu(-2.5,az),-0.6);if(p&&p[0]>10&&p[0]<W-10)label(p[0],Math.min(p[1],skyBottom-14),DIRS[k],k%2?'rgba(200,205,225,.5)':'#ffd98a',k%2?11:14);}
}
function drawMapFrame(){
  // skyline ring
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(MAP.cx,MAP.cy,MAP.R,0,7);ctx.stroke();
  ctx.fillStyle='rgba(6,7,12,.9)';ctx.beginPath();
  for(let az=0;az<=360;az+=2){const r=MAP.R*(90-skyline(az))/90,a=az*D2R;const x=MAP.cx-r*Math.sin(a),y=MAP.cy-r*Math.cos(a);az?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.closePath();ctx.moveTo(MAP.cx+MAP.R,MAP.cy);ctx.arc(MAP.cx,MAP.cy,MAP.R,0,Math.PI*2);ctx.fill('evenodd');
  ctx.textAlign='center';ctx.textBaseline='middle';
  const D=[['북',0],['동',90],['남',180],['서',270]];
  for(const [t,az] of D){const a=az*D2R,r=MAP.R+12;label(MAP.cx-r*Math.sin(a),MAP.cy-r*Math.cos(a),t,'#ffd98a',13);}
  ctx.textBaseline='alphabetic';
  // altitude rings
  ctx.strokeStyle='rgba(255,255,255,.06)';for(const al of [30,60]){ctx.beginPath();ctx.arc(MAP.cx,MAP.cy,MAP.R*(90-al)/90,0,7);ctx.stroke();}
  // look direction marker
  const r=MAP.R*(90-S.alt)/90,a=S.az*D2R;const x=MAP.cx-r*Math.sin(a),y=MAP.cy-r*Math.cos(a);
  ctx.strokeStyle='rgba(255,217,138,.6)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,MAP.ppd*S.fov/2,0,7);ctx.stroke();ctx.setLineDash([]);
  label(x,y+MAP.ppd*S.fov/2+13,'보던 방향','rgba(255,217,138,.7)',11);
}
function drawSelArrow(){
  const o=liveObj(S.sel);if(!o)return;
  const c=camXYZ(o.vec);const p=projLook(o.vec);
  if(p&&p[0]>20&&p[0]<W-20&&p[1]>skyTop+12&&p[1]<skyBottom-12)return;
  const ang=Math.atan2(-c[1],c[0]);
  const rx=W/2-34, ry=Math.max(5,(skyBottom-skyTop)/2-18);const t=Math.min(rx/Math.abs(Math.cos(ang)||1e-6),ry/Math.abs(Math.sin(ang)||1e-6));
  const x=W/2+Math.cos(ang)*t, y=skyY+Math.sin(ang)*t;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle='#ffd98a';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-3,0);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();ctx.restore();
  if(S.mode!=='expert'){ctx.textAlign='center';label(x-Math.cos(ang)*26,y-Math.sin(ang)*26+4,objName(o)||'',"#ffd98a",11);}
}

/* ---------- objects ---------- */
function objName(o){if(o.type==='star')return starName(o.i);return o.name;}
function sameObj(a,b){return a.type===b.type&&(a.type==='star'?a.i===b.i:a.name===b.name);}
function isFoundObj(o){if(o.type==='star'){return TASKS.some(t=>t.star===o.i&&S.found[t.id]);}if(o.type==='planet')return !!S.found['planet_'+o.body];return false;}
function liveObj(sel){
  if(sel.type==='star'){toENU(SV,sel.i*3,tmp);const [alt,az]=altAz(tmp);return {...sel,vec:[tmp[0],tmp[1],tmp[2]],alt,az};}
  if(sel.type==='moon')return moon;
  return bodies.find(b=>b.name===sel.name)||null;}
const DIR16=['북','북북동','북동','동북동','동','동남동','남동','남남동','남','남남서','남서','서남서','서','서북서','북서','북북서'];
function dirName(az){return DIR16[Math.round(norm360(az)/22.5)%16];}
function moonPhaseName(a){return a<22.5?'삭':a<67.5?'초승달':a<112.5?'상현달':a<157.5?'차오르는 달':a<202.5?'보름달':a<247.5?'기우는 달':a<292.5?'하현달':a<337.5?'그믐달':'삭';}
function describe(o){
  const pos=`고도 ${o.alt.toFixed(1)}° · 방위각 ${o.az.toFixed(1)}° (${dirName(o.az)}쪽)`;
  if(S.mode==='expert')return ['관측 대상',pos];
  if(o.type==='star'){const n=starName(o.i);const c=STARNAMES[o.i]?CONSKO[STARNAMES[o.i][2]]:null;
    return [n||'이름 없는 별',`${c?c+' · ':''}${o.mag.toFixed(1)}등급 · ${pos}`];}
  if(o.type==='moon')return ['달',`${moonPhaseName(o.phase)} (밝은 면 ${Math.round(o.frac*100)}%) · ${pos}`];
  return [o.name,`행성 · ${o.mag.toFixed(1)}등급 · ${pos}`];}

 {id:'capella',star:findStar('Capella'),name:'카펠라',hint:'북동쪽 하늘에 떠오르는 노란 별. 마차부자리의 으뜸별이다.',frag:'카펠라가 높이 오르면 겨울이 가까이 왔다는 뜻이다.'},
 {id:'betelgeuse',star:findStar('Betelgeuse'),name:'베텔게우스',hint:'밤이 깊으면 동쪽에서 오리온이 올라온다. 오리온의 붉은 어깨별을 찾아라. (시간을 앞으로 돌려 보렴)',frag:'베텔게우스는 나이 든 별이라 붉게 탄다. 나처럼 말이다.'},
 {id:'planet',planet:true,name:'떠돌이별 하나',hint:'별보다 덜 반짝이는 밝은 점을 찾아보렴. 그날 밤 떠 있는 행성이면 무엇이든 좋다.',frag:'행성은 별자리 사이를 떠돌아다닌다. 그래서 옛사람들은 떠돌이별이라 불렀지.'},
];
const PAGE={title:'첫 번째 페이지',date:'1987년 11월 14일 토요일 밤 · 옥상에서',travel:'1987-11-14T21:00:00+09:00',
 intro:'오늘 옥상에 처음으로 망원경을 올렸다. 도시 불빛 때문에 별이 몇 개 안 보이지만, 보이는 녀석들은 모두 친구로 삼기로 했다.',
 end:'오늘 만난 친구들을 여기 적어 둔다. 언젠가 손주 녀석도 이 별들을 찾을 수 있으면 좋겠다.'};
function taskDone(t){return t.planet?Object.keys(S.found).some(k=>k.startsWith('planet_')):!!S.found[t.id];}
const journalEl=document.getElementById('journal'), pageEl=document.getElementById('page');
const guideStatus=document.getElementById('guideStatus'), guideAction=document.getElementById('guideAction');
const guideDetail=document.getElementById('guideDetail'), guideNext=document.getElementById('guideNext');
let lastRecorded='', endingTimer;
function updateGuide(){
  const done=TASKS.filter(taskDone).length, next=TASKS.find(t=>!taskDone(t));
  guideStatus.textContent=`관측 임무 · ${done} / ${TASKS.length} 기록`;
  if(!next){
    guideAction.textContent='첫 페이지를 완성했어요';
    guideDetail.textContent='일지에서 되살린 글을 읽어 보세요.';
    guideNext.textContent='완성 일지';
  }else if(lastRecorded){
    guideAction.textContent=S.mode==='expert'?'관측 기록 완료':lastRecorded+' 기록 완료';
    guideDetail.textContent=S.mode==='expert'?'일지에서 다음 목표를 확인하세요.':`다음 관측 · ${next.name}`;
    guideNext.textContent='다음 관측';
  }else{
    guideAction.textContent=S.view==='map'?'별을 누른 뒤 ‘이쪽 보기’를 누르세요':'별을 가운데 원에 약 1초 맞추세요';
    guideDetail.textContent=S.mode==='expert'?'상급 모드 · 목표는 일지에서 확인하세요.':`다음 관측 · ${next.name}`;
  }
  guideDetail.classList.toggle('written-target', !!next&&S.mode!=='expert');
  guideNext.hidden=!!next&&!lastRecorded;
}
function renderJournal(revealNext=false){
  const done=TASKS.filter(taskDone).length, next=TASKS.find(t=>!taskDone(t));
  const meter=TASKS.map((_,i)=>`<span${i<done?' class="filled"':''}></span>`).join('');
  let h=`<button class="close" id="jClose">닫기</button>
    <div class="journal-kicker">할아버지의 관측 일지 · 01</div>
    <h2 id="journalTitle">${PAGE.title}</h2><p class="date"><span class="graphite-writing">${PAGE.date}</span></p>
    <p class="journal-quote"><span class="fountain-writing">${PAGE.intro}</span></p>
    <div class="acts"><button class="travel" id="jTravel">일지 날짜의 하늘</button><button id="jToday">오늘 밤 하늘</button></div>`;
  if(next){
    h+=`<div class="journal-instructions"><strong>별을 기록하는 법</strong>
      성도에서 별을 눌러 ‘이쪽 보기’를 선택하거나 하늘을 직접 둘러보세요. 별을 가운데 원에 약 1초 맞추면 일지에 체크돼요.</div>`;
  }
  h+=`<div class="journal-progress"><b>되살린 기록 ${done} / ${TASKS.length}</b><div class="meter" aria-hidden="true">${meter}</div></div>`;
  for(const [i,t] of TASKS.entries()){
    const d=taskDone(t);
    const planets=t.planet&&d?PLANETS.filter(p=>S.found['planet_'+p[0]]).map(p=>p[1]):[];
    const foundPlanets=planets.length?` · 찾은 행성 ${planets.join(', ')}`:'';
    h+=`<details class="task${d?' done':''}" data-id="${t.id}"${revealNext&&t===next?' open':''}>
      <summary><span class="mk" aria-hidden="true">${d?'✓':i+1}</span><span class="tt ${d?'fountain-writing':'graphite-writing'}">${t.name}</span><span class="task-state">${d?'기록 완료':t===next?'다음 관측':'힌트'}</span></summary>
      <div class="${d?'frag':'hint'}"><span class="${d?'fountain-writing':'graphite-writing'}">${d?t.frag+foundPlanets:t.hint}</span></div>
    </details>`;
  }
  if(!next){
    h+=`<div class="ending"><p><span class="fountain-writing">${PAGE.end}</span></p><b>다음 관측지 · 시골 외가 (준비 중)</b></div>`;
  }
  h+=`<div class="journal-reset"><button id="jReset">진행 초기화</button>
    <span id="resetNote" role="status" hidden>저장한 관측 기록을 지우려면 한 번 더 누르세요.</span></div>`;
  pageEl.innerHTML=h;
  document.getElementById('jClose').onclick=closeJournal;
  document.getElementById('jTravel').onclick=()=>{jumpTo(new Date(PAGE.travel));closeJournal();};
  document.getElementById('jToday').onclick=()=>{jumpTo(tonight());closeJournal();};
  const reset=document.getElementById('jReset'), note=document.getElementById('resetNote');
  reset.onclick=()=>{
    if(note.hidden){
      note.hidden=false;
      reset.textContent='기록 지우기';
      return;
    }
    clearTimeout(endingTimer);
    S.found={};lastRecorded='';save();updateGuide();renderJournal();
  };
}
function openJournal(revealNext=false){
  clearTimeout(endingTimer);
  setDatePanel(false);
  lastRecorded='';updateGuide();renderJournal(revealNext);
  topHud.inert=true;bottomHud.inert=true;
  journalEl.inert=false;journalEl.classList.add('open');
  pageEl.scrollTop=0;
  if(revealNext)pageEl.querySelector('details[open]')?.scrollIntoView({block:'nearest'});
  document.getElementById('jClose').focus({preventScroll:true});
}
function closeJournal(){
  journalEl.classList.remove('open');journalEl.inert=true;
  topHud.inert=false;bottomHud.inert=false;
}
journalEl.addEventListener('click',e=>{if(e.target===journalEl)closeJournal();});
guideNext.onclick=()=>openJournal(true);

/* reticle aiming */
let started=false, aimObj=null, aimStart=0;
const prog=document.getElementById('prog');
function checkReticle(){
  if(!started||journalEl.classList.contains('open')||!datePanel.hidden){
    aimObj=null;
    prog.setAttribute('stroke-dasharray','0 200');
    return;
  }
  let best=null,bd=1e9;
  for(const o of picks){const d=Math.hypot(o.x-CAM.cx,o.y-CAM.cy);if(d<bd){bd=d;best=o;}}
  const thr=Math.max(16,Math.min(26,CAM.ppd*1.2));
  if(best&&bd<thr){
    if(!aimObj||!sameObj(aimObj,best)){aimObj=best;aimStart=performance.now();}
    showInfo(best,false);
    const task=taskFor(best);
    if(task){const p=clamp((performance.now()-aimStart)/1100,0,1);prog.setAttribute('stroke-dasharray',`${p*106.8} 200`);if(p>=1)complete(task);}
    else prog.setAttribute('stroke-dasharray','0 200');
  }else{aimObj=null;prog.setAttribute('stroke-dasharray','0 200');if(!infoPinned)hideInfo();}
}
function taskFor(o){
  if(o.type==='star'){const t=TASKS.find(t=>t.star===o.i);return t&&!S.found[t.id]?t:null;}
  if(o.type==='planet'&&!S.found['planet_'+o.body])return {id:'planet_'+o.body,planet:true,name:o.name,isPlanet:true};
  return null;}
function complete(t){
  if(S.found[t.id])return;
  const doneBefore=TASKS.every(taskDone);
  S.found[t.id]=Date.now();lastRecorded=t.name;save();updateGuide();
  toast('일지 한 줄이 되살아났어요. 일지에서 다음 관측을 확인하세요.',true);
  if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}
  if(!doneBefore&&TASKS.every(taskDone)){
    toast('첫 페이지를 완성했어요.',true);
    endingTimer=setTimeout(()=>openJournal(),1400);
  }
}

/* info card */
let infoPinned=false;
const infoEl=document.getElementById('info'),infoName=document.getElementById('infoName'),infoSub=document.getElementById('infoSub'),infoGo=document.getElementById('infoGo');
const infoCue=document.getElementById('infoCue');
function showInfo(o,pinned,withGo){
  const [name,details]=describe(o);
  const found=isFoundObj(o), target=!!taskFor(o);
  const cue=found?'일지 기록 완료':target
    ?withGo?'기록 대기 · ‘이쪽 보기’로 조준하세요':pinned?'가운데 원에 약 1초 맞추세요':'원을 채우면 일지에 기록돼요'
    :'자유 관측';
  infoName.classList.toggle('written-target', S.mode!=='expert'&&(found||target));
  if(infoName.textContent!==name)infoName.textContent=name;
  if(infoSub.textContent!==details)infoSub.textContent=details;
  if(infoCue.textContent!==cue)infoCue.textContent=cue;
  infoEl.classList.add('show');infoPinned=!!pinned;infoGo.hidden=!withGo;
}
function hideInfo(){infoEl.classList.remove('show');infoPinned=false;}
infoGo.onclick=()=>{
  const o=S.sel&&liveObj(S.sel);
  if(!o)return;
  if(S.gyro){stopGyro();toast('천체에 조준했어요. 자이로 버튼을 누르면 다시 켤 수 있어요.');}
  S.az=o.az;S.alt=clamp(o.alt,-5,89);setView('look');
};

/* toast */
let toastTimer;function toast(msg,gold){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(gold?' gold':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className=gold?'gold':'',gold?3200:2600);}

/* ---------- time ---------- */
const fmt=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
function kstParts(d){const o={};for(const p of fmt.formatToParts(d))o[p.type]=p.value;return o;}
function tonight(){
  const now=new Date();
  if(horOf('Sun',A.MakeTime(now)).alt<=-12)return now;
  const p=kstParts(now);
  return new Date(`${p.year}-${p.month}-${p.day}T21:30:00+09:00`);
}
function setTime(d){S.t=new Date(d.getTime());lastBodyT=-1e15;lastRotT=-1e15;}
function jumpTo(d){setTime(d);speedIdx=1;applySpeed();}
const clockEl=document.getElementById('clock'),limEl=document.getElementById('limv');
function updateClock(){const p=kstParts(S.t);clockEl.textContent=`${p.year}.${p.month}.${p.day} (${p.weekday}) ${(+p.hour%24+'').padStart(2,'0')}:${p.minute}`;
  limEl.textContent=LIM<0?'낮이라 거의 없음':`~${LIM.toFixed(1)}등급까지`;}
document.getElementById('tBack').onclick=()=>setTime(new Date(S.t.getTime()-3600e3));
document.getElementById('tFwd').onclick=()=>setTime(new Date(S.t.getTime()+3600e3));
document.getElementById('tNow').onclick=()=>jumpTo(new Date());
const speedBtn=document.getElementById('speed');
function applySpeed(){S.speed=SPEEDS[speedIdx][0];speedBtn.textContent=SPEEDS[speedIdx][1];speedBtn.classList.toggle('on',speedIdx!==1);speedBtn.setAttribute('aria-label','시간 배속 · '+SPEEDS[speedIdx][1]);}
speedBtn.onclick=()=>{speedIdx=(speedIdx+1)%SPEEDS.length;applySpeed();};
const dateIn=document.getElementById('dateIn'), datePanel=document.getElementById('datePanel');
const dateBtn=document.getElementById('tDate');
function setDatePanel(open){
  datePanel.hidden=!open;dateBtn.setAttribute('aria-expanded',String(open));
  if(open){
    const p=kstParts(S.t);
    dateIn.value=`${p.year}-${p.month}-${p.day}T${String(+p.hour%24).padStart(2,'0')}:${p.minute}`;
    hideInfo();dateIn.focus();
  }
}
dateBtn.onclick=()=>setDatePanel(datePanel.hidden);
datePanel.onsubmit=e=>{
  e.preventDefault();
  const d=new Date(dateIn.value+':00+09:00');
  if(!Number.isNaN(d.getTime())){jumpTo(d);setDatePanel(false);dateBtn.focus();}
};

/* ---------- view & toggles ---------- */
const viewBtn=document.getElementById('viewBtn'),lineBtn=document.getElementById('lineBtn'),gyroBtn=document.getElementById('gyroBtn');
const modeBtn=document.getElementById('modeBtn'), modeNote=document.getElementById('modeNote');
const pickGuide=document.getElementById('pickGuide'), pickExpert=document.getElementById('pickExpert');
const reticle=document.getElementById('reticle');
function setView(v){
  S.view=v;document.body.dataset.view=v;save();viewBtn.textContent=v==='look'?'성도 보기':'올려다보기';
  reticle.hidden=v!=='look';gyroBtn.hidden=v!=='look';
  hideInfo();aimObj=null;updateGuide();measureHUD();
}
function setMode(mode){
  S.mode=mode;
  const expert=mode==='expert';
  modeBtn.textContent=expert?'상급 모드':'기본 모드';
  modeBtn.title=expert?'기본 모드로 전환':'상급 모드로 전환';
  modeNote.textContent=expert?'별자리선과 이름표를 숨겨요.':'별자리선과 이름표를 보며 관측해요.';
  for(const [btn,active] of [[modeBtn,expert],[pickExpert,expert],[pickGuide,!expert]]){
    btn.classList.toggle('on',active);btn.setAttribute('aria-pressed',String(active));
  }
  lineBtn.hidden=expert;hideInfo();save();updateGuide();measureHUD();
}
function toggleMode(){setMode(S.mode==='expert'?'guide':'expert');}
function showLineState(){
  lineBtn.classList.toggle('on',S.lines);lineBtn.setAttribute('aria-pressed',String(S.lines));
}
modeBtn.onclick=toggleMode;
pickGuide.onclick=()=>setMode('guide');
pickExpert.onclick=()=>setMode('expert');
viewBtn.onclick=()=>setView(S.view==='look'?'map':'look');
lineBtn.onclick=()=>{S.lines=!S.lines;showLineState();save();};
document.getElementById('jBtn').onclick=()=>openJournal();

/* gyro */
let gyroAz=null,gyroAlt=null,gyroTimer;
function stopGyro(){
  S.gyro=false;clearTimeout(gyroTimer);
  gyroBtn.classList.remove('on');gyroBtn.setAttribute('aria-pressed','false');
}
function onOrient(e){
  if(!S.gyro||S.view!=='look'||e.alpha==null)return;
  let al=e.alpha;
  if(e.webkitCompassHeading!=null)al=360-e.webkitCompassHeading;
  const a=al*D2R,b=e.beta*D2R,g=e.gamma*D2R;
  const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
  const vx=-ca*sg-sa*sb*cg, vy=-sa*sg+ca*sb*cg, vz=-cb*cg;
  const az=norm360(Math.atan2(vx,vy)*R2D), alt=Math.asin(clamp(vz,-1,1))*R2D;
  if(gyroAz==null){gyroAz=az;gyroAlt=alt;}
  let d=((az-gyroAz+540)%360)-180;gyroAz=norm360(gyroAz+d*0.25);gyroAlt+=(alt-gyroAlt)*0.25;
  S.az=norm360(gyroAz+S.azOff);S.alt=clamp(gyroAlt,-10,89);
}
async function toggleGyro(){
  if(S.gyro){stopGyro();return;}
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){toast('기울기 센서 사용이 허용되지 않았어요');return;}}}
  catch(e){toast('이 브라우저에서는 기울기 센서를 쓸 수 없어요');return;}
  if(!('DeviceOrientationEvent' in window)){toast('이 기기에는 기울기 센서가 없어요');return;}
  S.gyro=true;gyroAz=null;S.azOff=0;gyroBtn.classList.add('on');gyroBtn.setAttribute('aria-pressed','true');
  toast('폰을 하늘로 들어 보세요. 방향이 어긋나면 화면을 좌우로 끌어 맞출 수 있어요');
  gyroTimer=setTimeout(()=>{if(S.gyro&&gyroAz==null){stopGyro();toast('센서 신호를 받지 못했어요. 화면을 끌어 관측할 수 있어요.');}},2500);
}
gyroBtn.onclick=toggleGyro;
addEventListener('deviceorientationabsolute',onOrient);
addEventListener('deviceorientation',e=>{if(!('ondeviceorientationabsolute' in window)||e.webkitCompassHeading!=null)onOrient(e);});

/* ---------- pointer input ---------- */
const ptrs=new Map();let pinch0=null,moved=0,downT=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downT=performance.now();if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),fov:S.fov};}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(S.view==='look')S.fov=clamp(pinch0.fov*pinch0.d/d,15,110);return;}
  if(S.view!=='look')return;
  const dpp=S.fov/Math.min(W,H*1.2)*1.0;
  if(S.gyro){S.azOff-=dx*dpp;S.az=norm360((gyroAz??S.az)+S.azOff);return;}
  S.az=norm360(S.az-dx*dpp);S.alt=clamp(S.alt+dy*dpp,-10,88);});
function endPtr(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;if(had&&moved<8&&performance.now()-downT<500&&ptrs.size===0)tap(e.clientX,e.clientY);}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch0=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();if(S.view==='look')S.fov=clamp(S.fov*Math.exp(e.deltaY*0.001),15,110);},{passive:false});
function tap(x,y){if(!datePanel.hidden)return;let best=null,bd=28;for(const o of picks){const d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;best=o;}}
  if(best){S.sel=best.type==='star'?{type:'star',i:best.i}:{type:best.type,name:best.name};showInfo(best,true,S.view==='map');}
  else{S.sel=null;hideInfo();}}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(journalEl.classList.contains('open'))closeJournal();
    else if(!datePanel.hidden){setDatePanel(false);dateBtn.focus();}
    return;
  }
  if(!started||S.view!=='look'||journalEl.classList.contains('open')||!datePanel.hidden)return;
  const s=S.fov/30;
  if(e.key==='ArrowLeft')S.az=norm360(S.az-s*3);
  if(e.key==='ArrowRight')S.az=norm360(S.az+s*3);
  if(e.key==='ArrowUp')S.alt=clamp(S.alt+s*3,-10,88);
  if(e.key==='ArrowDown')S.alt=clamp(S.alt-s*3,-10,88);
});

/* ---------- intro ---------- */
const pickLook=document.getElementById('pickLook'),pickMap=document.getElementById('pickMap');
function pickView(view){
  S.view=view;
  for(const [btn,active] of [[pickLook,view==='look'],[pickMap,view==='map']]){
    btn.classList.toggle('on',active);btn.setAttribute('aria-pressed',String(active));
  }
}
pickLook.onclick=()=>pickView('look');
pickMap.onclick=()=>pickView('map');
pickView(S.view);
document.getElementById('startBtn').onclick=()=>{
  started=true;document.getElementById('intro').classList.add('hide');setView(S.view);openJournal();
};

/* ---------- loop ---------- */
setTime(new Date(PAGE.travel));showLineState();applySpeed();setView(S.view);setMode(S.mode);
let lastFrame=performance.now(),clockTick=0;
function loop(now){const dt=now-lastFrame;lastFrame=now;frameT=now;
  if(S.speed)S.t=new Date(S.t.getTime()+dt*S.speed);
  try{draw();}catch(err){console.error(err);}
  if(now-clockTick>250){clockTick=now;updateClock();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
