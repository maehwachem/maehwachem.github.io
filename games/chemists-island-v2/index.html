<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102f37"><meta name="description" content="화학자의 섬 v2. 부표를 살리고 물새호의 항적을 따라가는 픽셀 해양 탐험 게임.">
<title>마지막 우편선 · 화학자의 섬 v2 | KJE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231a4450'/%3E%3Cpath d='M4 19h24l-5 7H9zM10 16l2-7h9l3 7z' fill='%23f4c18a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script defer src="game.js"></script><script defer src="lab.js"></script><script defer src="world.js"></script><script defer src="ui.js"></script>
</head><body>
<section id="cover" aria-labelledby="title">
<div class="cover-ink"></div>
<div class="cover-copy"><div class="series">화학자의 섬 <b>v2</b></div>
<h1 id="title">마지막<br>우편선</h1><p class="chapter">첫 번째 이야기 · 끊어진 뱃길</p>
<p class="intro">우편선이 돌아오지 않는 항구.<br>단서를 따라 첫 뱃길을 여세요.</p>
<button id="start" class="primary">첫 항해 시작</button><p id="resume-info"></p>
</div><span class="credit">제작 · KJE</span>
</section>
<main id="play" hidden>
<header><div class="brand"><span class="seal" aria-hidden="true">⚓</span><div><small>화학자의 섬 v2</small><strong>마지막 우편선</strong></div></div>
<nav><button id="journal">항해일지</button><button id="help" aria-label="조작과 저장 안내">도움말</button><button id="to-title" aria-label="저장하고 표지로">표지</button></nav></header>
<div class="frame"><div class="ribbon"><strong id="place"></strong><span id="tide"></span></div>
<div id="worldbox"><div id="viewport"><canvas id="world" width="384" height="216" aria-label="항구와 섬을 탐험하는 게임 화면. 아래 장소 버튼으로도 이동할 수 있습니다." tabindex="0"></canvas>
<div id="pins"></div><div id="sailing" hidden><span>⚓</span><b></b></div></div></div>
<div id="goals"><span>현재 목표</span><p id="goal"></p></div>
<div id="destinations" aria-label="이동하고 살펴볼 곳"></div></div>
<footer><span id="walktip">길을 누르면 걷고, 장소를 누르면 살펴봅니다.</span><span id="save-status" role="status"></span></footer>
</main>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><small id="panel-label"></small><button id="close-panel" aria-label="닫기">×</button></div><h2 id="panel-title"></h2><div id="diagram" hidden></div><div id="panel-text" aria-live="polite"></div><div id="choices"></div></dialog>
