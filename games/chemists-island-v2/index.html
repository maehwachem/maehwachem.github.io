<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102f37"><meta name="description" content="화학자의 섬 v2. 부표를 살리고 물새호의 항적을 따라가는 픽셀 해양 탐험 게임.">
<title>마지막 우편선 · 화학자의 섬 v2 | KJE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231a4450'/%3E%3Cpath d='M4 19h24l-5 7H9zM10 16l2-7h9l3 7z' fill='%23f4c18a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=west2"><script defer src="supplies.js?v=salvage1"></script><script defer src="west-story.js?v=west2"></script><script defer src="game.js?v=west2"></script><script defer src="lab.js?v=yard1"></script><script defer src="chemist.js?v=yard1"></script><script defer src="walkways.js?v=west2"></script><script defer src="pier-yard.js?v=keeper1"></script><script defer src="north-dock.js?v=west2"></script><script defer src="north-lab.js?v=west2"></script><script defer src="west-field.js?v=west2"></script><script defer src="west-lab.js?v=west2"></script><script defer src="world.js?v=west2"></script><script defer src="ui.js?v=west2"></script>
</head><body>
<section id="cover" aria-labelledby="title">
<canvas id="cover-hero" width="1536" height="864" aria-hidden="true"></canvas><div class="cover-ink"></div>
<div class="cover-copy"><div class="series">화학자의 섬 <b>v2</b></div>
<h1 id="title">마지막<br>우편선</h1><p class="chapter">첫 번째 이야기 · 끊어진 뱃길</p>
<p class="intro">우편선이 돌아오지 않는 항구.<br>부두에 남은 재료로 첫 뱃길을 여세요.</p>
<button id="start" class="primary">첫 항해 시작</button><button id="try-repair" hidden>첫 부표 수리 다시 해보기</button><p id="resume-info"></p><div class="chapter-links"><a id="chapter-route" href="?chapter=north&amp;v=west2">둘째 장부터 · 북암의 답장</a><a id="west-route" href="?chapter=west&amp;v=west2">셋째 장부터 · 서쪽 갱구의 우편함</a></div>
</div><span class="credit">제작 · KJE</span>
</section>
<main id="play" hidden>
<header><div class="location"><strong id="place"></strong><small id="tide"></small></div>
<nav aria-label="항해 도구"><button id="pack">가방</button><button id="journal">항해일지</button><button id="help">메뉴</button></nav></header>
<div id="worldbox"><div id="viewport"><canvas id="world" width="384" height="216" aria-label="부두의 길과 사물을 눌러 탐험하세요. Tab으로 그림 속 사물을 선택할 수 있습니다." tabindex="0"></canvas>
<div id="pickup" role="status" aria-live="polite"></div><div id="objects" aria-label="그림 속 사물"></div><div id="sailing" hidden><span>⚓</span><b></b></div></div></div>
<div class="walking-controls"><div id="walk-pad" role="group" aria-label="누르고 있는 동안 걷기">
<button type="button" data-dir="up" aria-label="위로 걷기">▲</button><button type="button" data-dir="left" aria-label="왼쪽으로 걷기">◀</button><button type="button" data-dir="down" aria-label="아래로 걷기">▼</button><button type="button" data-dir="right" aria-label="오른쪽으로 걷기">▶</button>
</div><div class="action-slot"><button id="nearby" hidden></button><span class="walk-hint">갈 곳이나 사물을 누르세요.</span></div></div>
<section class="field-note" aria-label="탐험 안내"><div class="note-copy"><small>항해 메모</small><p id="goal"></p></div>
<div class="field-actions"><button id="exit-trial" hidden>원래 항해로</button><button id="view-mode" aria-pressed="false" hidden>전경 보기</button></div></section>
<footer><span id="walktip">바닥을 눌러 걷고, 사물을 눌러 다가갑니다.</span><span id="save-status" role="status"></span></footer>
</main>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><small id="panel-label"></small><button id="close-panel" aria-label="닫기">×</button></div><h2 id="panel-title"></h2><div id="diagram" hidden></div><div id="panel-text" aria-live="polite"></div><div id="choices"></div></dialog>
<noscript>자바스크립트를 켜면 배를 띄울 수 있어요.</noscript>
</body></html>
