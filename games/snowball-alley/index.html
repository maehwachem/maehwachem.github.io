<div id="game"></div>
<div id="touch" class="hidden"></div>
<div id="joyBase" class="hidden"><div id="joyKnob"></div></div>
<button class="tbtn hidden" id="bThrow">던지기</button>
<button class="tbtn hidden" id="bCrouch">숙이기</button>
<button class="tbtn hidden dim" id="bGather">눈<br>뭉치기</button>
<button class="tbtn hidden" id="bFocus" aria-pressed="false">상대<br>추적</button>
<div id="offL" class="off hidden">◀ 상대</div><div id="offR" class="off hidden">상대 ▶</div>

<div id="hud" class="hidden">
  <span id="scoreMode" class="hidden">눈사람 체력</span>
  <div class="scorebar">
    <span>나</span><span id="pipsMe"></span><span class="vs">VS</span><span id="pipsCpu"></span><span>상대</span>
  </div>
  <div class="ammorow"><span>내 눈덩이</span><span id="ammoMe"></span><span class="vs">상대</span><span id="ammoCpu"></span></div>
</div>
<div id="practiceCard" class="hidden" role="status">
  <div id="practiceTitle"></div>
  <p id="practiceText"></p>
  <p id="practiceCue" class="hidden"></p>
</div>
<button id="pauseBtn" class="hidden">Ⅱ</button>
<div id="prompt" class="hidden"><span id="ptext"></span><span id="gbar"><i></i></span></div>
<div id="msg"></div>
<div id="cd"></div>
<div id="flash"></div>
<div id="hint" class="hidden"></div>

<div id="menu" class="overlay">
  <div class="card menucard">
    <div class="col">
      <h1>골목 눈싸움</h1>
      <p class="sub">눈 쌓인 골목, 1 대 1. 먼저 세 번 맞히면 이겨요.</p>
      <p id="graphicsError" class="hidden" role="alert">이 브라우저에서 3D 그래픽을 시작하지 못했어요. WebGL을 사용할 수 있는 브라우저에서 다시 열어 주세요.</p>
      <div class="diff" id="diff">
        <button data-d="easy">쉬움</button><button data-d="normal" class="on">보통</button><button data-d="hard">어려움</button>
      </div>
      <p class="sub">상대가 <b style="color:#d33;font-weight:400">팔을 번쩍 들면</b> 곧 던진다는 신호예요.<br>상대가 사라지면 눈 위의 발자국을 찾아봐요.</p>
      <button class="btn" id="startBtn">시작하기</button>
      <button class="btn ghost" id="guardBtn">눈사람 지키기</button>
      <button class="btn ghost" id="practiceBtn">눈사람 연습장</button>
    </div>
    <div class="col">
      <div class="controls" id="ctlText"></div>
      <label class="opt"><span>조준 보조<small>목표가 화면 가운데 근처에 있으면 알아서 겨눠요</small></span><input type="checkbox" id="optAssist"></label>
      <label class="opt" id="sensRow"><span style="white-space:nowrap">시야 감도</span><input type="range" id="optSens" min="0.6" max="2.2" step="0.1" value="1.3"></label>
    </div>
  </div>
</div>
<div id="pause" class="overlay hidden">
  <div class="card">
    <h2>잠시 멈춤</h2>
    <button class="btn" id="resumeBtn">계속하기</button><br>
    <button class="btn ghost" id="toMenuBtn">처음 화면으로</button>
  </div>
</div>
<div id="result" class="overlay hidden">
  <div class="card">
    <h2 id="resTitle">승리!</h2>
    <p id="resScore" style="font-size:28px;color:#2a4d7a"></p>
    <p id="resSub" class="sub"></p>
    <button class="btn" id="againBtn">다시 하기</button><br>
    <button class="btn ghost" id="menuBtn">난이도 바꾸기</button>
  </div>
</div>

function crossedPracticeWall(p, v, dt) {
  if (v.z === 0) return false;
  const startZ = p.z - v.z * dt;
  const minZ = Math.min(startZ, p.z), maxZ = Math.max(startZ, p.z);
  return practiceWalls.some(wall => {
    const z = (wall.minZ + wall.maxZ) / 2;
    if (z < minZ || z > maxZ) return false;
    const elapsed = (p.z - z) / v.z;
    const x = p.x - v.x * elapsed;
    const y = p.y - v.y * elapsed;
    return x >= wall.minX && x <= wall.maxX && y >= wall.h + BALL_R;
  });
}

function resolveCircle(p, r, o) {
  const cx = Math.max(o.minX, Math.min(p.x, o.maxX)), cz = Math.max(o.minZ, Math.min(p.z, o.maxZ));
  const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
  if (d2 >= r * r) return;
  if (d2 > 1e-9) { const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.z += dz * k; }
  else {
    const pen = [p.x - o.minX + r, o.maxX - p.x + r, p.z - o.minZ + r, o.maxZ - p.z + r];
    const i = pen.indexOf(Math.min(...pen));
    if (i === 0) p.x -= pen[0]; else if (i === 1) p.x += pen[1]; else if (i === 2) p.z -= pen[2]; else p.z += pen[3];
  }
}
function moveChar(c, dx, dz) {
  c.pos.x += dx; c.pos.z += dz;
  for (let it = 0; it < 2; it++) for (const o of obstacles) resolveCircle(c.pos, R_CHAR, o);
  // 캐릭터끼리 겹침 방지
  if (practiceStep !== null) return;
  keepApart(c.pos, (c === P ? C : P).pos, R_CHAR * 2);
  if (guardMode) {
    keepApart(c.pos, homeSnowman.pos, R_CHAR + snowmanBody[0][1]);
    keepApart(c.pos, enemySnowman.pos, R_CHAR + snowmanBody[0][1]);
  }
}
function keepApart(pos, other, minDistance) {
  const dx = pos.x - other.x, dz = pos.z - other.z, distance = Math.hypot(dx, dz);
  if (distance < minDistance && distance > 1e-6) {
    const k = (minDistance - distance) / distance;
    pos.x += dx * k; pos.z += dz * k;
  }
}
function hitObstacle(p) {
  for (const o of obstacles) {
    if (p.y < o.h + BALL_R && p.x > o.minX - BALL_R && p.x < o.maxX + BALL_R && p.z > o.minZ - BALL_R && p.z < o.maxZ + BALL_R) return o;

}
function hitTarget(c, p) {

    return snowmanBody.some(([y, radius]) =>
      Math.hypot(p.x - c.pos.x, p.y - y, p.z - c.pos.z) < radius + BALL_R);

}
function simulate(p0, v0, chars, maxT, pts) {
  const p = p0.clone(), v = v0.clone(), dt = practiceStep === null ? 1 / 60 : PRACTICE_SHOT_STEP;
  const requiresArc = practiceStep === 1 && chars[0] === snowman;
  let overWall = false;
  if (pts) pts.push(p.x, p.y, p.z);
  for (let t = dt; t < maxT; t += dt) {
    v.y -= G * dt; p.addScaledVector(v, dt);
    if (pts) pts.push(p.x, p.y, p.z);
    if (requiresArc && !overWall) overWall = crossedPracticeWall(p, v, dt);
    for (const c of chars) if (hitTarget(c, p)) return { type: 'char', char: c, p, t, overWall };
    const o = hitObstacle(p); if (o) return { type: 'obs', obs: o, p, t };
    if (p.y < BALL_R) return { type: 'ground', p, t };

}

  const p = p0.clone(), v = v0.clone(), dt = 1 / 60;
  for (let t = dt; t < 4; t += dt) {
    v.y -= G * dt; p.addScaledVector(v, dt);
    if (p.distanceTo(aim) < 0.5) return t;
    if (hitObstacle(p) || p.y < BALL_R) return -1;

}
function segAABB(ax, az, bx, bz, o) {
  let t0 = 0, t1 = 1;
  const seg = [[ax, bx - ax, o.minX, o.maxX], [az, bz - az, o.minZ, o.maxZ]];
  for (const [p, d, mn, mx] of seg) {
    if (Math.abs(d) < 1e-9) { if (p < mn || p > mx) return false; }
    else { let ta = (mn - p) / d, tb = (mx - p) / d; if (ta > tb) [ta, tb] = [tb, ta]; t0 = Math.max(t0, ta); t1 = Math.min(t1, tb); if (t0 > t1) return false; }
  }

}

  return Math.hypot(dx, dz);
}

    if (o.type === 'wall' && distPtAABB(pt.x, pt.z, o) > 1.6) continue;
    if (segAABB(from.x, from.z, pt.x, pt.z, o)) return true;

function rayT(a, b, types) { // a→b 선분이 장애물에 처음 닿는 비율
  let best = 1;
  const d = new V3().subVectors(b, a);
  for (const o of obstacles) {
    if (!types.includes(o.type)) continue;
    let t0 = 0, t1 = 1, ok = true;
    for (const [p, dd, mn, mx] of [[a.x, d.x, o.minX - 0.2, o.maxX + 0.2], [a.y, d.y, -1, o.h + 0.2], [a.z, d.z, o.minZ - 0.2, o.maxZ + 0.2]]) {
      if (Math.abs(dd) < 1e-9) { if (p < mn || p > mx) { ok = false; break; } }
      else { let ta = (mn - p) / dd, tb = (mx - p) / dd; if (ta > tb) [ta, tb] = [tb, ta]; t0 = Math.max(t0, ta); t1 = Math.min(t1, tb); if (t0 > t1) { ok = false; break; } }
    }
    if (ok && t0 < best) best = t0;
  }
  return best;
}

// ================= 길찾기(격자 A*) =================
const GX0 = -12, GZ0 = -22, CS = 0.5, NX = 48, NZ = 88, NN = NX * NZ;
const blocked = new Uint8Array(NN);
for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
  const x = GX0 + (i + 0.5) * CS, z = GZ0 + (j + 0.5) * CS;
  blocked[j * NX + i] = obstacles.some(o => distPtAABB(x, z, o) < R_CHAR + 0.05) ? 1 : 0;
}
const cellOf = (x, z) => {
  const i = Math.max(0, Math.min(NX - 1, Math.floor((x - GX0) / CS))), j = Math.max(0, Math.min(NZ - 1, Math.floor((z - GZ0) / CS)));
  return j * NX + i;
};
const cellPos = k => ({ x: GX0 + (k % NX + 0.5) * CS, z: GZ0 + (Math.floor(k / NX) + 0.5) * CS });
function nearestFree(k) {
  if (!blocked[k]) return k;
  const ci = k % NX, cj = Math.floor(k / NX);
  for (let r = 1; r < 12; r++) for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
    const i = ci + di, j = cj + dj; if (i < 0 || j < 0 || i >= NX || j >= NZ) continue;
    if (!blocked[j * NX + i]) return j * NX + i;
  }

}
function walkable(a, b) {
  const d = Math.hypot(b.x - a.x, b.z - a.z), n = Math.ceil(d / 0.2);
  for (let s = 1; s <= n; s++) { const t = s / n; if (blocked[cellOf(a.x + (b.x - a.x) * t, a.z + (b.z - a.z) * t)]) return false; }

function leaveFootprint() {
  const dx = C.pos.x - C.prev.x, dz = C.pos.z - C.prev.z;
  const distance = Math.hypot(dx, dz);
  if (distance === 0) return;
  if (distance > FOOTPRINT_SPACING) {
    footprintDistance = 0;
    return;
  }
  const remaining = FOOTPRINT_SPACING - footprintDistance;
  if (distance < remaining) {
    footprintDistance += distance;
    return;
  }

  const fraction = remaining / distance;
  const offset = 0.13 * footprintSide / distance;
  const mark = new THREE.Mesh(footprintGeo, new THREE.MeshBasicMaterial({
    map: footprintTex, transparent: true, opacity: 0.8, depthWrite: false,
  }));
  mark.name = 'opponentFootprint';
  mark.position.set(C.prev.x + dx * fraction - dz * offset, 0.015, C.prev.z + dz * fraction + dx * offset);
  mark.rotation.set(-Math.PI / 2, 0, Math.atan2(-dx, -dz));
  scene.add(mark);
  footprints.push({ mark, life: FOOTPRINT_LIFE });
  footprintDistance = distance - remaining;
  footprintSide *= -1;
}

function removeFootprint(index) {
  const { mark } = footprints[index];
  scene.remove(mark);
  mark.material.dispose();
  footprints.splice(index, 1);
}

function clearFootprints() {
  while (footprints.length) removeFootprint(footprints.length - 1);
  footprintDistance = 0;
  footprintSide = 1;
}

function updateFootprints(dt) {
  for (let i = footprints.length - 1; i >= 0; i--) {
    const print = footprints[i];
    print.life -= dt;
    if (print.life <= 0) removeFootprint(i);
    else print.mark.material.opacity = 0.8 * Math.min(1, print.life / 3);
  }
}

    if (r.t > b.aiWin) continue;

      ai.checkT -= dt;
      if (ai.checkT <= 0 && !done) {
        ai.checkT = 1.2;
        if (C.ammo > 0 && ai.goalType !== 'pile' && C.throwCd <= 0 && Math.random() < D.opp) { const s = aiSolve(); if (s) { aiBeginThrow(s); break; } }
      }
      if (done) { if (ai.goalType === 'pile') ai.state = 'reload'; else { ai.state = 'cover'; ai.timer = randR(D.wait); } }
      break;
    }
    case 'cover':
      C.crouch = true; turnTo(C, toP, dt, 6);
      if (!covered(C.pos, P.pos)) ai.timer = Math.min(ai.timer, 0.35);
      if (ai.timer <= 0) {
        if (C.ammo > 0) {
          const s = aiSolve();
          if (s) aiBeginThrow(s); else aiDecide(dist2(C.pos, P.pos) > 17 || Math.random() < 0.5);
        } else aiDecide();
      }
      break;
    case 'throw':
      C.crouch = false;
      if (C.winding) {
        if (C.windup > 0.15) {
          ai.resolveT -= dt;
          if (ai.resolveT <= 0) { ai.resolveT = 0.1; const s = aiSolve(); if (s) ai.shot = s; }
          turnTo(C, ai.shot.yaw, dt, 14);
        } else C.yaw = ai.shot.yaw;
        C.pitch = ai.shot.pitch;
      } else {
        if (C.ammo > 0 && Math.random() < 0.4) { ai.state = 'cover'; ai.timer = randR(D.wait); }
        else { ai.state = 'think'; ai.timer = 0.15; }
      }
      break;
    case 'reload':
      turnTo(C, toP, dt, 6);
      if (!nearPile(C)) { aiDecide(); break; }
      C.gathering = true;
      if (C.ammo >= MAX_AMMO || (C.ammo >= 1 && dist2(C.pos, P.pos) < 7 && Math.random() < dt * 2)) { C.gathering = false; ai.state = 'think'; ai.timer = 0.1; }
      break;
    case 'dodge':
      C.crouch = false;
      moveChar(C, ai.dodgeDir.x * 5.5 * dt, ai.dodgeDir.z * 5.5 * dt);
      ai.dodgeT -= dt;
      if (ai.dodgeT <= 0) { ai.state = 'think'; ai.timer = 0.15; }
      break;
  }
}

// ================= 눈덩이 갱신 =================
function updateBalls(dt) {
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i]; let dead = false;
    const previousAge = b.age;
    b.age += dt;
    // The practice preview and the thrown ball sample the same trajectory.
    const h = practiceStep === null ? dt / 3 : PRACTICE_SHOT_STEP;
    const n = practiceStep === null ? 3 : Math.floor(b.age / h) - Math.floor(previousAge / h);
    for (let s = 0; s < n && !dead; s++) {
      b.vel.y -= G * h; b.pos.addScaledVector(b.vel, h);
      if (practiceStep === null) {
        for (const c of fighters) if (c !== b.owner && hitTarget(c, b.pos)) { onHit(c, b); dead = true; break; }
        if (!dead && guardMode) {
          const target = b.owner === P ? enemySnowman : homeSnowman;
          if (target.model.visible && hitTarget(target, b.pos)) { onGuardHit(target, b); dead = true; }
        }
      } else if (snowman.model.visible) {
        if (practiceStep === 1 && !b.overWall) b.overWall = crossedPracticeWall(b.pos, b.vel, h);
        if (hitTarget(snowman, b.pos)) {
          burst(b.pos, 22, 2.8);
          if (practiceStep === 0 || b.overWall) {
            practiceHit = true; sfx.hit();
          } else {
            showMsg('담 위로 던져봐요!', '#d6ecff', 0.9); sfx.splat(b.pos);
          }
          dead = true;
        }
      }
      if (dead) break;
      const o = hitObstacle(b.pos); if (o) { splatAt(b, o); dead = true; break; }
      if (b.pos.y < BALL_R) { b.pos.y = BALL_R; splatAt(b, null); dead = true; }
    }
    if (b.age > 6) dead = true;
    if (dead) { scene.remove(b.mesh); balls.splice(i, 1); } else b.mesh.position.copy(b.pos);
  }
}

// ================= 카메라 · 조준선 =================
const camPos = new V3(0, 3, 22), camLook = new V3();
function updateCamera(dt) {
  const ca = P.crouchAmt;
  const pivot = new V3(P.pos.x, 1.6 - ca * 0.45, P.pos.z);
  const f = fwd(P.yaw), r = rightV(P.yaw);
  const cp = P.pitch * (isTouch ? 0.4 : 0.5) - 0.1;
  const look = new V3(f.x * Math.cos(cp), Math.sin(cp), f.z * Math.cos(cp));
  const shoulder = pivot.clone().addScaledVector(r, isTouch ? 0.6 : 0.85);
  if (rayT(pivot, shoulder, ['bld']) < 1) shoulder.copy(pivot);
  const want = shoulder.clone().addScaledVector(look, -4.4); want.y += 0.7;
  const t = rayT(shoulder, want, ['bld']);
  if (t < 1) want.lerpVectors(shoulder, want, Math.max(0.12, t - 0.06));
  want.y = Math.max(0.35, want.y);
  camPos.lerp(want, Math.min(1, dt * 14));
  camera.position.copy(camPos);
  if (shake > 0) { shake -= dt; camera.position.x += rand(-1, 1) * shake * 0.3; camera.position.y += rand(-1, 1) * shake * 0.3; }
  camLook.copy(camPos).addScaledVector(look, 10);
  camera.lookAt(camLook);
}
const tmpPts = [];
function updateAim() {
  const show = (state === 'play' || state === 'countdown') && P.ammo > 0 && P.stun <= 0;
  aimLine.visible = aimRing.visible = aimDot.visible = show;
  if (!show) return;
  tmpPts.length = 0;
  const as = assistOn() ? assistSolve() : null;
  const ay = as ? as.yaw : P.yaw, ap = as ? as.pitch : P.pitch;
  const targets = practiceStep === null ? (guardMode ? [C, enemySnowman] : [C]) :
    snowman.model.visible ? [snowman] : [];
  const r = simulate(handPos(P, ay), dirVec(ay, ap).multiplyScalar(VTHROW), targets, 4, tmpPts);
  let cnt = 0, acc = 0.3;
  for (let i = 3; i < tmpPts.length && cnt < MAXD; i += 3) {
    acc += Math.hypot(tmpPts[i] - tmpPts[i - 3], tmpPts[i + 1] - tmpPts[i - 2], tmpPts[i + 2] - tmpPts[i - 1]);
    if (acc >= 0.42) { acc = 0; dotM.makeTranslation(tmpPts[i], tmpPts[i + 1], tmpPts[i + 2]); aimLine.setMatrixAt(cnt++, dotM); }
  }
  aimLine.count = cnt; aimLine.instanceMatrix.needsUpdate = true;
  const validHit = r.type === 'char' && (practiceStep !== 1 || r.overWall);
  if (practiceStep === 1) {
    let cue = '점선이 주황색이 될 때까지 조준해요.';
    if (validHit) cue = '주황색 점선이 보이면 던져요!';
    else if (r.type === 'char') cue = '담 위를 지나야 해요. 담 반대편에서 던져 보세요.';
    else if (r.obs?.type === 'wall') cue = '담에 막혀요. 조준을 조금 더 높여 보세요.';
    const practiceCue = $('practiceCue');
    if (practiceCue.textContent !== cue) practiceCue.textContent = cue;
  }
  const col = validHit ? (guardMode && r.char === C ? 0xffcf70 : 0xff6a2a) : 0x2f6fd1;
  aimRing.material.color.setHex(col); aimDot.material.color.setHex(col); aimLine.material.color.setHex(col);
  if (r.type === 'ground' || r.type === 'char') {
    aimDot.visible = false;
    if (r.type === 'char') aimRing.position.set(r.char.pos.x, 0.04, r.char.pos.z); else aimRing.position.set(r.p.x, 0.04, r.p.z);
  } else { aimRing.visible = false; aimDot.position.copy(r.p); }
}
function updatePrompt(dt) {
  const el = $('prompt');
  if (state !== 'play') { el.classList.add('hidden'); return; }
  let text = '', prog = -1;
  const canGather = canPlayerGather();
  if (isTouch) {
    const button = $('bGather');
    button.classList.toggle('dim', !canGather);
    button.classList.toggle('ready', canGather);
    button.classList.toggle('on', canGather && P.gathering);
  }
  if (canGather) {
    text = isTouch ? '한 번 눌러 1개, 누르고 있으면 연속' : 'R 키를 누르고 있으면 눈 뭉치기';
    if (P.gathering) { text = '눈 뭉치는 중…'; prog = P.gatherT / GATHER_T; }
  } else if (P.ammo === 0) text = '눈덩이가 없어요 — 파란 원이 있는 눈더미로!';
  if (!text) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden'); $('ptext').textContent = text;
  $('gbar').style.display = prog >= 0 ? 'block' : 'none';
  if (prog >= 0) $('gbar').firstElementChild.style.width = (prog * 100) + '%';
}

// ================= 메인 루프 =================
let last = performance.now();
function update(dt) {
  if (state === 'countdown') {
    cdT -= dt;
    const n = Math.ceil(cdT);
    if (n !== cdLast) { cdLast = n; if (n > 0) { $('cd').textContent = n; sfx.beep(520); } else { $('cd').textContent = '던져!'; sfx.beep(880); } }
    if (cdT <= 0) { state = 'play'; setTimeout(() => { if ($('cd').textContent === '던져!') $('cd').textContent = ''; }, 600); }
  }
  if (state === 'play' || state === 'ending') {
    if (state === 'play') updatePlayer(dt); else P.gathering = false;
    if (practiceStep === null) {
      aiUpdate(dt);
      if (state === 'play') leaveFootprint();
    }
    updateFighter(P, dt);
    if (practiceStep === null) updateFighter(C, dt);
    updateBalls(dt);
    if (practiceStep !== null && practiceHit) {
      setPracticeStep(practiceStep + 1);
      showMsg('명중!', '#d6ecff', 0.75);
    }
    if (practiceStep === 2 && P.ammo > 0) endGame();
    if (state === 'ending') { endT -= dt; if (endT <= 0) endGame(); }
  } else if (state === 'countdown' || state === 'menu') {
    for (const c of fighters) updateFighter(c, dt);
  }
  // 파편
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.v.y -= G * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.03) { p.m.position.y = 0.03; p.v.set(0, 0, 0); }
    if (p.life <= 0) { scene.remove(p.m); parts.splice(i, 1); } else if (p.life < 0.3) p.m.scale.setScalar(p.life / 0.3);
  }
  for (let i = decals.length - 1; i >= 0; i--) {
    const d = decals[i]; d.life -= dt;
    if (d.life < 1.5) d.m.material.opacity = Math.max(0, d.life / 1.5);
    if (d.life <= 0) { scene.remove(d.m); d.m.material.dispose(); decals.splice(i, 1); }
  }
  updateFootprints(dt);
  // 내리는 눈
  const a = snowGeo.attributes.position.array;
  for (let i = 0; i < SN; i++) {
    a[i * 3 + 1] -= dt * (1.1 + (i % 7) * 0.08); a[i * 3] += Math.sin(performance.now() / 1300 + i) * dt * 0.25;
    if (a[i * 3 + 1] < 0) { a[i * 3 + 1] = 14; a[i * 3] = camPos.x + rand(-16, 16); a[i * 3 + 2] = camPos.z + rand(-16, 16); }
  }
  snowGeo.attributes.position.needsUpdate = true;
  if (state === 'menu') {
    const t = performance.now() / 6000;
    camera.position.set(Math.sin(t) * 9, 6, 6 + Math.cos(t) * 8); camera.lookAt(0, 1, 0);
  } else updateCamera(dt);
  updateAim(); updatePrompt(dt); updateOffscreen();
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('msg').style.opacity = 0; }
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').classList.add('hidden'); }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state !== 'paused' && state !== 'over') update(dt);
  else if (state === 'over') {
    updateFighter(P, dt);
    if (practiceStep === null) updateFighter(C, dt);
    updateCamera(dt);
  }
  renderer.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pauseGame(); });
resetRound();
requestAnimationFrame(frame);
window.__game = { step: dt => update(dt), throwP: playerThrow, simCheck: () => simulate(handPos(P), dirVec(P.yaw, P.pitch).multiplyScalar(VTHROW), [C], 4).type === 'char', P, C, ai, get state() { return state; }, startGame, coverPts, astar, aiSolve, balls };
</script>
