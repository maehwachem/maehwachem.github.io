<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fd3f4">
<title>오늘도, 작은 농장</title>
<style>
:root{
  --cell:120px; --gap:10px; --horizon:30vh;
  --ink:#4a3a2a; --paper:#fffaf0; --leaf:#5aa83a; --accent:#f2994a;
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- 배경 ---------- */
#sky{position:absolute;inset:0;background:linear-gradient(#7cc8f0 0%,#b9e6f7 calc(var(--horizon) - 4vh),#e9f7e4 var(--horizon));transition:filter 1.2s, background 1.2s;z-index:0}
body.w-cloudy #sky{filter:saturate(.7) brightness(.95)}
body.w-rain #sky{filter:saturate(.45) brightness(.78) hue-rotate(10deg)}
#sun{position:absolute;right:9%;top:calc(var(--horizon)*.18);width:min(16vw,110px);aspect-ratio:1;transition:opacity 1.2s,transform 1.2s}
#sun .core{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff7c2,#ffd85a 60%,#ffb83f);box-shadow:0 0 40px 18px rgba(255,215,90,.55)}
#sun .rays{position:absolute;inset:-30%;background:repeating-conic-gradient(rgba(255,236,150,.35) 0 6deg,transparent 6deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 60s linear infinite}
body.w-cloudy #sun{opacity:.45;transform:scale(.9)}
body.w-rain #sun{opacity:0;transform:translateY(-20px)}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;left:0;opacity:.95;transition:filter 1.2s}
body.w-rain .cloud{filter:brightness(.72) saturate(.3)}
#hills{position:absolute;left:0;width:100%;height:24vh;top:calc(var(--horizon) - 24vh + 2px);z-index:1;transition:filter 1.2s}
body.w-rain #hills{filter:saturate(.75) brightness(.86)}
body.w-cloudy #hills{filter:saturate(.9) brightness(.96)}
#ground{position:absolute;left:0;right:0;bottom:0;top:var(--horizon);z-index:1;
  background:radial-gradient(ellipse at 50% 0%,#9fdc72 0%,transparent 60%),linear-gradient(#8fd263,#6fbf4c 55%,#5fae42);transition:filter 1.2s}
body.w-rain #ground{filter:saturate(.8) brightness(.85)}
#tufts{position:absolute;inset:0;z-index:1;pointer-events:none}
#tufts svg{position:absolute}
#sunlight{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at 88% 4%,rgba(255,226,140,.42),transparent 55%);mix-blend-mode:soft-light;transition:opacity 1.2s}
body.w-rain #sunlight{opacity:0} body.w-cloudy #sunlight{opacity:.4}
#rain{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity 1.2s}
body.w-rain #rain{opacity:1}
.butterfly{position:absolute;z-index:5;width:22px;height:18px;pointer-events:none;transition:opacity 1s}
body.w-rain .butterfly{opacity:0}
.butterfly .wing{transform-origin:11px 9px;animation:flap .25s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.25)}}

/* ---------- 상단 ---------- */
#hud{position:relative;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px}
.pill{background:rgba(255,250,240,.88);border-radius:999px;padding:7px 13px;box-shadow:0 2px 0 rgba(74,58,42,.15),0 4px 14px rgba(0,0,0,.06);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;backdrop-filter:blur(4px)}
#dayPill small{font-weight:600;opacity:.7;font-size:13px}
#coinPill .coin{width:18px;height:18px}
#hud .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;justify-content:center;padding:0;font-size:18px}
#hint{position:relative;z-index:20;align-self:center;margin:2px 12px 0;max-width:calc(100% - 24px);background:rgba(255,250,240,.92);border-radius:14px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.08);text-align:center;transition:opacity .4s, transform .4s}
#hint.swap{opacity:0;transform:translateY(-4px)}
[hidden]{display:none!important}
#farmTools{position:relative;z-index:20;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 10px 1px}
.toolchip,.fieldSwitch{background:#fffaf0;border-radius:14px;box-shadow:0 2px 0 rgba(74,58,42,.18)}
.toolchip,.fieldSwitch button{min-height:36px;padding:6px 10px;font-size:13px;font-weight:800}
#growthBtn{display:flex;align-items:center;gap:7px}
#growthBtn small{color:#536242;font-size:11px}
#growthBtn.can-upgrade{box-shadow:0 2px 0 #739447,0 0 0 2px #d6ed9b}
#profileBtn{display:flex;align-items:center;gap:6px;min-width:0;max-width:calc(100% - 6px)}
#playerName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#saveState{flex:none;font-size:10px;color:#536242}
#profileBtn.save-alert{background:#fff0db;outline:2px solid #df9a59}
#profileBtn.save-alert #saveState{color:#79370f}
.toolchip[aria-pressed="true"],.fieldSwitch button[aria-pressed="true"]{background:#dceab9;color:#365129}
.fieldSwitch{display:flex;gap:2px;padding:2px}
.fieldSwitch button{min-height:32px;border-radius:12px}
#fieldLabel{display:block;margin:4px 10px 0;min-height:18px;color:#334623;font-size:12px;font-weight:700;text-align:center;position:relative;z-index:20}

/* ---------- 농장 ---------- */
#stage{position:relative;z-index:10;flex:1;display:flex;align-items:safe center;justify-content:center;min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;padding:9px 12px}
#farm{position:relative;width:calc(var(--cell)*3 + var(--gap)*2)}
.decor-row{position:relative;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--cell)*.62)}
.decor-row.bottom{margin-top:calc(var(--gap)*1.2)}
.decor-row.top{margin-bottom:calc(var(--gap)*.6)}
.slot{position:relative;height:100%}
.slot svg{position:absolute;left:-10%;bottom:0;width:120%;height:auto;overflow:visible;pointer-events:none}
.slot .ring{position:absolute;left:12%;right:12%;bottom:4%;height:34%;border-radius:50%;border:2.5px dashed rgba(255,255,255,.95);background:rgba(255,255,255,.25);opacity:0;transform:scale(.8);transition:.25s;pointer-events:none}
body.placing .slot.empty .ring{opacity:1;transform:scale(1);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);background:rgba(255,255,255,.45)}}
.slot.pop svg{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.3) translateY(10%);opacity:0}}
#grid{position:relative;display:grid;grid-template-columns:repeat(3,var(--cell));gap:var(--gap)}
#grid::before{content:"";position:absolute;inset:calc(var(--gap)*-.9);border-radius:calc(var(--cell)*.2);background:rgba(70,130,40,.22);box-shadow:inset 0 0 0 3px rgba(255,255,255,.12)}
.plot{position:relative;width:var(--cell);height:var(--cell);cursor:pointer;outline:none}
.soil{position:absolute;left:5%;right:5%;top:20%;bottom:9%;border-radius:18%;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 14%,rgba(60,30,10,.13) 14% 18%),radial-gradient(ellipse at 50% 35%,#b98a5e,#a0714a 70%);
  box-shadow:0 calc(var(--cell)*.07) 0 #7a5233,0 calc(var(--cell)*.09) 6px rgba(40,60,20,.35),inset 0 2px 0 rgba(255,255,255,.18);
  transition:background 1s, filter 1s, transform .15s}
.plot.wet .soil{background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 14%,rgba(20,10,0,.18) 14% 18%),radial-gradient(ellipse at 45% 30%,#7d5233,#5e3b22 70%);box-shadow:0 calc(var(--cell)*.07) 0 #4b2f1a,0 calc(var(--cell)*.09) 6px rgba(40,60,20,.35),inset 0 2px 0 rgba(255,255,255,.12),inset 6px 6px 0 -2px rgba(255,255,255,.09)}
.plot.wet .soil::after{content:"";position:absolute;left:18%;top:22%;width:22%;height:10%;border-radius:50%;background:rgba(255,255,255,.18);filter:blur(1px)}
.plot.dry .soil::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,transparent 46%,rgba(80,45,20,.22) 47% 48%,transparent 49%),linear-gradient(40deg,transparent 60%,rgba(80,45,20,.18) 61% 62%,transparent 63%);}
.plot:active .soil{transform:scale(.96)}
.plot .crop{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
.crop .sway{transform-box:view-box;transform-origin:50px 140px;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
body.w-rain .crop .sway{animation-duration:2.6s}
.plot.grew .crop{animation:grow .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes grow{from{transform:scale(.82) translateY(4%)}}
.plot .ripe{position:absolute;right:7%;top:7%;width:19%;pointer-events:none;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
@keyframes bob{50%{transform:translateY(-3px) scale(1.08)}}
.plot.focus .soil,.plot:focus-visible .soil,.slot:focus-visible .ring{box-shadow:0 0 0 3px #fff,0 calc(var(--cell)*.07) 0 #7a5233}
.slot:focus-visible .ring{opacity:1}
.plot-note{position:absolute;top:5%;left:5%;display:flex;gap:3px;pointer-events:none}
.plot-note span{background:#fffaf0;border-radius:10px;padding:2px 5px;font-size:clamp(10px,2.8vw,13px);box-shadow:0 1px 3px #46362050}
.plot.problem .soil{outline:2px dashed #fff3b1;outline-offset:1px}
.plot.care-target .soil{outline:2px dashed #f9ffe2;outline-offset:1px}
.plot .irrigation{position:absolute;bottom:9%;left:9%;width:32%;height:16%;opacity:.78;pointer-events:none}
.plot .harvest-ghost{z-index:2}
#houseFrame{position:absolute;inset:0;pointer-events:none}
#houseFrame .glass{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
body.in-greenhouse #farm{padding:calc(var(--cell)*.4) 0 calc(var(--cell)*.19)}
body.in-greenhouse #grid::before{background:#5b89625c}
body.in-greenhouse #ground{background:linear-gradient(#9dc197,#c2d8a4 60%,#8fb184)}
body.in-greenhouse #rain,body.in-greenhouse .butterfly{opacity:0}

/* ---------- 하단 ---------- */
#bar{position:relative;z-index:20;display:flex;gap:10px;padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);justify-content:center}
.btn{background:var(--paper);border-radius:18px;padding:11px 16px;font-weight:800;font-size:15px;box-shadow:0 4px 0 #d9c7a5,0 6px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:7px;position:relative;transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9c7a5}
.btn svg{width:24px;height:24px}
.btn.primary{background:linear-gradient(#ffb866,#f28c3a);color:#fff;box-shadow:0 4px 0 #c96a20,0 6px 16px rgba(0,0,0,.12);text-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.primary:active{box-shadow:0 1px 0 #c96a20}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#e5533d;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.badge:empty{display:none}
.bounce{animation:bounce .4s}
@keyframes bounce{40%{transform:scale(1.15)}}
#placeBar{position:relative;z-index:20;display:none;margin:5px auto 0;background:#fffaf0;border-radius:16px;padding:7px 9px 7px 12px;font-weight:700;font-size:12px;gap:8px;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,.12);width:max-content;max-width:calc(100% - 16px)}
body.placing #placeBar{display:flex}
#placeBar button{background:#efe3cc;border-radius:10px;padding:6px 10px;font-weight:700}

/* ---------- 팝오버/시트 ---------- */
#popover{position:fixed;z-index:60;background:var(--paper);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:none;max-width:min(92vw,360px)}
#popover.show{display:block;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
#popover h4{margin:2px 6px 8px;font-size:14px}
#popover{overflow:auto;max-height:calc(100% - 16px)}
#popover .care-info{margin:2px 6px 8px;font-size:12px;line-height:1.45}
#popover .care-actions{display:grid;gap:6px}
#popover .care-actions button{text-align:left;white-space:normal;min-height:36px}
.seedgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(calc(92vw - 20px),330px)}
.seedbtn{background:#fff;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 #e6d8bd;font-weight:700;font-size:13px}
.seedbtn svg{width:36px;height:36px}
.seedbtn small{font-weight:600;font-size:11px;opacity:.65}
.seedbtn:active{transform:translateY(2px);box-shadow:none}
.poprow{display:flex;gap:8px}
.poprow button{flex:1;background:#fff;border-radius:12px;padding:10px 12px;font-weight:700;box-shadow:0 2px 0 #e6d8bd}
#scrim{position:fixed;inset:0;z-index:50;background:rgba(40,30,20,.28);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.show{opacity:1;pointer-events:auto}
#scrim.clear{background:transparent}
.sheet{position:fixed;left:50%;bottom:0;z-index:55;width:min(100%,520px);max-height:78vh;background:var(--paper);border-radius:24px 24px 0 0;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translate(-50%,0)}
.sheet header{display:flex;align-items:center;padding:16px 18px 8px;gap:8px}
.sheet header h3{margin:0;font-size:18px;flex:1}
.sheet .close{width:36px;height:36px;border-radius:50%;background:#efe3cc;font-size:18px;font-weight:800}
.sheet .body{overflow:auto;padding:4px 16px 18px}
.tabs{display:flex;gap:6px;padding:0 16px 8px}
.tabs button{flex:1;padding:9px;border-radius:12px;background:#efe3cc;font-weight:700;font-size:14px}
.tabs button.on{background:#7cb342;color:#fff}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 0 #eadfc8}
.row svg.ic{width:44px;height:44px;flex:none}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-size:15px}
.row .info span{font-size:12.5px;opacity:.7}
.row .acts{display:flex;gap:6px;flex:none}
.small{background:#7cb342;color:#fff;border-radius:12px;padding:8px 11px;font-weight:800;font-size:13px;box-shadow:0 2px 0 #5a8a2c;white-space:nowrap}
.small.alt{background:#efe3cc;color:var(--ink);box-shadow:0 2px 0 #d9c7a5}
.small:disabled{opacity:.4;box-shadow:none}
.small:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.empty-note{text-align:center;opacity:.65;padding:24px 8px;font-size:14px;line-height:1.6}
.sec{font-size:13px;font-weight:800;opacity:.6;margin:14px 4px 2px}
.sellall{width:100%;margin-top:10px;padding:13px;font-size:15px;border-radius:14px}
.toggle{width:52px;height:30px;border-radius:15px;background:#d8ccb4;position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:#7cb342}.toggle.on::after{left:25px}
.growth-list{display:grid;gap:7px;margin:10px 0}
.growth-step{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:8px;padding:9px 10px;background:#f2ead9;border-radius:13px}
.growth-step.current{background:#e5edce;outline:1px solid #acc479}
.growth-step .step-icon{font-size:19px;text-align:center}
.growth-step b,.growth-step small{display:block}
.growth-step b{font-size:14px}
.growth-step small{font-size:12px;margin-top:2px;color:#574d3c}
.growth-actions{margin:12px 0}
.growth-actions .small{min-height:38px;width:100%;white-space:normal}
.growth-actions p{font-size:12px;margin:7px 4px;color:#574d3c;text-align:center}
.farm-profile-current,.farm-profile-form{display:grid;gap:8px;border-radius:14px;padding:12px;background:#f2ead9;margin:8px 0}
.farm-profile-current b{overflow-wrap:anywhere}
.farm-profile-current small,.farm-profile-note{font-size:13px;line-height:1.5}
#cloudSignInForm label{display:flex;gap:8px;align-items:center}
#cloudSignInForm input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:#628742}
.farm-profile-actions,.farm-profile-code{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.farm-profile-actions button,.farm-profile-current button{min-height:34px}
.farm-profile-form label{font-size:14px;font-weight:700}
.farm-profile-form input:not([type="file"]),.farm-profile-code input{min-width:0;width:100%;border:1px solid #cdbb97;border-radius:10px;background:#fffaf0;padding:9px 10px;color:var(--ink);font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
.farm-profile-code input{flex:1;font-family:monospace;font-size:12px}
.farm-profile-form input[type="file"]{font-size:12px;max-width:100%}
.farm-profile-form .farm-file-label{font-size:12px}
.farm-profile-error{font-size:13px;color:#803d17;background:#fff0db;border-radius:10px;padding:8px}
.farm-profile-list{display:grid;gap:6px}
.farm-profile-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:normal;text-align:left}
.farm-profile-list b{overflow-wrap:anywhere}
.farm-profile-list span{flex:none;font-size:11px}

/* ---------- 효과 ---------- */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none}
.drop{position:absolute;width:6px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8fd0ff;box-shadow:inset -1px -1px 0 rgba(0,90,160,.25)}
.leafbit{position:absolute;width:12px;height:7px;border-radius:50%;background:#7ccf4f}
.crumb{position:absolute;width:6px;height:6px;border-radius:50%;background:#7a5233}
.floattext{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.15);white-space:nowrap;animation:floatup 1.4s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-180%)}}
.flyer{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px}
.can{position:absolute;width:64px;height:52px;margin:-26px 0 0 -32px}
#dayveil{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0;background:linear-gradient(#2b3a67,#6b5b95 60%,#e8a87c);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;transition:opacity .55s}
#dayveil.show{opacity:1;pointer-events:auto}
#dayveil .big{font-size:28px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.25)}
#dayveil .sub{margin-top:8px;font-size:16px;opacity:.9}
#dayveil .stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 15%,#fff,transparent),radial-gradient(2px 2px at 40% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 45%,#fff,transparent);opacity:.8}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-10px);z-index:70;background:rgba(74,58,42,.92);color:#fff;padding:9px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){
  #bar{gap:7px;padding-inline:8px}
  #bar .btn{padding-inline:10px;gap:5px;font-size:14px;white-space:nowrap}
  #bar .btn svg{width:21px;height:21px}
  #hud{gap:5px;padding-inline:8px}
  .pill{padding-inline:9px}
}
@media (orientation:landscape) and (max-height:540px){
  #app{display:grid;grid-template-columns:minmax(174px,29vw) minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr auto}
  #hud,#farmTools,#fieldLabel,#hint,#bar{grid-column:1;min-width:0}
  #hud{grid-row:1;gap:5px;flex-wrap:wrap;padding-inline:8px}
  #hud .pill{padding-inline:7px;font-size:13px}
  #hud .iconbtn{width:34px;height:34px}
  #hud #dayPill small{font-size:11px}
  #hud .spacer{display:none}
  #farmTools{grid-row:2}
  #fieldLabel{grid-row:3}

<script>
"use strict";
/* =========================================================
   데이터

const CROPS = {

  tomato:    {name:'토마토', stages:5, price:10, yield:3, free:true,  cost:0,  regrow:3,    desc:'수확 후에도 또 열려요'},
  strawberry:{name:'딸기',   stages:4, price:16, yield:2, free:false, cost:35, regrow:3,    desc:'수확 후에도 또 열려요'},
  sunflower: {name:'해바라기',stages:6, price:70, yield:1, free:false, cost:30, regrow:null, desc:'키가 쑥쑥, 비싸게 팔려요'},
  paprika:   {name:'파프리카',stages:5, price:18, yield:3, free:true, cost:0, regrow:3, greenhouse:true, desc:'온실에서 열리는 달콤한 열매'},
};
const CROP_ORDER = ['lettuce','carrot','tomato','strawberry','sunflower','paprika'];
const DECOR = {
  tulip:    {name:'분홍 튤립',  cost:20, desc:'봄빛 꽃 세 송이'},
  daisy:    {name:'데이지',     cost:20, desc:'작고 하얀 꽃무리'},
  lavender: {name:'라벤더',     cost:25, desc:'보랏빛 향기'},
  pot:      {name:'꽃 화분',    cost:30, desc:'토분에 담은 제라늄'},
  lantern:  {name:'정원 등불',  cost:50, desc:'흐린 날 더 따뜻해요'},
  birdhouse:{name:'새집',       cost:60, desc:'가끔 작은 새가 놀러 와요'},
  bench:    {name:'작은 벤치',  cost:80, desc:'잠깐 앉아 쉬어 가요'},
};
const DECOR_ORDER = ['tulip','daisy','lavender','pot','lantern','birdhouse','bench'];
const FARM_STEPS = [
  {icon:'🌱', name:'새내기 농부', note:'텃밭 6칸에서 농사를 시작해요.'},
  {icon:'🌿', name:'텃밭지기', note:'노지 9칸 · 잡초 관리와 비료', cost:60, action:'밭을 9칸으로 넓히기'},
  {icon:'🧺', name:'작은 농장주', note:'노지 12칸 · 해충 관리와 방제제', cost:150, action:'밭을 12칸으로 넓히기'},
  {icon:'🏡', name:'온실 농장주', note:'온실 6칸 · 파프리카 재배', cost:240, action:'온실 짓기'},
  {icon:'💧', name:'스마트팜 농장주', note:'노지와 온실에 자동 관수 설치', cost:360, action:'스마트 관수 설치'},
];
const SUPPLIES = {
  fertilizer:{name:'비료', icon:'🌱', level:1, cost:8, note:'수확할 때까지 한 번 · 다음 성장 때 한 단계 더'},
  treatment:{name:'방제제', icon:'🛡️', level:2, cost:10, note:'노지의 해충을 없애고 다음 이틀간 보호'},
};
const WEATHER = {sunny:{icon:'☀️',name:'맑음'},cloudy:{icon:'⛅',name:'구름 조금'},rain:{icon:'🌧️',name:'비'}};
const SAVE_KEY = 'today-small-farm-v1';

/* =========================================================
   상태 / 저장
   ========================================================= */
function emptyPlot(){
  return {crop:null,stage:0,watered:false,wet:false,issue:null,fed:false,fertilizer:false,protectedUntil:0};
}
function freshState(){
  return {v:1, day:1, weather:'sunny', coins:0, rows:2,
    plots:Array.from({length:12},emptyPlot), greenhousePlots:Array.from({length:6},emptyPlot),
    greenhouse:false, smart:false, autoWater:true, field:'outdoor',
    supplies:{fertilizer:2,treatment:1},
    basket:{}, seeds:{strawberry:0,sunflower:0}, decorInv:{}, decor:Array(10).fill(null),
    sound:{rain:false,sfx:false}, flags:{}, lastSeed:'lettuce'};
}
let S=freshState();
function restoreState(d){
  const f=freshState();
  if(!d||d.v!==1) return f;
  const count=(n,fallback=0)=>Number.isSafeInteger(n)&&n>=0?n:fallback;
  const counts=(keys,source)=>Object.fromEntries(keys.filter(key=>Object.hasOwn(source||{},key)).map(key=>[key,count(source[key])]));
  const plots=(n,saved,inHouse)=>Array.from({length:n},(_,i)=>{
    const p=saved?.[i];
    if(!CROP_ORDER.includes(p?.crop)||(!inHouse&&CROPS[p.crop].greenhouse)) return {...emptyPlot(),wet:p?.wet===true};
    return {crop:p.crop,stage:Math.min(CROPS[p.crop].stages,count(p.stage)),watered:p.watered===true,wet:p.wet===true,
      issue:!inHouse&&['weed','pest'].includes(p.issue)?p.issue:null,fed:p.fed===true,fertilizer:p.fertilizer===true,protectedUntil:count(p.protectedUntil)};
  });
  const rows=[2,3,4].includes(d.rows)?d.rows:2;
  const greenhouse=rows===4&&d.greenhouse===true;
  return {...f,day:Math.max(1,count(d.day,1)),coins:count(d.coins),rows,
    weather:['sunny','cloudy','rain'].includes(d.weather)?d.weather:'sunny',greenhouse,smart:greenhouse&&d.smart===true,
    autoWater:d.autoWater!==false,field:greenhouse&&d.field==='greenhouse'?'greenhouse':'outdoor',
    plots:plots(12,d.plots,false),greenhousePlots:plots(6,d.greenhousePlots,true),
    basket:counts(CROP_ORDER,d.basket),seeds:counts(['strawberry','sunflower'],d.seeds),
    decorInv:counts(DECOR_ORDER,d.decorInv),
    decor:Array.from({length:10},(_,i)=>DECOR_ORDER.includes(d.decor?.[i])?d.decor[i]:null),
    supplies:{fertilizer:count(d.supplies?.fertilizer,2),treatment:count(d.supplies?.treatment,1)},
    lastSeed:CROP_ORDER.includes(d.lastSeed)?d.lastSeed:'lettuce',
    sound:{rain:d.sound?.rain===true,sfx:d.sound?.sfx===true},
    flags:Object.fromEntries(['planted','grown','sold','pestSeen','weedSeen'].filter(key=>d.flags?.[key]===true).map(key=>[key,true]))};
}
function legacyFarm(){
  try{
    const raw=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(raw?.v===1) return restoreState(raw);
  }catch{}
  return null;
}

const SESSION_KEY='today-small-farm-player-v1';
const LEGACY_ID='legacy';
let deviceDb, deviceReady=false, serverReady=null;
let profile=null, profileList=[], saveView='device', profileBusy=false, profilesStarting=true;
let inFlight=null, queued=null, saving=null, saveError='', profileError='';
let createAttempt=null;

function farmCode(){
  return Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join('');
}
function snapshotFarm(){ return JSON.parse(JSON.stringify(S)); }
function saveProblem(code){ return Object.assign(new Error(code),{code}); }
function openDevice(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open('today-small-farm-players',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('farms',{keyPath:'id'}).createIndex('name','name',{unique:true});
    request.onsuccess=()=>resolve(request.result);
    request.onerror=request.onblocked=()=>reject(saveProblem('storage'));
  });
}
function deviceRecord(action,data={}){
  return new Promise((resolve,reject)=>{
    const write=action==='create'||action==='write';
    const tx=deviceDb.transaction('farms',write?'readwrite':'readonly'), store=tx.objectStore('farms');
    let value, issue;
    tx.oncomplete=()=>issue?reject(issue):resolve(value);
    tx.onabort=()=>reject(saveProblem('storage'));
    if(action==='list'){
      const req=store.getAll();
      req.onsuccess=()=>{ value=req.result; };
      return;
    }
    const req=store.get(data.id);
    req.onsuccess=()=>{
      const old=req.result;
      if(action==='read'){ value=old; if(!old) issue=saveProblem('missing'); return; }
      if(action==='create'){
        if(old){ value=old; return; }
        value={id:data.id,name:data.name,state:data.state,revision:0,operation:null,updatedAt:Date.now()};
      }else{
        if(!old){ issue=saveProblem('missing'); return; }
        if(old.operation===data.operation){ value=old; return; }
        if(old.revision!==data.revision){ issue=saveProblem('conflict'); return; }
        value={...old,state:data.state,revision:old.revision+1,operation:data.operation,updatedAt:Date.now()};
      }
      const put=store.put(value);
      put.onerror=e=>{ if(put.error?.name==='ConstraintError'){ e.preventDefault(); issue=saveProblem('name'); } };
    };
  });
}
const FIREBASE_CONFIG=/* __FARM_FIREBASE_CONFIG__ */ {};
const SDK_VERSION='13.2.0';
const SAVE_API='__FARM_SAVE_ENDPOINT__';
const CLOUD_CONFIGURED=/^https:\/\/[a-z0-9-]+\.onrender\.com\/api\/farm-save$/.test(SAVE_API)&&Boolean(FIREBASE_CONFIG.projectId);
let cloudAuth=null, cloudSdk=null, cloudSetup=null, cloudSession=null, cloudFarms=[], cloudListLoad=null, lastCloudWrite=0;

function setCloudUser(user){
  cloudSession=user?{owner:user.uid}:null;
}
async function prepareCloudAuth(){
  if(!CLOUD_CONFIGURED) return;
  if(!cloudSetup){
    const base='https://www.gstatic.com/firebasejs/'+SDK_VERSION+'/';
    cloudSetup=Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js')]).then(async ([appSdk,authSdk])=>{
      cloudSdk=authSdk;
      const app=appSdk.getApps().find(app=>app.name==='little-farm')||appSdk.initializeApp(FIREBASE_CONFIG,'little-farm');
      const auth=authSdk.getAuth(app);
      await authSdk.setPersistence(auth,authSdk.browserSessionPersistence);
      await auth.authStateReady();
      cloudAuth=auth;
      setCloudUser(auth.currentUser);
    }).catch(()=>{
      cloudSetup=null;
      throw saveProblem('network');
    });
  }
  await cloudSetup;
}
async function beginCloudSignIn(){
  if(!CLOUD_CONFIGURED) throw saveProblem('network');
  if(!cloudAuth){
    await prepareCloudAuth();
    if(cloudSession){ await refreshCloudFarms(); renderSheet(); return; }
    renderSheet();
    setProfileError('연결됐어요. 구글 로그인 버튼을 다시 눌러 주세요.');
    return;
  }
  try{
    const {user}=await cloudSdk.signInWithPopup(cloudAuth,new cloudSdk.GoogleAuthProvider());
    setCloudUser(user);
  }catch(error){
    if(error.code==='auth/popup-closed-by-user') return;
    if(error.code==='auth/popup-blocked') throw saveProblem('popup');
    throw saveProblem('signin');
  }
  if(profile?.mode==='server'&&profile.owner===cloudSession.owner&&saveError==='signin'){
    saveError=''; void flushFarm();
  }
  const pending=refreshCloudFarms();
  renderSheet();
  void pending.then(renderCloudList);
}
async function restoreCloudSession(){
  if(CLOUD_CONFIGURED&&rememberedFarm()?.mode==='server'){
    try{ await prepareCloudAuth(); }
    catch(e){ profileError=profileErrorMessage(e); }
  }
}
async function endCloudSignIn(){
  if(cloudAuth) await cloudSdk.signOut(cloudAuth);
  setCloudUser(null); serverReady=false; cloudFarms=[];
}
async function cloudAccess(force=false){
  const user=cloudAuth?.currentUser;
  if(!user||user.uid!==cloudSession?.owner) throw saveProblem('signin');
  try{ return await user.getIdToken(force); }
  catch{ throw saveProblem('signin'); }
}
async function serverRecord(action,data={}){
  if(action==='write'){
    const delay=lastCloudWrite+6300-Date.now();
    if(delay>0) await new Promise(resolve=>setTimeout(resolve,delay));
    if(profile?.owner!==cloudSession?.owner) throw saveProblem('signin');
  }
  const send=async token=>{
    try{
      if(action==='write') lastCloudWrite=Date.now();
      return await fetch(SAVE_API,{
        method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
        body:JSON.stringify({action,...data}),cache:'no-store',signal:AbortSignal.timeout(85000)
      });
    }catch{ throw saveProblem('network'); }
  };
  let reply=await send(await cloudAccess());
  if(reply.status===401){
    reply=await send(await cloudAccess(true));
    if(reply.status===401) await endCloudSignIn();
  }
  let body;
  try{ body=await reply.json(); }catch{ throw saveProblem('network'); }
  if(!reply.ok) throw saveProblem(reply.status===401?'signin':
    ['missing','conflict','invalid','invite','rate','missing_file'].includes(body?.error)?body.error:'network');
  if(action==='list'){
    if(!Array.isArray(body?.farms)) throw saveProblem('network');
    return body.farms.filter(row=>/^[a-f0-9]{32}$/.test(row.id)&&typeof row.name==='string');
  }
  if(!body||typeof body.name!=='string'||!Number.isInteger(body.revision)||body.state?.v!==1) throw saveProblem('network');
  return body;
}
function refreshCloudFarms(){
  if(!cloudSession){ serverReady=false; return Promise.resolve(); }
  if(cloudListLoad) return cloudListLoad;
  const owner=cloudSession.owner;
  cloudListLoad=serverRecord('list').then(farms=>{
    if(cloudSession?.owner!==owner) return;
    cloudFarms=farms; serverReady=true;
  }).catch(e=>{
    serverReady=false; profileError=profileErrorMessage(e);
  }).finally(()=>{ cloudListLoad=null; });
  return cloudListLoad;
}
async function openCloudStorage(){
  if(!CLOUD_CONFIGURED) return;
  try{
    await prepareCloudAuth();
    if(!cloudSession) return;
    const pending=refreshCloudFarms();
    renderCloudList();
    await pending;
  }catch(e){ profileError=profileErrorMessage(e); }
  renderCloudList();
}
function recordFor(mode,action,data){
  return mode==='server'?serverRecord(action,data):deviceRecord(action,data);
}
function rememberFarm(){
  try{
    if(!profile||profile.mode==='guest') sessionStorage.removeItem(SESSION_KEY);
    else sessionStorage.setItem(SESSION_KEY,JSON.stringify({mode:profile.mode,id:profile.id,
      revision:profile.revision,name:profile.name,owner:profile.owner,inFlight,queued}));
  }catch{}
}
function rememberedFarm(){
  try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)); }catch{ return null; }
}
function saveMessage(){
  if(!profile) return '플레이어 선택';
  if(profile.mode==='guest') return '저장 없는 체험';
  if(saveError==='conflict') return '다른 곳에서 갱신됨';
  if(saveError==='signin') return '로그인 필요';
  if(saveError) return '저장 실패';
  if(inFlight||queued) return '저장 중…';
  return profile.mode==='server'?'클라우드 저장됨':'기기 저장됨';
}
function updateSaveStatus(){
  $('playerName').textContent=profile?.name||'플레이어';
  const status=saveMessage();
  if($('saveState').textContent!==status) $('saveState').textContent=status;
  $('profileBtn').setAttribute('aria-label',`플레이어와 저장 · ${profile?.name||'선택'} · ${status}`);
  $('profileBtn').classList.toggle('save-alert',!!saveError);
  const notice=$('profileSaveNotice');
  if(notice) notice.textContent=saveError==='conflict'
    ? '다른 곳의 저장이 더 최신이에요. 최신 농장을 열거나 현재 진행을 별도 농장으로 복사할 수 있어요.'
    : saveError?'현재 화면의 진행을 아직 저장하지 못했어요. 다시 저장할 수 있어요.':saveMessage();
  if($('retryFarmSave')) $('retryFarmSave').hidden=!saveError||saveError==='conflict';
  if($('reloadFarmSave')) $('reloadFarmSave').hidden=!saveError;
}
function saveNow(){
  if(!profile||profile.mode==='guest') return;
  queued={state:snapshotFarm(),operation:farmCode()};
  rememberFarm(); updateSaveStatus();
  if(!saveError) void flushFarm();
}
function flushFarm(){
  if(saving) return saving;
  if(!profile||profile.mode==='guest'||saveError||(!inFlight&&!queued)) return Promise.resolve();
  saving=(async()=>{
    while(!saveError&&(inFlight||queued)){
      if(!inFlight){ inFlight=queued; queued=null; }
      rememberFarm(); updateSaveStatus();
      try{
        const row=await recordFor(profile.mode,'write',{id:profile.id,revision:profile.revision,...inFlight});
        profile.revision=row.revision; inFlight=null;
      }catch(e){
        saveError=e.code||'storage';
        toast(saveError==='conflict'?'다른 곳에서 먼저 저장했어요. 플레이어 메뉴에서 확인해 주세요.':'저장에 실패했어요. 플레이어 메뉴에서 다시 저장할 수 있어요.');
      }
      rememberFarm(); updateSaveStatus();
    }
  })().finally(()=>{ saving=null; });
  return saving;
}
function activateFarm(mode,id,row,resume=null,initialError=''){
  profile={mode,id,name:row.name,revision:row.revision,owner:mode==='server'?cloudSession?.owner:undefined};
  S=restoreState(row.state);
  inFlight=null; queued=null; saveError=''; profileError=''; createAttempt=null;
  if(resume&&(resume.inFlight||resume.queued)){
    if(row.operation===resume.inFlight?.operation) queued=resume.queued;
    else{
      inFlight=resume.inFlight; queued=resume.queued;
      if(row.revision!==resume.revision) saveError='conflict';
    }
    const latest=queued||inFlight;
    if(latest?.state?.v===1) S=restoreState(latest.state);
  }
  if(initialError&&!saveError) saveError=initialError;
  saveView=mode==='server'?'server':'device';
  shopTab='seed'; careMode=false; placing=null;
  rememberFarm(); closeSheet(true); renderAll(); layout(); $('stage').scrollTop=0;
  $('profileBtn').focus({preventScroll:true});
  void flushFarm();
}
async function refreshDeviceFarms(){
  if(!deviceReady) return;
  try{
    profileList=(await deviceRecord('list')).sort((a,b)=>b.updatedAt-a.updatedAt);
  }catch{ deviceReady=false; }
}
async function initFarms(){
  openSheet('profiles');
  const legacy=legacyFarm();
  await restoreCloudSession();
  const cloudSelected=saveView==='server';
  try{
    deviceDb=await openDevice(); deviceReady=true;
    if(legacy) await deviceRecord('create',{id:LEGACY_ID,name:'기존 농장',state:legacy});
    await refreshDeviceFarms();
  }catch{ deviceReady=false; }
  const remembered=rememberedFarm();
  const sameCloudOwner=remembered?.mode==='server'&&remembered.owner===cloudSession?.owner&&!!cloudSession;
  if(remembered?.mode==='server') saveView='server';
  profilesStarting=false;
  if(remembered?.mode==='device'&&deviceReady||sameCloudOwner){
    try{
      const row=await recordFor(remembered.mode,'read',{id:remembered.id});
      activateFarm(remembered.mode,remembered.id,row,remembered);
    }catch(e){
      profileError='직전에 열었던 농장을 불러오지 못했어요. 다시 선택해 주세요.';
      const draft=(remembered.queued||remembered.inFlight)?.state;
      if(draft?.v===1) activateFarm(remembered.mode,remembered.id,
        {name:remembered.name||'기존 농장',revision:remembered.revision,state:draft},remembered,e.code||'storage');
    }
  }else if(!remembered&&profileList.length===1&&profileList[0].id===LEGACY_ID){
    activateFarm('device',LEGACY_ID,profileList[0]);
  }else if(!deviceReady&&legacy){
    profileError='기기 저장을 쓸 수 없어요. 체험으로 열면 기존 농장을 불러올 수 있어요.';
  }
  if(cloudSelected){
    saveView='server';
    if(sheetOpen!=='profiles') openSheet('profiles');
  }
  if(sheetOpen==='profiles') renderSheet();
  if(cloudSession) await refreshCloudFarms();
  if(sheetOpen==='profiles'&&saveView==='server'&&!profileBusy) renderSheet();
}

const Snd = (()=>{
  let ctx=null, noiseBuf=null, rainNode=null, rainGain=null, dripTimer=null;
  function ensure(){
    if(!ctx){ const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC();
      const len=ctx.sampleRate*2; noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate); const d=noiseBuf.getChannelData(0); let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=w*0.6+last*3; } }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function noise(){ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }
  function water(){
    if(!S.sound.sfx || !ensure()) return;
    const t=ctx.currentTime, src=noise(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
    bp.type='bandpass'; bp.frequency.setValueAtTime(1800,t); bp.frequency.linearRampToValueAtTime(900,t+.9); bp.Q.value=1.2;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.08); g.gain.setValueAtTime(.2,t+.6); g.gain.exponentialRampToValueAtTime(.001,t+1.1);
    src.connect(bp).connect(g).connect(ctx.destination); src.start(t); src.stop(t+1.2);
    for(let i=0;i<6;i++) blip(t+.1+i*.13+Math.random()*.05, 900+Math.random()*900, .05);
  }
  function blip(t,f,v){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.8,t+.06); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.09); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+.1); }
  function pop(kind){
    if(!S.sound.sfx || !ensure()) return; const t=ctx.currentTime;
    if(kind==='carrot'){ const src=noise(), lp=ctx.createBiquadFilter(), g=ctx.createGain(); lp.type='lowpass'; lp.frequency.value=600; g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); src.connect(lp).connect(g).connect(ctx.destination); src.start(t); src.stop(t+.3); }
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(320,t+.05); o.frequency.exponentialRampToValueAtTime(880,t+.16); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.07); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+.32);
  }
  function coin(){ if(!S.sound.sfx || !ensure()) return; const t=ctx.currentTime; [988,1319].forEach((f,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t+i*.08); g.gain.exponentialRampToValueAtTime(.12,t+i*.08+.01); g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.25); o.connect(g).connect(ctx.destination); o.start(t+i*.08); o.stop(t+i*.08+.3); }); }
  function plant(){ if(!S.sound.sfx || !ensure()) return; const t=ctx.currentTime; const src=noise(), lp=ctx.createBiquadFilter(), g=ctx.createGain(); lp.type='lowpass'; lp.frequency.value=500; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); src.connect(lp).connect(g).connect(ctx.destination); src.start(t); src.stop(t+.2); }
  function updateRain(){
    const want = S.sound.rain && S.weather==='rain';
    if(want){ if(!ensure()) return; if(rainNode) return;

      rainGain=ctx.createGain(); rainGain.gain.setValueAtTime(0,ctx.currentTime); rainGain.gain.linearRampToValueAtTime(.16,ctx.currentTime+1.5);
      rainNode.connect(hp).connect(lp).connect(rainGain).connect(ctx.destination); rainNode.start();
      const drip=()=>{ if(!rainNode) return; blip(ctx.currentTime, 1400+Math.random()*1600, .015+Math.random()*.02); dripTimer=setTimeout(drip, 40+Math.random()*160); }; drip();
    } else if(rainNode){ const n=rainNode, g=rainGain; rainNode=null; clearTimeout(dripTimer); try{ g.gain.linearRampToValueAtTime(0,ctx.currentTime+.8); n.stop(ctx.currentTime+.9); }catch(e){} }
  }
  return {water,pop,coin,plant,updateRain,ensure};
})();

const rainCv=$('rain'), rctx=rainCv.getContext('2d'); let drops=[], splashes=[], dpr=1;
function sizeRain(){ dpr=Math.min(2,devicePixelRatio||1); rainCv.width=innerWidth*dpr; rainCv.height=innerHeight*dpr; rainCv.style.width=innerWidth+'px'; rainCv.style.height=innerHeight+'px';

function newDrop(any){ return {x:Math.random()*(innerWidth+100)-50, y:any?Math.random()*innerHeight:-20-Math.random()*100, v:9+Math.random()*7, l:10+Math.random()*12, floor: innerHeight*(.35+Math.random()*.65)}; }
let lastT=0;
function frame(t){

/* ---- 안내 문구 ---- */
let hintText='', hintTimer;
function hintFor(){
  const F=S.flags, plots=fieldPlots().slice(0,plotCount()), inHouse=S.field==='greenhouse';
  const anyCrop=plots.some(p=>p.crop), anyRipe=plots.some(isRipe);
  const needWater=plots.filter(p=>p.crop&&!isRipe(p)&&!p.watered).length;
  const basketN=Object.values(S.basket).reduce((a,b)=>a+b,0);
  if(placing) return '빛나는 자리를 눌러 장식을 놓아보세요';
  if(careMode) return S.rows>=4&&!inHouse?'비료나 방제제를 줄 작물을 눌러요':'비료를 줄 작물을 눌러요';
  if(!F.planted) return '🌱 빈 밭을 눌러 씨앗을 심어보세요';
  if(plots.some(p=>p.issue==='weed')) return '🌿 잡초가 표시된 밭을 눌러 바로 뽑아요';
  if(plots.some(p=>p.issue==='pest')) return '🐛 해충이 표시된 밭을 눌러 살펴봐요';
  if(anyRipe) return '✨ 반짝이는 작물을 눌러 수확해 보세요';
  if(basketN&&!F.sold) return '🧺 바구니에서 수확물을 팔 수 있어요';
  if(farmLevel()===0&&S.coins>=FARM_STEPS[1].cost) return '🌿 농장 성장에서 밭을 한 줄 넓힐 수 있어요';
  if(!anyCrop) return inHouse?'🌱 온실에 파프리카를 심어 보세요':'🌱 빈 밭을 눌러 씨앗을 심어보세요';
  if(needWater) return `💧 물이 필요한 밭 ${needWater}칸 · 마른 밭을 눌러요`;
  if(!F.grown) return '🌙 다음 날이 되면 물 먹은 작물이 자라요';
  if(inHouse) return '🏡 햇살이 온실을 따뜻하게 비추고 있어요';
  if(S.weather==='rain') return '🌧️ 빗물이 밭을 적셔 줘요 · 잠시 쉬어 가요';
  const calm=['☀️ 오늘도 농장은 평화로워요','🍃 바람이 살랑, 잎이 흔들려요','🌼 내 속도대로 천천히 돌봐요'];
  return calm[S.day%calm.length];
}
function renderHint(){
  const t=hintFor();
  if(t===hintText) return;
  hintText=t;
  const h=$('hint');
  clearTimeout(hintTimer); h.classList.add('swap');
  hintTimer=setTimeout(()=>{ h.textContent=t; h.classList.remove('swap'); },160);
}

function layout(){
  const stage=$('stage'), rows=fieldRows(), inHouse=S.field==='greenhouse';

const fx=$('fx');
function centerOf(el,fy=.5){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height*fy]; }
function floatText(x,y,t){ const d=document.createElement('div'); d.className='floattext'; d.style.left=x+'px'; d.style.top=y+'px'; d.textContent=t; fx.appendChild(d); setTimeout(()=>d.remove(),1500); }
function particles(x,y,cls,n,spread=60,up=70,color){
  for(let i=0;i<n;i++){ const p=document.createElement('div'); p.className=cls; if(color) p.style.background=color; p.style.left=x+'px'; p.style.top=y+'px'; fx.appendChild(p);
    const dx=(Math.random()-.5)*spread*2, dy=-up*(.5+Math.random()*.7);
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx*.6}px,${dy}px) rotate(${Math.random()*360}deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy*.2+30}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove(); }
}
function flyTo(html,x,y,target,delay=0){
  const f=document.createElement('div');
  f.className='flyer'; f.innerHTML=html; f.style.left=x+'px'; f.style.top=y+'px'; fx.appendChild(f);
  const [tx,ty]=centerOf(target), dx=tx-x, dy=ty-y;

let busy=false, careMode=false;
function automaticWater(field=S.field){
  return (S.smart&&S.autoWater)||(field==='outdoor'&&S.weather==='rain');
}

  const rain=field==='outdoor'&&S.weather==='rain';
  if(!automaticWater(field)) return;
  fieldPlots(field).slice(0,plotCount(field)).forEach(p=>{
    if(p.crop&&!isRipe(p)){ p.wet=true; p.watered=true; }

  });
}
function onPlot(i){

  const p=fieldPlots()[i], el=grid.children[i];
  if(p.issue==='weed') return clearIssue(i);

    return;
  }
  if(!p.crop) return openSeedPicker(i,el);
  if(isRipe(p)) return harvest(i,el);
  if(p.issue==='pest') return openCare(i,el);
  if(!p.watered) return water(i,el);
  const [x,y]=centerOf(el,.2);
  const left=CROPS[p.crop].stages-p.stage;
  floatText(x,y,automaticWater()?'이미 촉촉해요 💧':left===1?'내일이면 다 자라요 ✨':'충분히 마셨어요 · 내일 자라요');
}
function plant(i,type){
  const p=fieldPlots()[i], el=grid.children[i], c=CROPS[type];
  if(!c||p.crop||(c.greenhouse&&S.field!=='greenhouse')) return;
  if(!c.free){

function setCareMode(on){

function openCare(i,el){
  const p=fieldPlots()[i], fertilizer=SUPPLIES.fertilizer, treatment=SUPPLIES.treatment;
  const issue=p.issue==='pest'?'해충이 찾아왔어요. 손으로 떼거나 방제제를 쓸 수 있어요.':'작물 상태가 좋아요.';

  }

/* ---- 다음 날 ---- */
function rollWeather(){
  if(S.day===2) return 'sunny';
  if(S.day===3) return 'rain';
  const r=Math.random(); return r<.55?'sunny':r<.8?'cloudy':'rain';
}
function addCareIssue(){
  const plots=S.plots.slice(0,plotCount('outdoor'));
  const windows=[
    {type:'pest',rows:4,flag:'pestSeen',day:0},
    {type:'weed',rows:3,flag:'weedSeen',day:1}
  ];
  for(const {type,rows,flag,day} of windows){
    if(S.rows<rows||plots.some(p=>p.issue===type)||(S.flags[flag]&&S.day%3!==day)) continue;
    const choices=plots.filter(p=>p.crop&&!isRipe(p)&&!p.issue&&(type!=='pest'||!protectedPlot(p)));
    if(choices.length){
      choices[Math.floor(Math.random()*choices.length)].issue=type;
      S.flags[flag]=true;
      return;
    }
  }
}
function nextDay(){
  if(busy||sheetOpen||popAnchor) return;
  busy=true; cancelPlace(); if(careMode) setCareMode(false);
  const veil=$('dayveil'), active=S.field, grew=[];
  const fields=S.greenhouse?['outdoor','greenhouse']:['outdoor'];
  for(const field of fields){
    fieldPlots(field).slice(0,plotCount(field)).forEach((p,i)=>{
      if(p.crop&&p.watered&&!p.issue&&!isRipe(p)){
        p.stage=Math.min(CROPS[p.crop].stages,p.stage+(p.fertilizer?2:1));
        p.fertilizer=false; S.flags.grown=true;
        if(field===active) grew.push(i);
      }
      p.watered=false; p.wet=false;
    });
  }
  S.day++; S.weather=rollWeather();
  fields.forEach(waterAutomatically);
  addCareIssue();
  saveNow();
  $('veilBig').textContent=`${S.day}일째 아침`;
  $('veilSub').textContent=S.weather==='rain'?'🌧️ 비가 내려 노지 밭이 촉촉해요':S.weather==='cloudy'?'⛅ 구름이 살짝 낀 날이에요':'☀️ 햇살이 따뜻한 날이에요';
  veil.classList.add('show');
  setTimeout(()=>{
    renderHUD(); applyWeather(); renderHint();
    for(let i=0;i<plotCount();i++) renderPlot(i,grew.includes(i));
  },420);
  setTimeout(()=>{ veil.classList.remove('show'); busy=false; },1080);
}

/* ---- 씨앗 고르기 ---- */
const pop=$('popover'), scrim=$('scrim'), sheet=$('sheet');
let popAnchor=null, sheetAnchor=null, sheetOpen=null, shopTab='seed', placing=null;
function syncOverlay(){
  const active=!!(popAnchor||sheetOpen);
  $('app').inert=active;
  scrim.classList.toggle('show',active);
  scrim.classList.toggle('clear',!!popAnchor&&!sheetOpen);
}
function showPopover(anchor,html){

}
function positionPopover(){
  if(!popAnchor) return;
  const r=popAnchor.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
  const left=Math.max(8,Math.min(innerWidth-pw-8,r.left+r.width/2-pw/2));

}
function closePopover(){

}
function openSeedPicker(i,el){

async function createProfile(mode,name,state,invite){
  if(!name||name.length>24) throw saveProblem('invalid');
  const signature=JSON.stringify({mode,name,state});
  if(createAttempt?.signature!==signature) createAttempt={signature,id:farmCode(),operation:farmCode()};
  const id=createAttempt.id;
  const row=await recordFor(mode,'create',{id,name,state,...(mode==='server'?{invite,operation:createAttempt.operation}:{})});
  if(mode==='device') await refreshDeviceFarms();
  activateFarm(mode,id,row);
  if(mode==='server') void refreshCloudFarms().then(renderCloudList);
}

  e.preventDefault();
  if(form.id==='cloudSignInForm'){ void profileAction(beginCloudSignIn); return; }
  const data=new FormData(form), mode=saveView;
  const name=String(data.get('player')).trim(), copy=e.submitter?.value==='copy';
  void profileAction(async()=>{
    if(await readyToSwitch(copy)) await createProfile(mode,name,copy?snapshotFarm():freshState(),data.get('invite'));
  });
});

  e.target.value='';

    let data;

      if(file.size>60000) throw new Error();

      if(data.format!=='small-farm-save'||data.state?.v!==1||typeof data.name!=='string') throw new Error();
    }catch{ setProfileError('농장 진행 파일을 읽을 수 없어요. 게임에서 내보낸 JSON을 골라 주세요.'); return; }

    await createProfile(mode,name,restoreState(data.state),invite);

    } else if(shopTab==='decor'){
      h+=`<div class="sec">사서 밭 위·아래 빈자리에 놓아요</div>`;
      h+=DECOR_ORDER.map(t=>{const d=DECOR[t]; const owned=(S.decorInv[t]||0)+S.decor.filter(x=>x===t).length; return `<div class="row"><svg class="ic" viewBox="0 0 100 100">${decorSVG(t).replace(/<svg[^>]*>|<\/svg>/g,'')}</svg><div class="info"><b>${d.name}${owned?` <span style="font-weight:600;opacity:.6;font-size:12px">가진 것 ${owned}</span>`:''}</b><span>${d.desc}</span></div><div class="acts"><button class="small" data-buydecor="${t}" ${S.coins<d.cost?'disabled':''}>${COIN_SVG} ${d.cost}</button></div></div>`;}).join('');
    } else if(shopTab==='supplies'){
      h+='<div class="sec">농장 화면에서 돌보기를 누른 뒤 사용할 작물을 골라요.</div>';
      h+=Object.entries(SUPPLIES).filter(([,item])=>farmLevel()>=item.level).map(([key,item])=>`<div class="row"><span aria-hidden="true">${item.icon}</span><div class="info"><b>${item.name} · 보유 ${S.supplies[key]}</b><span>${item.note}</span></div><div class="acts"><button class="small" data-buy-supply="${key}" ${S.coins<item.cost?'disabled':''} aria-label="${item.name} 사기 · ${item.cost}코인">${COIN_SVG} ${item.cost}</button></div></div>`).join('');
    } else {
      h=farmGrowthPanel();
    }
    body.innerHTML=h;
  } else if(sheetOpen==='settings'){
    $('sheetTitle').textContent='🔈 소리와 설정';
    body.innerHTML=`<div class="row"><div class="info"><b>🌧️ 빗소리</b><span>비 오는 날 잔잔한 빗소리를 들려줘요</span></div><button class="toggle ${S.sound.rain?'on':''}" id="tRain" aria-label="빗소리"></button></div>
      <div class="row"><div class="info"><b>💧 물 주는 소리 · 효과음</b><span>물주기, 수확, 판매할 때 소리가 나요</span></div><button class="toggle ${S.sound.sfx?'on':''}" id="tSfx" aria-label="효과음"></button></div>
      <div class="empty-note" style="padding:14px 4px 4px">${saveMessage()}</div>
      <button class="small alt sellall" id="resetBtn" style="margin-top:4px">농장 처음부터 다시 시작</button>`;
  }
}
$('sheetBody').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(sheetOpen==='profiles'){ if(!b.form||b.type!=='submit') profileButton(b); return; }
  const d=b.dataset;
  if(d.sell1||d.sellall){ const t=d.sell1||d.sellall; const n=d.sell1?1:S.basket[t]; sell(t,n,b); }
  else if(b.id==='sellEvery'){ let total=0; CROP_ORDER.forEach(t=>{ if(S.basket[t]){ total+=S.basket[t]*CROPS[t].price; S.basket[t]=0; } }); gain(total,b); }
  else if(d.place){ closeSheet(); startPlace(d.place); }
  else if(d.buyseed){ const c=CROPS[d.buyseed]; if(S.coins<c.cost) return; S.coins-=c.cost; S.seeds[d.buyseed]=(S.seeds[d.buyseed]||0)+1; Snd.coin(); toast(`${c.name} 씨앗을 샀어요 · 빈 밭을 눌러 심어요`); saveNow(); renderHUD(); renderSheet(); }
  else if(d.buydecor){ const t=d.buydecor, c=DECOR[t]; if(S.coins<c.cost) return; S.coins-=c.cost; S.decorInv[t]=(S.decorInv[t]||0)+1; Snd.coin(); saveNow(); renderHUD(); closeSheet(); startPlace(t); }
  else if(d.buySupply){
    const item=SUPPLIES[d.buySupply];
    if(!item||farmLevel()<item.level||S.coins<item.cost) return;
    S.coins-=item.cost; S.supplies[d.buySupply]++;
    saveNow(); Snd.coin(); renderHUD(); renderSheet();
    const buyNext=$('sheetBody').querySelector(`[data-buy-supply="${d.buySupply}"]:not(:disabled)`);
    (buyNext||$('sheetClose')).focus({preventScroll:true});
    toast(`${item.name} 1개를 샀어요`);
  }
  else if(b.id==='buyLand') buyFarmUpgrade();
  else if(b.id==='toggleAuto'&&S.smart){
    S.autoWater=!S.autoWater;
    if(S.autoWater){ waterAutomatically('outdoor'); waterAutomatically('greenhouse'); }
    saveNow(); renderAll(); renderSheet(); $('toggleAuto').focus({preventScroll:true});
  }
  else if(b.id==='tRain'){ S.sound.rain=!S.sound.rain; Snd.ensure(); saveNow(); renderSheet(); renderHUD(); Snd.updateRain(); if(S.sound.rain&&S.weather!=='rain') toast('비 오는 날에 빗소리가 들려요'); }
  else if(b.id==='tSfx'){ S.sound.sfx=!S.sound.sfx; Snd.ensure(); saveNow(); renderSheet(); renderHUD(); if(S.sound.sfx) Snd.water(); }
  else if(b.id==='resetBtn') resetCurrentFarm(b);
});
$('sheetTabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab],[data-save-view]');
  if(!b||profileBusy) return;
  if(b.dataset.saveView){
    saveView=b.dataset.saveView; profileError='';
    if(saveView==='server'&&!serverReady) void openCloudStorage();
  }
  else shopTab=b.dataset.tab;
  renderSheet(); $('sheetBody').scrollTop=0; $('sheetTabs').querySelector('.on')?.focus({preventScroll:true});
});
function sell(t,n,btn){ if(!S.basket[t]) return; n=Math.min(n,S.basket[t]); S.basket[t]-=n; gain(n*CROPS[t].price,btn); }
function gain(amount,btn){ if(!amount) return; S.coins+=amount; S.flags.sold=true; Snd.coin(); const [x,y]=centerOf(btn,.3); floatText(x,y,`+${amount}`); const cp=$('coinPill'); cp.classList.remove('bounce'); void cp.offsetWidth; cp.classList.add('bounce'); saveNow(); renderHUD(); renderHint(); renderSheet(); }

$('basketBtn').addEventListener('click',()=>openSheet('basket'));
$('shopBtn').addEventListener('click',()=>openSheet('shop'));
$('setBtn').addEventListener('click',()=>openSheet('settings'));
$('nextBtn').addEventListener('click',nextDay);
$('growthBtn').addEventListener('click',()=>openSheet('growth'));
$('profileBtn').addEventListener('click',openProfiles);
$('careBtn').addEventListener('click',()=>{ if(!busy){ cancelPlace(); setCareMode(!careMode); } });
$('fieldSwitch').addEventListener('click',e=>{
  const field=e.target.closest('[data-field]')?.dataset.field;
  if(!busy&&field) changeField(field);
});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(sheetOpen) closeSheet();
    else if(popAnchor) closePopover();
    else if(placing) cancelPlace();
    else if(careMode) setCareMode(false);
    return;
  }
  const dialog=sheetOpen?sheet:popAnchor?pop:null;
  if(e.key!=='Tab'||!dialog) return;
  const controls=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled)')].filter(el=>el.getClientRects().length);
  const first=controls[0], last=controls.at(-1);
  if(!dialog.contains(document.activeElement)||(e.shiftKey?document.activeElement===first:document.activeElement===last)){
    e.preventDefault(); (e.shiftKey?last:first)?.focus({preventScroll:true});
  }
});
addEventListener('resize',()=>{ layout(); sizeRain(); requestAnimationFrame(positionPopover); });
// 첫 터치 뒤에 오디오 준비 (소리가 켜져 있을 때만)
addEventListener('pointerdown',()=>{ if(S.sound.rain||S.sound.sfx){ Snd.ensure(); Snd.updateRain(); } },{once:true});

/* 시작 */
renderAll(); layout(); sizeRain(); requestAnimationFrame(frame);
if(window.ResizeObserver) new ResizeObserver(layout).observe($('stage'));
void initFarms();
</script>
</body>
</html>
