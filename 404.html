<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
  <meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>이동하는 중 · KJE</title>
<style>
:root{color-scheme:light dark;--ink:light-dark(#1d2433,#e8eaf0);--muted:light-dark(#5b6475,#a9b0bf);--paper:light-dark(#f7f6f2,#16181d);--line:light-dark(#d9d6cc,#343844);--accent:light-dark(#24569a,#8db4ec)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 20px}
h1{font-size:24px;margin:0 0 8px}
p{margin:0 0 14px;color:var(--muted)}
a{color:var(--accent)}
ul{list-style:none;padding:0;margin:20px 0 0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
li code{font:14px ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
li span{color:var(--muted);text-align:right}
</style>
</head>
<body>
<main>
<h1 id="t">이동하는 중이에요</h1>
<p id="m">잠시만 기다려 주세요.</p>
<div id="list"></div>
</main>
<script>
/* 짧은 주소: kjelab.kr/gas 처럼 없는 경로로 들어오면 GitHub Pages가 이 페이지를 보여 준다.
   content/shortlinks.json에서 첫 경로(key)를 찾아 그 사이트 안의 주소로 옮긴다.
   - 사이트 밖 주소로는 보내지 않는다 (path는 '/'로 시작하는 이 사이트 경로만).
   - param이 있는 주소는 두 번째 경로를 값으로 붙인다: /ar/chojigo-nature → exhibit.html?ex=chojigo-nature */
(function(){
  var parts=location.pathname.replace(/^\/+|\/+$/g,'').split('/'),key=(parts[0]||'').toLowerCase(),rest=parts.slice(1).join('/');
  function show(title,msg,links){
    document.title=title+' · KJE';document.getElementById('t').textContent=title;document.getElementById('m').innerHTML=msg;
    if(links&&links.length){var ul=document.createElement('ul');links.forEach(function(l){var li=document.createElement('li'),a=document.createElement('a'),c=document.createElement('code'),s=document.createElement('span');
      a.href='/'+l.key;c.textContent=location.host+'/'+l.key;a.appendChild(c);s.textContent=l.label;li.appendChild(a);li.appendChild(s);ul.appendChild(li)});
      document.getElementById('list').appendChild(ul)}
  }
  fetch('/content/shortlinks.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var links=(d&&d.links)||[],hit=null;
    for(var i=0;i<links.length;i++)if(String(links[i].key).toLowerCase()===key){hit=links[i];break}
    var path=hit&&String(hit.path||'');
    if(!hit||path.charAt(0)!=='/'||path.charAt(1)==='/'){
      show('없는 주소예요','주소를 다시 확인해 주세요. <a href="/">홈으로 가기</a> · 쓸 수 있는 짧은 주소는 아래와 같아요.',links);return}
    var url=path;
    if(rest&&hit.param){
      if(!/^[a-z0-9-]{1,40}$/i.test(rest)){show('없는 주소예요','‘'+location.host+'/'+key+'/’ 뒤에는 영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요. <a href="/'+key+'">'+hit.label+' 열기</a>');return}
      url+=(url.indexOf('?')<0?'?':'&')+encodeURIComponent(hit.param)+'='+encodeURIComponent(rest.toLowerCase());
    }
    if(location.search)url+=(url.indexOf('?')<0?'?':'&')+location.search.slice(1);
    url+=location.hash;location.replace(url);
  }).catch(function(){show('주소를 찾지 못했어요','잠시 뒤 다시 열어 보거나 <a href="/">홈</a>에서 찾아 주세요.')});
})();
</script>
</body>
</html>
