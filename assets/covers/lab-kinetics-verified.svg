<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">반응 속도 가상 실험실</title><desc id="desc">반응의 빠르기는 시간에 따른 변화로 비교</desc><defs><marker id="n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17394c"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c56d50"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6fabc0"/></marker><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="8"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".035"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><rect x="0" y="0" width="900" height="600" rx="0" fill="#f8f1df" stroke="none" stroke-width="3"/><rect x="0" y="0" width="900" height="600" fill="#f8f1df" filter="url(#paper)"/><rect x="17" y="17" width="866" height="566" rx="3" fill="none" stroke="#17394c" stroke-width="3"/><text x="48" y="82" font-size="38" text-anchor="start" fill="#17394c" font-weight="700">반응 속도 가상 실험실</text><text x="49" y="121" font-size="20" text-anchor="start" fill="#516570" font-weight="500">반응의 빠르기는 시간에 따른 변화로 비교</text><path d="M49 146 H145" fill="none" stroke="#c56d50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M115 462 H760 M115 462 V211" fill="none" stroke="#17394c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="218" font-size="22" text-anchor="start" fill="#17394c" font-weight="500">부피</text><text x="748" y="500" font-size="22" text-anchor="start" fill="#17394c" font-weight="500">시간</text><path d="M118 460 C190 345 258 288 338 263 S508 240 739 240" fill="none" stroke="#c56d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M118 460 C240 410 353 340 466 295 S628 251 739 243" fill="none" stroke="#6fabc0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="570" y="208" font-size="21" text-anchor="start" fill="#17394c" font-weight="500">같은 최종 부피</text><text x="450" y="547" font-size="19" text-anchor="middle" fill="#17394c" font-weight="500">기체 발생량의 시간 변화 · 수치 없는 개념 그래프</text></g></svg>