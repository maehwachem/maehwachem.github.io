<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>「학교장허가 교외체험학습」 결과보고서(별지)</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; }
  :root { --font: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  html, body { margin: 0; padding: 0; }
  body { background: #e9ecef; font-family: var(--font); color: #111; }

  /* 상단 도구 막대 (인쇄 시 숨김) */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    padding: 10px 12px; background: #fff; border-bottom: 1px solid #d0d5db;
  }
  .toolbar button {
    font-family: var(--font); font-size: 14px; padding: 8px 14px;
    border: 1px solid #9aa4ae; border-radius: 6px; background: #f8f9fa; cursor: pointer;
  }
  .toolbar button.primary { background: #2f6fdd; border-color: #2f6fdd; color: #fff; }
  .toolbar button:hover { filter: brightness(0.95); }
  .toolbar .count { font-size: 13px; color: #555; margin-left: 4px; }

  /* 두 손가락 동작은 보고서 확대·축소에 쓰고, 한 손가락은 스크롤 그대로 */
  /* 화면 = 도구 막대 + 보고서 영역. 보고서가 커져도 페이지 전체가 아니라 보고서 영역 안에서만 스크롤 */
  body { touch-action: pan-x pan-y; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  .toolbar { flex: none; }
  .viewport { flex: 1; min-height: 0; overflow: auto; padding: 20px 8px 40px; }
  /* 확대·축소: 바깥 상자 크기를 배율만큼 잡고, 용지는 그 안에서 transform으로 키움 */
  .zoomwrap { --z: 1; width: calc(210mm * var(--z)); height: calc(297mm * var(--z)); margin: 0 auto; }
  .zoomwrap .page { margin: 0; transform: scale(var(--z)); transform-origin: 0 0; }
  .toolbar .zoom { display: inline-flex; align-items: center; gap: 4px; }
  .toolbar .zoom button { min-width: 38px; padding: 8px 10px; }
  .toolbar #zPct { min-width: 44px; text-align: center; font-size: 13px; color: #333; }
  .toolbar .viewgrp { display: inline-flex; align-items: center; gap: 8px; }
  /* 휴대폰: 도구 막대를 두 줄(작업 버튼 / 장수·확대축소)로 작게 */
  @media (max-width: 640px) {
    .toolbar { gap: 6px; padding: 6px 6px; }
    .toolbar button { font-size: 13px; padding: 6px 9px; }
    .toolbar .more { display: none; }
    .toolbar .viewgrp { flex-basis: 100%; justify-content: center; }
    .toolbar .zoom button { min-width: 32px; padding: 5px 8px; }
    .toolbar #zPct { min-width: 38px; }
  }
  /* A4 용지 */
  .page {
    position: relative; width: 210mm; height: 297mm; margin: 0 auto;
    background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .title {
    position: absolute; left: 0; right: 0; top: 7.5mm;
    text-align: center; font-size: 18pt; font-weight: 700; letter-spacing: 1.2mm;
  }
  /* 머리 칸 */
  .head {
    position: absolute; left: 22.9mm; top: 22.9mm; width: 164.7mm; height: 10.5mm;
    display: grid; grid-template-columns: 20.7mm 43.2mm 30.1mm 1fr;
    font-size: 10pt;
  }
  .head > div { display: flex; align-items: center; justify-content: center; }
  .head .label { background: #eef1f6; letter-spacing: 1.5mm; }
  .head input {
    font-family: var(--font); font-size: 10pt; border: none; outline: none; background: transparent;
    text-align: center; padding: 0; color: #111;
  }
  .head input:focus { background: #fff8d6; }
  .head .name input { width: 100%; height: 100%; }
  .head .cls { gap: 0; }
  .head .cls input { width: 10mm; }
  .head .cls span { white-space: nowrap; }

  /* 사진 칸 5×2 */
  .grid {
    position: absolute; left: 22.9mm; top: 33.4mm; width: 164.7mm; height: 231.6mm;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, 1fr);
  }
  .cell { position: relative; cursor: pointer; }
  /* 사진이 들어가는 안쪽 영역: 확대해도 이 안에서만 보임 */
  .cell .frame { position: absolute; inset: 1mm; overflow: hidden; }
  /* 사진 위치·크기는 스크립트가 mm 단위로 지정 (칸 밖으로 나간 부분은 잘림) */
  .cell img { position: absolute; max-width: none; max-height: none; pointer-events: none; user-select: none; }
  /* 표 선: 사진 위에 겹쳐 그려서 사진·화면 배율과 관계없이 항상 보이게 함 */
  .lines {
    position: absolute; left: 22.9mm; top: 22.9mm; width: 164.7mm; height: 242.1mm;
    pointer-events: none; overflow: visible; z-index: 2;
  }
  /* 사진 자르기 창 */
  .editor {
    position: fixed; inset: 0; z-index: 50; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 16px; background: rgba(20,24,30,.92); color: #fff; font-family: var(--font);
  }
  .editor.open { display: flex; }
  /* 글자·버튼은 틀 밖 어두운 부분과 사진보다 위에 */
  .editor > * { position: relative; z-index: 1; }
  .editor > .stage { z-index: 0; }
  .editor h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .editor .tip { margin: 0; font-size: 13px; color: #c9d1da; text-align: center; }
  /* 자르는 틀: 칸과 같은 가로세로 비율, 틀 밖은 어둡게 보여 줌 */
  .editor .stage { position: relative; touch-action: none; cursor: grab; }
  .editor .stage:active { cursor: grabbing; }
  .editor .win {
    position: absolute; inset: 0; outline: 2px solid #fff;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.55); pointer-events: none;
  }
  .editor .stage img { position: absolute; max-width: none; max-height: none; pointer-events: none; user-select: none; }
  .editor .stage .bg { position: absolute; inset: 0; background: #fff; }
  .editor .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .editor input[type=range] { width: min(60vw, 280px); }
  .editor .pct { min-width: 48px; font-size: 13px; text-align: right; }
  .editor button {
    font-family: var(--font); font-size: 14px; padding: 8px 14px; border-radius: 6px;
    border: 1px solid #8a96a3; background: #2a313a; color: #fff; cursor: pointer;
  }
  .editor button.primary { background: #2f6fdd; border-color: #2f6fdd; }
  .editor button.danger { border-color: #c96b6b; color: #ffb3b3; }
  .cell .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9aa4ae; font-size: 11pt;
  }
  .cell:hover { background: #f4f8ff; }
  .cell.filled .hint { display: none; }
  .cell .del {
    position: absolute; top: 1.5mm; right: 1.5mm; width: 7mm; height: 7mm; border-radius: 50%; z-index: 3;
    border: none; background: rgba(0,0,0,.6); color: #fff; font-size: 12pt; line-height: 7mm;
    cursor: pointer; display: none; padding: 0;
  }
  .cell.filled:hover .del { display: block; }

  @media print {
    body { background: #fff; display: block; height: auto; overflow: visible; }
    .toolbar, .hint, .del, .editor { display: none !important; }
    .viewport { padding: 0; overflow: visible; }
    .zoomwrap { width: auto; height: auto; margin: 0; }
    .zoomwrap .page { transform: none !important; }
    .page { box-shadow: none; margin: 0; }
    .cell:hover { background: none; }
    .head input:focus { background: transparent; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="primary" id="btnAdd">사진 선택<span class="more"> (여러 장 가능)</span></button>
  <button id="btnClear"><span class="more">사진 </span>모두 지우기</button>
  <button id="btnPrint">인쇄</button>
  <button id="btnPdf">PDF로 내보내기</button>
  <span class="viewgrp">
  <span class="count" id="count">0 / 10장</span>
  <span class="zoom" aria-label="보고서 확대·축소">
    <button id="zOut" title="축소">－</button>
    <span id="zPct">100%</span>
    <button id="zIn" title="확대">＋</button>
    <button id="zFit">화면 맞춤</button>
  </span>
  </span>
</div>

<div class="viewport">
  <div class="zoomwrap" id="zoomwrap"><div class="page" id="page">
    <div class="title">「학교장허가 교외체험학습」 결과보고서(별지)</div>
    <div class="head">
      <div class="label">성명</div>
      <div class="name"><input id="inName" type="text" autocomplete="off"></div>
      <div class="label" style="letter-spacing:1mm">학년 반</div>
      <div class="cls">
        <span>3 학년&nbsp;</span><input id="inBan" type="text" inputmode="numeric" autocomplete="off"><span>반&nbsp;</span><input id="inBeon" type="text" inputmode="numeric" autocomplete="off"><span>번</span>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <svg class="lines" viewBox="0 0 164.7 242.1" preserveAspectRatio="none" aria-hidden="true">
      <g stroke="#444" stroke-width="0.3" fill="none">
        <line x1="20.7" y1="0" x2="20.7" y2="10.5"/>
        <line x1="63.9" y1="0" x2="63.9" y2="10.5"/>
        <line x1="94" y1="0" x2="94" y2="10.5"/>
        <line x1="0" y1="10.5" x2="164.7" y2="10.5"/>
        <line x1="0" y1="56.82" x2="164.7" y2="56.82"/>
        <line x1="0" y1="103.14" x2="164.7" y2="103.14"/>
        <line x1="0" y1="149.46" x2="164.7" y2="149.46"/>
        <line x1="0" y1="195.78" x2="164.7" y2="195.78"/>
        <line x1="82.35" y1="10.5" x2="82.35" y2="242.1" stroke-dasharray="0.6 0.6"/>
      </g>
      <rect x="0.25" y="0.25" width="164.2" height="241.6" stroke="#222" stroke-width="0.5" fill="none"/>
    </svg>
  </div></div>
</div>

<div class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <h2 id="edTitle">사진 자르기</h2>
  <p class="tip">사진을 끌어서 위치를 옮기고, 두 손가락이나 아래 막대로 크기를 바꾸세요.<br>흰 틀 안이 보고서에 들어갑니다.</p>
  <div class="stage" id="edStage"><div class="bg"></div><img id="edImg" alt="" draggable="false"><div class="win"></div></div>
  <div class="row">
    <span>크기</span>
    <input type="range" id="edRange" min="10" max="400" step="1" value="100" aria-label="사진 크기">
    <span class="pct" id="edPct">100%</span>
  </div>
  <div class="row">
    <button type="button" id="edFill">칸 채우기</button>
    <button type="button" id="edWhole">사진 전체 보기</button>
    <button type="button" id="edSwap">사진 바꾸기</button>
    <button type="button" id="edDel" class="danger">지우기</button>
  </div>
  <div class="row">
    <button type="button" id="edCancel">취소</button>
    <button type="button" id="edApply" class="primary">적용</button>
  </div>
</div>

<input type="file" id="fileMulti" accept="image/*" multiple hidden>
<input type="file" id="fileOne" accept="image/*" hidden>

<script>
const MAX = 10;
const photos = new Array(MAX).fill(null);   // 각 칸의 이미지 dataURL
// 칸 안쪽(사진 영역) 크기, mm
const FW = 164.7 / 2 - 2, FH = 231.6 / 5 - 2;
// 각 칸의 보기 상태: z = 칸 채우기 기준 배율(1 = 꽉 채움), ox·oy = 가운데에서 옮긴 거리(mm), w·h = 원본 픽셀 크기
const views = Array.from({ length: MAX }, () => ({ z: 1, ox: 0, oy: 0, w: 0, h: 0 }));
const ZMAX = 4;
const grid = document.getElementById('grid');
const fileMulti = document.getElementById('fileMulti');
const fileOne = document.getElementById('fileOne');
let targetSlot = null;

const coverOf = v => Math.max(FW / v.w, FH / v.h);              // 칸을 꽉 채우는 배율(mm/px)
const wholeOf = v => Math.min(FW / v.w, FH / v.h) / coverOf(v);  // 사진 전체가 보이는 z
const zMinOf  = v => wholeOf(v) * 0.3;                           // 전체 보기의 30%까지 줄일 수 있음

// 범위 제한: 사진이 칸보다 크면 빈 곳이 생기지 않게, 작으면 그 방향은 가운데로
function clampView(v) {
  v.z = Math.min(ZMAX, Math.max(zMinOf(v), v.z));
  const k = coverOf(v) * v.z, dw = v.w * k, dh = v.h * k;
  const mx = Math.max(0, (dw - FW) / 2), my = Math.max(0, (dh - FH) / 2);
  v.ox = Math.min(mx, Math.max(-mx, v.ox));
  v.oy = Math.min(my, Math.max(-my, v.oy));
  return { dw, dh };
}
// 칸 안쪽 왼쪽 위 기준으로 사진이 놓일 자리(mm) — 화면·자르기 창·PDF가 같이 씀
function layoutOf(v) {
  const { dw, dh } = clampView(v);
  return { x: (FW - dw) / 2 + v.ox, y: (FH - dh) / 2 + v.oy, dw, dh };
}

function render(i) {
  const v = views[i], img = grid.children[i].querySelector('img');
  if (!photos[i] || !v.w) return;
  const L = layoutOf(v);
  Object.assign(img.style, { left: L.x + 'mm', top: L.y + 'mm', width: L.dw + 'mm', height: L.dh + 'mm' });
}

// 칸 만들기
for (let i = 0; i < MAX; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  c.dataset.i = i;
  c.innerHTML = `<div class="hint">+ 사진 ${i + 1}</div>
    <div class="frame"><img alt="" hidden draggable="false"></div>
    <button class="del" title="이 사진 지우기">×</button>`;
  c.addEventListener('click', e => {
    if (e.target.classList.contains('del')) { setPhoto(i, null); return; }
    if (photos[i]) { openEditor(i); return; }                 // 사진 있는 칸: 자르기 창
    targetSlot = i; fileOne.value = ''; fileOne.click();       // 빈 칸: 사진 고르기
  });
  grid.appendChild(c);
}

function setPhoto(i, url) {
  photos[i] = url;
  const c = grid.children[i], img = c.querySelector('img');
  Object.assign(views[i], { z: 1, ox: 0, oy: 0, w: 0, h: 0 });   // 새 사진은 칸을 채우게 가운데 기준으로 자름
  if (url) {
    img.onload = () => { views[i].w = img.naturalWidth; views[i].h = img.naturalHeight; render(i); };
    img.src = url; img.hidden = false; c.classList.add('filled');
  } else {
    img.onload = null; img.removeAttribute('src'); img.removeAttribute('style'); img.hidden = true;
    c.classList.remove('filled');
  }
  document.getElementById('count').textContent = photos.filter(Boolean).length + ' / 10장';
}

/* ---------- 사진 자르기 창 ---------- */
const editor = document.getElementById('editor');
const edStage = document.getElementById('edStage'), edImg = document.getElementById('edImg');
const edRange = document.getElementById('edRange'), edPct = document.getElementById('edPct');
let ed = null;   // { i, v: 편집 중인 보기 상태 사본, k: 화면 px/mm }

function openEditor(i) {
  if (!views[i].w) return;
  const v = { ...views[i] };
  // 틀 크기: 화면에 맞게, 칸과 같은 비율
  const maxW = Math.min(window.innerWidth - 40, 640), maxH = window.innerHeight * 0.5;
  const k = Math.min(maxW / FW, maxH / FH);
  edStage.style.width = FW * k + 'px'; edStage.style.height = FH * k + 'px';
  edImg.src = photos[i];
  document.getElementById('edTitle').textContent = `사진 ${i + 1} 자르기`;
  ed = { i, v, k };
  edRange.min = Math.round(zMinOf(v) * 100); edRange.max = ZMAX * 100;
  editor.classList.add('open');
  drawEditor();
}
function drawEditor() {
  const { v, k } = ed, L = layoutOf(v);
  Object.assign(edImg.style, { left: L.x * k + 'px', top: L.y * k + 'px', width: L.dw * k + 'px', height: L.dh * k + 'px' });
  edRange.value = Math.round(v.z * 100);
  edPct.textContent = Math.round(v.z * 100) + '%';
}
function closeEditor() { editor.classList.remove('open'); ed = null; }

edRange.addEventListener('input', () => { ed.v.z = edRange.value / 100; drawEditor(); });
document.getElementById('edFill').onclick = () => { Object.assign(ed.v, { z: 1, ox: 0, oy: 0 }); drawEditor(); };
document.getElementById('edWhole').onclick = () => { Object.assign(ed.v, { z: wholeOf(ed.v), ox: 0, oy: 0 }); drawEditor(); };
document.getElementById('edSwap').onclick = () => { targetSlot = ed.i; closeEditor(); fileOne.value = ''; fileOne.click(); };
document.getElementById('edDel').onclick = () => { const i = ed.i; closeEditor(); setPhoto(i, null); };
document.getElementById('edCancel').onclick = closeEditor;
document.getElementById('edApply').onclick = () => { Object.assign(views[ed.i], ed.v); render(ed.i); closeEditor(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ed) closeEditor(); });

// 끌기(마우스·한 손가락), 두 손가락 확대·축소, 마우스 휠 확대·축소
(() => {
  const pts = new Map();
  let st = null;
  const toMM = (x, y) => {   // 화면 좌표 → 틀 가운데 기준 mm
    const r = edStage.getBoundingClientRect();
    return { x: (x - r.left - r.width / 2) / ed.k, y: (y - r.top - r.height / 2) / ed.k };
  };
  const snap = () => {
    const a = [...pts.values()], v = ed.v;
    if (a.length >= 2) st = { two: true, z: v.z, ox: v.ox, oy: v.oy, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1,
                              m: toMM((a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2) };
    else if (a.length === 1) st = { two: false, ox: v.ox, oy: v.oy, x: a[0].x, y: a[0].y };
    else st = null;
  };
  // 기준점(m) 아래의 사진 부분이 그대로 머물게 배율 변경
  const zoomAt = (z, m, base) => {
    const v = ed.v;
    z = Math.min(ZMAX, Math.max(zMinOf(v), z));
    v.ox = m.x - (base.m.x - base.ox) * z / base.z;
    v.oy = m.y - (base.m.y - base.oy) * z / base.z;
    v.z = z;
  };
  edStage.addEventListener('pointerdown', e => {
    if (!ed) return;
    e.preventDefault(); edStage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); snap();
  });
  edStage.addEventListener('pointermove', e => {
    if (!ed || !pts.has(e.pointerId) || !st) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const a = [...pts.values()];
    if (st.two && a.length >= 2) {
      zoomAt(st.z * Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) / st.d, toMM((a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2), st);
    } else if (!st.two) {
      ed.v.ox = st.ox + (e.clientX - st.x) / ed.k;
      ed.v.oy = st.oy + (e.clientY - st.y) / ed.k;
    }
    drawEditor();
  });
  const end = e => { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if (ed) { clampView(ed.v); snap(); } };
  edStage.addEventListener('pointerup', end);
  edStage.addEventListener('pointercancel', end);
  edStage.addEventListener('wheel', e => {
    if (!ed) return;
    e.preventDefault();
    const v = ed.v, m = toMM(e.clientX, e.clientY);
    zoomAt(v.z * Math.exp(-e.deltaY * 0.0015), m, { z: v.z, ox: v.ox, oy: v.oy, m });
    drawEditor();
  }, { passive: false });
})();

function readFile(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

// 여러 장 선택: 빈 칸을 앞에서부터 1장씩 채움
document.getElementById('btnAdd').onclick = () => { fileMulti.value = ''; fileMulti.click(); };
fileMulti.onchange = async () => {
  const files = [...fileMulti.files].filter(f => f.type.startsWith('image/'));
  const empty = photos.map((p, i) => p ? -1 : i).filter(i => i >= 0);
  if (files.length > empty.length) {
    alert(`빈 칸이 ${empty.length}개라서 앞의 ${empty.length}장만 넣습니다.`);
  }
  for (let k = 0; k < Math.min(files.length, empty.length); k++) {
    setPhoto(empty[k], await readFile(files[k]));
  }
};
// 칸을 눌러 1장 선택(교체)
fileOne.onchange = async () => {
  const f = fileOne.files[0];
  if (f && targetSlot !== null) setPhoto(targetSlot, await readFile(f));
};

document.getElementById('btnClear').onclick = () => {
  if (photos.some(Boolean) && confirm('넣은 사진을 모두 지울까요?')) {
    for (let i = 0; i < MAX; i++) setPhoto(i, null);
  }
};
document.getElementById('btnPrint').onclick = () => window.print();

/* ---------- 보고서 확대·축소 (버튼, 두 손가락) ---------- */
const zoomwrap = document.getElementById('zoomwrap');
const viewport = document.querySelector('.viewport');
const PAGE_PX = 210 * 96 / 25.4;           // 100%일 때 용지 너비(px)
const ZOOM_MIN = 0.3, ZOOM_MAX = 3;
let zoom = 1;
// anchor(화면 좌표)를 주면 그 지점의 내용이 손가락·화면 아래에 그대로 머물게 스크롤을 맞춤
function setZoom(z, anchor) {
  z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  let px, py;
  if (anchor) {
    const r = zoomwrap.getBoundingClientRect();
    px = (anchor.x - r.left) / zoom; py = (anchor.y - r.top) / zoom;
  }
  zoom = z;
  zoomwrap.style.setProperty('--z', z);
  document.getElementById('zPct').textContent = Math.round(z * 100) + '%';
  if (anchor) {
    const r = zoomwrap.getBoundingClientRect();
    viewport.scrollBy(r.left + px * z - anchor.x, r.top + py * z - anchor.y);
  }
}
const fitZoom = () => (viewport.clientWidth - 16) / PAGE_PX;
const center = () => { const r = viewport.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
document.getElementById('zIn').onclick = () => (autoFit = false, setZoom(Math.round(zoom * 100 + 10) / 100, center()));
document.getElementById('zOut').onclick = () => (autoFit = false, setZoom(Math.round(zoom * 100 - 10) / 100, center()));
let autoFit = false;   // '화면 맞춤' 상태면 화면 크기가 바뀔 때(회전 등) 다시 맞춤
const doFit = () => { setZoom(fitZoom()); viewport.scrollTo({ left: 0 }); autoFit = true; };
document.getElementById('zFit').onclick = doFit;
window.addEventListener('resize', () => { if (autoFit) doFit(); });
// 화면이 용지보다 좁으면(휴대폰 등) 처음에 화면 너비에 맞춤
if (fitZoom() < 1) doFit();

let pinch = null;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
const mid = t => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });
document.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && !ed) pinch = { d: dist(e.touches), z: zoom };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2 || ed) return;
  e.preventDefault();
  autoFit = false;
  setZoom(pinch.z * dist(e.touches) / pinch.d, mid(e.touches));
}, { passive: false });
document.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
document.addEventListener('touchcancel', () => { pinch = null; });
// iPhone·iPad 사파리의 기본 화면 확대 막기 (보고서 확대로 대신함)
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- PDF 내보내기 (외부 라이브러리 없이) ---------- */
const MM = 200 / 25.4;               // 200dpi 기준 1mm 당 픽셀
const W = Math.round(210 * MM), H = Math.round(297 * MM);
const FONT = '"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif';

function loadImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}

function spacedText(ctx, text, cx, cy, spacing) {
  // 글자 사이 간격을 두고 가운데 정렬
  const chars = [...text];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let x = cx - total / 2;
  ctx.textAlign = 'left';
  chars.forEach((ch, k) => { ctx.fillText(ch, x, cy); x += widths[k] + spacing; });
}

async function renderCanvas() {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const m = v => v * MM;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#111'; ctx.textBaseline = 'middle';

  // 제목
  ctx.font = `700 ${m(6.35)}px ${FONT}`;
  spacedText(ctx, '「학교장허가 교외체험학습」 결과보고서(별지)', W / 2, m(13.8), m(1.2));

  const L = 22.9, T = 22.9, TW = 164.7, HH = 10.5;
  const cols = [20.7, 43.2, 30.1, TW - 20.7 - 43.2 - 30.1];
  // 머리 칸 배경
  ctx.fillStyle = '#eef1f6';
  ctx.fillRect(m(L), m(T), m(cols[0]), m(HH));
  ctx.fillRect(m(L + cols[0] + cols[1]), m(T), m(cols[2]), m(HH));
  // 머리 칸 글자
  ctx.fillStyle = '#111';
  ctx.font = `${m(3.53)}px ${FONT}`;
  const cy = m(T + HH / 2);
  spacedText(ctx, '성명', m(L + cols[0] / 2), cy, m(1.5));
  spacedText(ctx, document.getElementById('inName').value, m(L + cols[0] + cols[1] / 2), cy, 0);
  spacedText(ctx, '학년 반', m(L + cols[0] + cols[1] + cols[2] / 2), cy, m(1));
  const ban = document.getElementById('inBan').value, beon = document.getElementById('inBeon').value;
  // "3 학년 [반] 반 [번] 번" — 화면과 같은 배치
  const x4 = L + cols[0] + cols[1] + cols[2], c4 = x4 + cols[3] / 2;
  const parts = [['3 학년 ', null], [ban, 10], ['반 ', null], [beon, 10], ['번', null]];
  const pw = parts.map(([t, fix]) => fix ? m(fix) : ctx.measureText(t).width);
  let px = m(c4) - pw.reduce((a, b) => a + b, 0) / 2;
  parts.forEach(([t, fix], k) => {
    ctx.textAlign = fix ? 'center' : 'left';
    ctx.fillText(t, fix ? px + pw[k] / 2 : px, cy);
    px += pw[k];
  });

  // 사진
  const GT = T + HH, GH = 231.6, RH = GH / 5, CW = TW / 2;
  for (let i = 0; i < MAX; i++) {
    if (!photos[i]) continue;
    const im = await loadImg(photos[i]);
    const r = Math.floor(i / 2), c = i % 2;
    const fx = L + c * CW + 1, fy = GT + r * RH + 1;
    const P = layoutOf(views[i]);
    ctx.save();
    ctx.beginPath(); ctx.rect(m(fx), m(fy), m(FW), m(FH)); ctx.clip();   // 칸 안쪽만 보이게 자름
    ctx.drawImage(im, m(fx + P.x), m(fy + P.y), m(P.dw), m(P.dh));
    ctx.restore();
  }

  // 선
  ctx.strokeStyle = '#444'; ctx.lineWidth = m(0.3);
  const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(m(x1), m(y1)); ctx.lineTo(m(x2), m(y2)); ctx.stroke(); };
  let xx = L;
  for (let k = 0; k < 3; k++) { xx += cols[k]; line(xx, T, xx, T + HH); }   // 머리 칸 세로선
  line(L, GT, L + TW, GT);                                                    // 머리 칸 아래선
  for (let r = 1; r < 5; r++) line(L, GT + r * RH, L + TW, GT + r * RH);     // 사진 칸 가로선
  ctx.setLineDash([m(0.6), m(0.6)]);
  line(L + CW, GT, L + CW, GT + GH);                                          // 가운데 점선
  ctx.setLineDash([]);
  ctx.strokeStyle = '#222'; ctx.lineWidth = m(0.5);
  ctx.strokeRect(m(L), m(T), m(TW), m(HH + GH));                              // 바깥 테두리
  return cv;
}

// JPEG 한 장을 A4 한 쪽에 넣은 PDF를 직접 만듦
function buildPdf(jpegBytes, imgW, imgH) {
  const enc = new TextEncoder();
  const chunks = []; let len = 0; const offs = [];
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };
  const PW = 595.28, PH = 841.89;
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4, () => {
    push(`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    push(jpegBytes); push('\nendstream');
  });
  obj(5, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
  const xref = len;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let n = 1; n <= 5; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out = new Uint8Array(len); let p = 0;
  chunks.forEach(c => { out.set(c, p); p += c.length; });
  return out;
}

document.getElementById('btnPdf').onclick = async () => {
  const btn = document.getElementById('btnPdf');
  btn.disabled = true; btn.textContent = 'PDF 만드는 중…';
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const cv = await renderCanvas();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const pdf = buildPdf(bytes, cv.width, cv.height);
    const name = document.getElementById('inName').value.trim();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([pdf], { type: 'application/pdf' }));
    a.download = `교외체험학습_결과보고서_별지${name ? '_' + name : ''}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    alert('PDF를 만들지 못했습니다. [인쇄] → "PDF로 저장"을 이용해 주세요.\n' + e);
  } finally {
    btn.disabled = false; btn.textContent = 'PDF로 내보내기';
  }
};
</script>
